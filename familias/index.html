<style>
  :root{
    /* Mesma identidade do SERVE: coral (amar), verde-petróleo (servir), ouro (viver). */
    --coral:#E8543A; --coral-suave:#FDE7E1;
    --teal:#1F6F5C; --teal-escuro:#143F35; --teal-suave:#E1F1EC;
    --ouro:#F4B740; --ouro-suave:#FDF1D6;
    --creme:#FBF7F1; --grafite:#1B2430; --grafite-suave:#6B6459;
    --branco:#FFFFFF; --vermelho:#D64545; --vermelho-suave:#FBE4E4;
    --azul:#3B7DD8; --azul-suave:#E3EEFB; --linha:#F1ECE0;
    --radius:20px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ font-family:'Nunito',sans-serif; background:var(--creme); color:var(--grafite); min-height:100vh; -webkit-font-smoothing:antialiased; }
  h1,h2,h3,.display{ font-family:'Baloo 2',sans-serif; margin:0; color:var(--teal-escuro); }
  a{ color:var(--teal); }
  button{ font-family:inherit; }
  #app{ max-width:480px; margin:0 auto; min-height:100vh; background:var(--creme); position:relative; padding-bottom:90px; }
  #app.sem-nav{ padding-bottom:24px; }
  @media (min-width:860px){
    body{ background:linear-gradient(160deg,#FFF3E4 0%,var(--creme) 45%,#EAF6F0 100%); padding:28px 16px; }
    #app{ max-width:980px; min-height:auto; border-radius:28px; box-shadow:0 24px 60px rgba(27,36,48,0.14); overflow:hidden; }
    #app.sem-nav{ max-width:480px; }
  }

  /* ---------- Topbar ---------- */
  .topbar{ background:linear-gradient(135deg,var(--teal-escuro) 0%,var(--teal) 55%,var(--ouro) 130%); padding:20px 20px 22px; color:var(--branco); }
  .topbar-linha1{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .marca{ display:flex; align-items:center; gap:10px; min-width:0; }
  .marca-selo{ width:38px; height:38px; border-radius:12px; background:var(--branco); display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px rgba(0,0,0,.18); flex-shrink:0; }
  .marca-nome{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:19px; line-height:1.1; }
  .marca-sub{ font-size:11px; opacity:.88; }
  .topbar-acoes{ display:flex; gap:8px; align-items:center; }
  .icon-btn{ width:36px; height:36px; border-radius:50%; border:none; background:rgba(255,255,255,.18); color:var(--branco); font-size:16px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .icon-btn:active{ background:rgba(255,255,255,.32); }
  .topbar-titulo{ margin-top:14px; font-family:'Baloo 2',sans-serif; font-size:22px; font-weight:800; }
  .topbar-legenda{ margin-top:2px; font-size:13px; opacity:.92; }

  /* ---------- Componentes ---------- */
  .conteudo{ padding:16px 16px 8px; }
  .cartao{ background:var(--branco); border-radius:var(--radius); padding:16px; box-shadow:0 2px 10px rgba(27,36,48,.06); margin-bottom:14px; }
  .cartao-titulo{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:16px; color:var(--teal-escuro); margin-bottom:8px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .hint{ font-size:12.5px; color:var(--grafite-suave); line-height:1.5; margin:0; }
  .linha{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .row{ display:flex; gap:8px; flex-wrap:wrap; }
  .col{ display:flex; flex-direction:column; gap:10px; }
  .esp8{ height:8px; } .esp14{ height:14px; }
  .muted{ color:var(--grafite-suave); }
  .trunc{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  label{ font-size:12.5px; font-weight:700; color:var(--teal-escuro); display:block; margin-bottom:4px; }
  input,select,textarea{ width:100%; padding:11px 13px; border-radius:14px; border:1.5px solid #E7E0D4; font-family:inherit; font-size:14.5px; background:var(--branco); color:var(--grafite); }
  input:focus,select:focus,textarea:focus{ outline:none; border-color:var(--teal); }
  textarea{ resize:vertical; min-height:70px; }
  .campo{ margin-bottom:12px; }
  .grade-2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .grade-4{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  @media (min-width:860px){ .grade-4{ grid-template-columns:repeat(4,1fr); } .duas-colunas{ display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start; } }

  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:12px 18px; border-radius:16px; border:none; font-weight:800; font-size:14.5px; cursor:pointer; text-align:center; text-decoration:none; }
  .btn-block{ width:100%; }
  .btn-primary{ background:var(--teal); color:var(--branco); } .btn-primary:active{ background:var(--teal-escuro); }
  .btn-coral{ background:var(--coral); color:var(--branco); }
  .btn-ouro{ background:var(--ouro); color:var(--grafite); }
  .btn-secondary{ background:var(--teal-suave); color:var(--teal-escuro); }
  .btn-ghost{ background:var(--linha); color:var(--grafite); }
  .btn-danger{ background:var(--vermelho-suave); color:var(--vermelho); }
  .btn-wpp{ background:#25D366; color:#fff; }
  .btn-small{ padding:8px 12px; font-size:12.5px; border-radius:12px; }
  .btn[disabled]{ opacity:.5; pointer-events:none; }

  .badge{ display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:100px; font-size:11px; font-weight:800; background:var(--linha); color:var(--grafite-suave); white-space:nowrap; }
  .b-servir{ background:var(--teal-suave); color:var(--teal-escuro); }
  .b-amar{ background:var(--coral-suave); color:var(--coral); }
  .b-viver{ background:var(--ouro-suave); color:#8C6300; }
  .b-alerta{ background:var(--vermelho-suave); color:var(--vermelho); }
  .b-azul{ background:var(--azul-suave); color:#245DA6; }

  .chip{ padding:7px 13px; border-radius:100px; border:1.5px solid #E7E0D4; background:var(--branco); font-size:12.5px; font-weight:700; cursor:pointer; color:var(--grafite); white-space:nowrap; }

  .chips{ display:flex; gap:7px; overflow-x:auto; padding:2px 0 8px; }
  .chips .chip{ flex-shrink:0; }

  /* ---------- Busca ---------- */
  .busca{ position:relative; }
  .busca input{ padding:15px 16px 15px 46px; font-size:16.5px; font-weight:700; border-radius:18px; border:2px solid #E7E0D4; box-shadow:0 4px 14px rgba(27,36,48,.07); }

  .busca .limpar{ position:absolute; right:10px; top:50%; transform:translateY(-50%); border:none; background:var(--linha); width:28px; height:28px; border-radius:50%; cursor:pointer; font-weight:800; color:var(--grafite-suave); }

  /* ---------- Cartão de família ---------- */
  .fam{ display:flex; gap:12px; padding:12px; border-radius:16px; background:var(--branco); box-shadow:0 2px 8px rgba(27,36,48,.06); margin-bottom:9px; cursor:pointer; align-items:flex-start; border:1.5px solid transparent; }

  .fam .sub{ font-size:12.5px; color:var(--grafite-suave); margin-top:2px; }
  .avatar{ width:42px; height:42px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:16px; flex-shrink:0; color:#fff; }
  .avatar.peq{ width:34px; height:34px; border-radius:11px; font-size:13px; }
  .lista-grade{ display:block; }
  @media (min-width:860px){ .lista-grade{ display:grid; grid-template-columns:1fr 1fr; gap:0 12px; } }
  .kpi{ background:var(--branco); border-radius:18px; padding:14px; box-shadow:0 2px 10px rgba(27,36,48,.06); cursor:pointer; }
  .kpi .n{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:28px; color:var(--teal-escuro); line-height:1; }
  .kpi .l{ font-size:12px; font-weight:700; color:var(--grafite-suave); margin-top:4px; }
  .kpi.alerta .n{ color:var(--vermelho); }
  .kpi.ouro .n{ color:#8C6300; }

  .item{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 0; border-bottom:1px solid var(--linha); }
  .item:last-child{ border-bottom:none; }
  .item .t{ font-weight:800; font-size:14px; color:var(--grafite); }
  .item .s{ font-size:12px; color:var(--grafite-suave); }
  .clicavel{ cursor:pointer; }

  .barra-fundo{ background:var(--linha); border-radius:100px; height:10px; overflow:hidden; }
  .barra-cheia{ height:100%; border-radius:100px; background:linear-gradient(90deg,var(--teal),var(--ouro)); }
  .anel{ --p:0; width:92px; height:92px; border-radius:50%; background:conic-gradient(var(--teal) calc(var(--p)*1%), var(--linha) 0); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .anel > div{ width:70px; height:70px; border-radius:50%; background:var(--branco); display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:21px; color:var(--teal-escuro); line-height:1; }
  .anel small{ font-family:'Nunito'; font-size:9.5px; font-weight:800; color:var(--grafite-suave); }

  .saude{ background:var(--vermelho-suave); border-radius:12px; padding:8px 10px; font-size:12.5px; font-weight:700; color:#9B2C2C; margin-top:6px; }
  .aviso{ background:var(--ouro-suave); border-radius:14px; padding:10px 12px; font-size:12.5px; font-weight:700; color:#7a5500; margin-bottom:12px; }
  .pessoa{ padding:12px 0; border-bottom:1px solid var(--linha); }
  .pessoa:last-child{ border-bottom:none; }
  .nota{ padding:10px 12px; border-radius:14px; background:var(--creme); margin-bottom:8px; font-size:13.5px; }
  .nota .d{ font-size:11px; color:var(--grafite-suave); font-weight:800; }
  .vazio{ text-align:center; padding:30px 10px; color:var(--grafite-suave); }
  .vazio .e{ font-size:36px; display:block; margin-bottom:8px; }
  .tabela{ width:100%; border-collapse:collapse; font-size:12.5px; }
  .tabela th{ text-align:left; padding:6px 8px; background:var(--linha); font-weight:800; color:var(--teal-escuro); }
  .tabela td{ padding:6px 8px; border-bottom:1px solid var(--linha); vertical-align:top; }
  .bloco-edicao{ border:1.5px dashed #E0D8C8; border-radius:16px; padding:12px; margin-bottom:12px; }
  .passo{ display:flex; gap:10px; align-items:flex-start; padding:8px 0; }
  .passo b{ width:26px; height:26px; border-radius:50%; background:var(--teal); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; }
  .soltar{ border:2.5px dashed var(--teal); border-radius:20px; padding:30px 16px; text-align:center; background:var(--teal-suave); cursor:pointer; }
  .soltar.sobre{ background:#c9e8de; }

  /* ---------- Navegação inferior ---------- */
  .nav-inferior{ position:fixed; left:0; right:0; bottom:0; max-width:480px; margin:0 auto; background:var(--branco); border-top:1px solid var(--linha); display:flex; align-items:flex-end; box-shadow:0 -4px 14px rgba(27,36,48,.08); z-index:80; }
  @media (min-width:860px){ .nav-inferior{ max-width:980px; border-radius:0 0 28px 28px; bottom:28px; } }
  .nav-item{ flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:9px 4px 8px; border:none; background:none; cursor:pointer; color:var(--grafite-suave); font-size:10.5px; font-weight:800; }
  .nav-item:active{ transform:scale(.88); }
  .nav-bolha{ width:38px; height:25px; border-radius:13px; display:flex; align-items:center; justify-content:center; font-size:17px; position:relative; }
  .nav-item.ativo .nav-bolha{ background:var(--teal-suave); }
  .nav-item.ativo{ color:var(--teal); }
  .nav-pt{ position:absolute; top:-3px; right:-2px; min-width:16px; height:16px; border-radius:8px; background:var(--coral); color:#fff; font-size:9.5px; font-weight:800; display:flex; align-items:center; justify-content:center; padding:0 4px; }
  .nav-fab-slot{ flex:1; display:flex; justify-content:center; }
  .nav-fab{ width:54px; height:54px; margin-top:-24px; border-radius:50%; border:3px solid var(--creme); cursor:pointer; background:linear-gradient(135deg,var(--coral) 0%,#C43A24 100%); color:#fff; font-size:26px; font-weight:700; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 16px rgba(232,84,58,.4); }
  .nav-fab:active{ transform:scale(.88); }

  .toast{ position:fixed; left:50%; bottom:100px; transform:translateX(-50%); z-index:200; background:var(--grafite); color:#fff; padding:12px 18px; border-radius:14px; font-size:13.5px; font-weight:700; box-shadow:0 10px 24px rgba(0,0,0,.25); max-width:88%; text-align:center; }
  .overlay{ position:fixed; inset:0; background:rgba(27,36,48,.5); z-index:150; display:flex; align-items:flex-end; justify-content:center; }
  @media (min-width:860px){ .overlay{ align-items:center; } }
  .modal{ background:var(--branco); width:100%; max-width:480px; border-radius:24px 24px 0 0; padding:22px 18px 26px; max-height:90vh; overflow-y:auto; }
  @media (min-width:860px){ .modal{ border-radius:24px; } }
  .tela-auth{ padding:40px 26px 26px; }
  .progresso{ height:8px; background:var(--linha); border-radius:8px; overflow:hidden; margin:10px 0; }
  .progresso > div{ height:100%; background:var(--teal); width:0; transition:width .2s; }
  ::-webkit-scrollbar{ width:0; height:0; }
  @media print{ .nav-inferior,.topbar,.toast{ display:none !important; } }
</style>

<script>
/* =====================================================================
   CENTRAL DE FAMÍLIAS — banco de dados do ministério infantil
   Arquivo único, sem build (mesmo espírito do SERVE): abre e roda.
   Os dados ficam no navegador (localStorage) e, se você configurar o
   Firebase abaixo, também numa base compartilhada entre os líderes.
   ===================================================================== */

/* ============ 1) FIREBASE (opcional) ============ */
const firebaseConfig = {
  apiKey: 'COLE_AQUI_SUA_API_KEY',
  authDomain: 'COLE_AQUI.firebaseapp.com',
  projectId: 'COLE_AQUI',
  appId: 'COLE_AQUI',
};
const FIREBASE_CONFIGURADO = firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith('COLE_AQUI');
let db = null, auth = null;

/* ============ 2) UTILIDADES ============ */
const LS = 'central:';
const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = (s) => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const digitos = (s) => String(s == null ? '' : s).replace(/\D/g, '');
const pad2 = (n) => String(n).padStart(2, '0');
const isoDe = (d) => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const hojeISO = () => isoDe(new Date());
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const PALETA = ['#1F6F5C','#E8543A','#B7791F','#3B7DD8','#8E44AD','#C0392B','#16807A','#D35400'];
function corDe(s){ let h = 0; for (const c of String(s||'')) h = (h * 31 + c.charCodeAt(0)) >>> 0; return PALETA[h % PALETA.length]; }
function iniciais(nome){ const p = String(nome||'').trim().split(/\s+/).filter(Boolean); return ((p[0]||'?')[0] + (p.length > 1 ? p[p.length-1][0] : '')).toUpperCase(); }
function capitalizar(s){
  const peq = new Set(['de','da','do','das','dos','e']);
  return String(s||'').toLowerCase().split(' ').map((w,i) => /\d/.test(w) ? w.toUpperCase() : (i && peq.has(w)) ? w : w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}
function bonito(nome){ const n = String(nome||'').trim(); return (n && n === n.toUpperCase()) ? capitalizar(n) : n; }

/* Data → ISO. Aceita 23/11/2022, 2022-11-23, 23-11-22, serial do Excel e Date. */
function parseData(v){
  if (v == null || v === '') return '';
  if (v instanceof Date && !isNaN(v)) return isoDe(v);
  if (typeof v === 'number' && v > 1 && v < 80000){ const d = new Date(Math.round((v - 25569) * 86400000)); return isoDe(new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())); }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if (m){
    let a = +m[3]; if (a < 100) a += a > (new Date().getFullYear() % 100) ? 1900 : 2000;
    const mes = +m[2], dia = +m[1];
    if (mes < 1 || mes > 12 || dia < 1 || dia > 31) return '';
    return `${a}-${pad2(mes)}-${pad2(dia)}`;
  }
  return '';
}
function fmtData(iso){ const m = String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}/${m[2]}/${m[1]}` : ''; }
function idadeDe(iso, ref){
  const m = String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})/); if (!m) return null;
  const r = ref || new Date();
  let meses = (r.getFullYear() - +m[1]) * 12 + (r.getMonth() - (+m[2] - 1));
  if (r.getDate() < +m[3]) meses--;
  if (meses < 0) return null;
  return { anos: Math.floor(meses / 12), meses };
}
function idadeTexto(iso){
  const i = idadeDe(iso); if (!i) return '';
  if (i.meses < 24) return i.meses < 1 ? 'recém-nascido' : `${i.meses} ${i.meses === 1 ? 'mês' : 'meses'}`;
  if (i.anos < 6){ const r = i.meses % 12; return r ? `${i.anos} anos e ${r} m` : `${i.anos} anos`; }
  return `${i.anos} anos`;
}
function fmtTel(t){
  let d = digitos(t); if (d.length >= 12 && d.startsWith('55')) d = d.slice(2);
  if (d.length === 11) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
  if (d.length === 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return String(t||'').trim();
}
function telValido(t){ let d = digitos(t); if (d.length >= 12 && d.startsWith('55')) d = d.slice(2); return d.length === 10 || d.length === 11; }
function linkWpp(tel, msg){
  let d = digitos(tel); if (!d.startsWith('55')) d = '55' + d;
  return `https://wa.me/${d}${msg ? '?text=' + encodeURIComponent(msg) : ''}`;
}
const anosTxt = (n) => `${n} ${n === 1 ? 'ano' : 'anos'}`;
function primeiroNome(n){ return capitalizar(String(n||'').trim().split(/\s+/)[0] || ''); }

/* ============ 3) CONFIGURAÇÃO PADRÃO ============ */
const CONFIG_PADRAO = {
  igreja: 'nossa igreja',
  turmas: [
    { nome:'Berçário', min:0, max:1 },
    { nome:'Maternal', min:2, max:3 },

function lerLS(chave, padrao){ try { const v = localStorage.getItem(LS + chave); return v ? JSON.parse(v) : padrao; } catch(e){ return padrao; } }
function gravarLS(chave, valor){ try { localStorage.setItem(LS + chave, JSON.stringify(valor)); return true; } catch(e){ toast('Não foi possível salvar (espaço do navegador cheio). Exporte um backup!'); return false; } }

let salvarTimer = null; const sujos = new Set(), removidos = new Set();
/* Grava no aparelho na hora (fechar a aba não perde nada); só a nuvem é agrupada. */
function persistir(){
  gravarLS('familias', state.familias.map(semCache));
  gravarLS('config', state.config);
  clearTimeout(salvarTimer);
  salvarTimer = setTimeout(sincronizarNuvem, 400);
}
function semCache(f){ const { _h, _q, ...resto } = f; return resto; }
function marcar(f){ sujos.add(f.id); removidos.delete(f.id); f.atualizadoEm = new Date().toISOString(); }

async function sincronizarNuvem(){
  if (!db) return;
  try {
    const ids = [...sujos]; const rem = [...removidos]; sujos.clear(); removidos.clear();
    for (let i = 0; i < ids.length; i += 400){
      const b = db.batch();
      ids.slice(i, i+400).forEach(id => { const f = state.familias.find(x => x.id === id); if (f) b.set(db.collection('familias').doc(id), semCache(f)); });
      await b.commit();
    }
    for (let i = 0; i < rem.length; i += 400){ const b = db.batch(); rem.slice(i, i+400).forEach(id => b.delete(db.collection('familias').doc(id))); await b.commit(); }
    await db.collection('config').doc('central').set(state.config);
  } catch(e){ toast('Sem conexão com a nuvem — tudo está salvo neste aparelho.'); }
}
async function puxarNuvem(){
  if (!db) return;
  const snap = await db.collection('familias').get();
  const lista = []; snap.forEach(d => lista.push(d.data()));
  if (lista.length || !state.familias.length) state.familias = lista;
  const cfg = await db.collection('config').doc('central').get();
  if (cfg.exists) state.config = Object.assign({}, CONFIG_PADRAO, cfg.data());
  reindexar(); gravarLS('familias', state.familias.map(semCache)); gravarLS('config', state.config);
}

function famVazia(){

function nomeFamilia(f){
  const n = String(f.nome || '').trim();
  if (n.length > 1 && /[A-Za-zÀ-ú]/.test(n)) return bonito(n);
  const r = f.responsaveis[0]; if (r && r.nome) return bonito(r.nome);
  const c = f.criancas[0]; if (c && c.nome){ const p = c.nome.trim().split(/\s+/); return bonito(p.length > 1 ? p.slice(-2).join(' ') : p[0]); }
  return 'Sem nome';
}
function telefonesDe(f){
  const out = [], vistos = new Set();
  const add = (t, quem) => { const d = digitos(t); if (!d || vistos.has(d.slice(-9))) return; vistos.add(d.slice(-9)); out.push({ tel: t, quem, ok: telValido(t) }); };
  f.responsaveis.forEach(r => add(r.telefone, primeiroNome(r.nome)));
  f.criancas.forEach(c => add(c.telefone, primeiroNome(c.nome)));
  (f.autorizados||[]).forEach(a => add(a.telefone, primeiroNome(a.nome)));
  return out;
}
function contatoPrincipal(f){ return telefonesDe(f).find(t => t.ok) || null; }
function nomeContato(f){ const r = f.responsaveis.find(r => r.nome); return r ? primeiroNome(r.nome) : nomeFamilia(f); }

function turmaDe(c){
  if (c.turma){ return c.turma; }
  const i = idadeDe(c.nascimento); if (!i) return 'Sem data';
  const t = state.config.turmas.find(t => i.anos >= t.min && i.anos <= t.max);
  if (t) return t.nome;
  const ult = state.config.turmas[state.config.turmas.length - 1];
  return (ult && i.anos > ult.max) ? 'Acima da faixa' : 'Sem turma';
}

/* Índice de busca: tudo normalizado em um texto só por família. */
function reindexar(){
  state.indice = new Map();
  state.familias.forEach(f => {
    f._h = norm([nomeFamilia(f), f.nome, ...f.responsaveis.map(r => r.nome), ...f.criancas.map(c => c.nome), ...(f.autorizados||[]).map(a => a.nome), f.bairro].join(' '));
    f._q = [...f.mids, ...f.responsaveis.map(r => digitos(r.telefone)), ...f.criancas.map(c => digitos(c.telefone)), ...f.responsaveis.map(r => norm(r.email))].join(' ');
    state.indice.set(f.id, f);
  });
}
function buscar(q, lista){
  const toks = norm(q).split(' ').filter(Boolean); if (!toks.length) return lista;
  const pontos = [];
  lista.forEach(f => {
    let ok = true, p = 0;
    for (const t of toks){
      if (/^\d+$/.test(t) && t.length >= 3){ if (f._q.includes(t)) p += 3; else { ok = false; break; } }
      else if (f._h.includes(t)){ p += (f._h.startsWith(t) || f._h.includes(' ' + t)) ? 2 : 1; }
      else if (t.includes('@') && f._q.includes(t)) p += 3;
      else { ok = false; break; }
    }
    if (ok) pontos.push([p, f]);
  });
  pontos.sort((a, b) => b[0] - a[0] || nomeFamilia(a[1]).localeCompare(nomeFamilia(b[1]), 'pt'));
  return pontos.map(x => x[1]);
}

/* Aniversários: próximos N dias (inclui hoje). 29/02 comemora em 28/02 nos anos não bissextos. */
function proximoAniversario(iso, ref){
  const m = String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})/); if (!m) return null;
  const hoje = new Date(ref.getFullYear(), ref.getMonth(), ref.getDate());
  for (let a = ref.getFullYear(); a <= ref.getFullYear() + 1; a++){
    let d = new Date(a, +m[2]-1, +m[3]); if (d.getMonth() !== +m[2]-1) d = new Date(a, +m[2]-1, 28);
    if (d >= hoje) return { data: d, dias: Math.round((d - hoje) / 86400000), faz: a - +m[1] };
  }
  return null;
}
function aniversariantes(dias, incluirResp){
  const hoje = new Date(), out = [];
  state.familias.forEach(f => {
    if (f.status === 'inativa') return;
    const pessoas = f.criancas.map(p => ({ p, crianca:true }));
    if (incluirResp) f.responsaveis.forEach(p => pessoas.push({ p, crianca:false }));
    pessoas.forEach(({ p, crianca }) => {
      const n = proximoAniversario(p.nascimento, hoje);
      if (n && n.dias <= dias) out.push({ f, p, crianca, ...n });
    });
  });
  return out.sort((a, b) => a.dias - b.dias || a.p.nome.localeCompare(b.p.nome));
}

function diasDesde(iso){ if (!iso) return null; const [a,m,d] = iso.split('-').map(Number); return Math.floor((new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate()) - new Date(a, m-1, d)) / 86400000); }

/* Qualidade do cadastro — o que impede a gente de cuidar da família. */
function problemasDe(f){

  if (!f.criancas.length) p.push({ k:'semcrianca', t:'Sem crianças' });
  return p;
}

function qualidade(){

  const cont = { semresp:0, semtel:0, semnasc:0, semcrianca:0 }; let ok = 0;

  return { total: ativas.length, ok, pct: ativas.length ? Math.round(ok / ativas.length * 100) : 0, cont };
}

/* Duplicadas: mesmo telefone/e-mail em famílias diferentes, ou mesma criança (nome + nascimento). */
function acharDuplicadas(){
  const chaves = new Map(), pares = new Map();
  const ign = new Set(state.config.ignorados || []);
  const reg = (k, f, motivo) => { if (!k) return; if (!chaves.has(k)) chaves.set(k, []); const l = chaves.get(k); if (!l.some(x => x.f === f)) l.push({ f, motivo }); };
  state.familias.forEach(f => {
    f.responsaveis.forEach(r => { const d = digitos(r.telefone); if (d.length >= 10) reg('t' + d.slice(-9), f, 'mesmo telefone'); if (r.email) reg('e' + norm(r.email), f, 'mesmo e-mail'); });
    f.criancas.forEach(c => { if (c.nascimento && c.nome) reg('c' + norm(c.nome) + c.nascimento, f, 'mesma criança'); });
  });
  chaves.forEach((l, k) => {
    if (l.length < 2 || l.length > 4) return;
    for (let i = 0; i < l.length; i++) for (let j = i + 1; j < l.length; j++){
      const a = l[i].f, b = l[j].f, id = [a.id, b.id].sort().join('|');
      if (ign.has(id)) continue;
      if (!pares.has(id)) pares.set(id, { a, b, id, motivos: new Set(), forte: false });
      const p = pares.get(id); p.motivos.add(l[i].motivo); if (k[0] === 'c' || k[0] === 'e') p.forte = true;
    }
  });
  return [...pares.values()].map(p => ({ ...p, motivos: [...p.motivos] })).sort((x, y) => (y.forte - x.forte) || (y.motivos.length - x.motivos.length));
}
function mesclar(a, b){
  b.responsaveis.forEach(r => { const ex = a.responsaveis.find(x => (r.mid && x.mid === r.mid) || (digitos(x.telefone).slice(-9) && digitos(x.telefone).slice(-9) === digitos(r.telefone).slice(-9) && norm(x.nome) === norm(r.nome)) || norm(x.nome) === norm(r.nome)); if (ex) preencher(ex, r); else a.responsaveis.push(r); });
  b.criancas.forEach(c => { const ex = a.criancas.find(x => (c.mid && x.mid === c.mid) || (norm(x.nome) === norm(c.nome) && (!x.nascimento || !c.nascimento || x.nascimento === c.nascimento))); if (ex) preencher(ex, c); else a.criancas.push(c); });
  (b.autorizados||[]).forEach(x => { if (!(a.autorizados||[]).some(y => norm(y.nome) === norm(x.nome))) (a.autorizados = a.autorizados || []).push(x); });
  a.mids = [...new Set([...a.mids, ...b.mids])];
  a.visitas = [...new Set([...(a.visitas||[]), ...(b.visitas||[])])].sort();
  a.notas = [...(a.notas||[]), ...(b.notas||[])].sort((x, y) => String(y.data).localeCompare(String(x.data)));
  a.feitos = [...new Set([...(a.feitos||[]), ...(b.feitos||[])])];
  ['endereco','bairro','obs'].forEach(k => { if (!a[k] && b[k]) a[k] = b[k]; });
  if (a.nome.length < 2 && b.nome) a.nome = b.nome;
  return a;
}
function preencher(dest, orig){ Object.keys(orig).forEach(k => { if (k === 'id') return; const v = orig[k]; if ((dest[k] === '' || dest[k] == null) && v !== '' && v != null) dest[k] = v; }); }

/* Fila de cuidado: quem merece uma mensagem hoje (e por quê). */
function filaCuidado(){
  const fila = [], hoje = new Date();
  const cfg = state.config;
  state.familias.forEach(f => {
    if (f.status === 'inativa') return;
    const feitos = new Set(f.feitos || []); const tel = contatoPrincipal(f);
    const recente = (f.origem !== 'mykids' && (Date.now() - new Date(f.criadoEm)) < 14 * 86400000) || (diasDesde(ultimaPresenca(f)) != null && diasDesde(ultimaPresenca(f)) <= 14);
    if (f.status === 'visitante' && recente && !feitos.has('boasvindas')){
      const c = f.criancas[0];
      fila.push({ f, tema:'boasvindas', chave:'boasvindas', crianca: c ? primeiroNome(c.nome) : '', prioridade: 1, motivo: 'Visitante novo — ainda sem contato' });
    }
    const up = ultimaPresenca(f), dd = diasDesde(up);
    if (up && dd >= cfg.diasAusencia && f.status !== 'visitante' && !feitos.has('saudade:' + up)){
      fila.push({ f, tema:'saudade', chave:'saudade:' + up, crianca: f.criancas[0] ? primeiroNome(f.criancas[0].nome) : '', prioridade: 2, motivo: `Ausente há ${Math.floor(dd / 7)} semanas` });
    }
  });
  aniversariantes(cfg.janelaAniversario, false).forEach(a => {
    const chave = `aniv:${a.p.id}:${a.data.getFullYear()}`;
    if ((a.f.feitos || []).includes(chave)) return;
    fila.push({ f: a.f, tema:'aniversario', chave, crianca: primeiroNome(a.p.nome), prioridade: a.dias === 0 ? 0 : 3,
      motivo: a.dias === 0 ? `${primeiroNome(a.p.nome)} faz ${anosTxt(a.faz)} HOJE` : a.dias === 1 ? `${primeiroNome(a.p.nome)} faz ${anosTxt(a.faz)} amanhã` : `${primeiroNome(a.p.nome)} faz ${anosTxt(a.faz)} em ${a.dias} dias` });
  });
  return fila.sort((a, b) => a.prioridade - b.prioridade);
}

/*PARSER-INICIO*/
/* Lê o "Relatório de Famílias Com Seus Integrantes" do MyKids (PDF).
   Entrada: paginas = [[{s,x,y}, …], …] (texto + posição, vindo do pdf.js).
   Saída: { regs, familias, avisos } — registros planos, um por pessoa.
   Cada pessoa ocupa um bloco: ID (quebrado em 2 linhas) · nome (pode quebrar) ·
   tipo · idade · nascimento · sexo (quebra "MASCULI/NO") · telefone · e-mail
   (quebra em 2 linhas) · e, por último, o ID da família repetido. */
function mkParsePaginas(paginas){
  const regs = [], avisos = [], famVistas = new Set();
  let igreja = '';
  let fam = { id:'', nome:'', sit:'' };
  const limpa = (s) => (s||'').replace(/\s+/g,' ').trim();
  paginas.forEach((pg, pi) => {
    if (!igreja){ const tit = pg.find(i => i.y > 780 && i.y < 800 && i.s.trim() && !/Emiss|P[áa]gina/.test(i.s)); if (tit) igreja = tit.s.trim(); }
    const itens = pg.filter(i => i.s && i.s.trim() && i.y < 745);
    // 1) cabeçalhos de família ("ID:" na margem esquerda)
    const cabs = itens.filter(i => i.s.trim() === 'ID:' && i.x < 40);
    const ehCab = new Set();
    const cabInfo = cabs.map(c => {
      const linha = itens.filter(i => Math.abs(i.y - c.y) <= 3);
      linha.forEach(i => ehCab.add(i));
      const idIt = linha.find(i => i.x > 55 && i.x < 110 && /^\d+$/.test(i.s.trim()));
      const nome = linha.filter(i => i.x > 150 && i.x < 440 && i.s.trim() !== 'Famíli' && i.s.trim() !== 'Tipo:')
        .sort((a,b)=>a.x-b.x).map(i=>i.s).join(' ');
      const sit = linha.filter(i => i.x > 470 && i.s.trim() !== 'Tipo:').map(i => i.s.trim()).join(' ');
      return { y:c.y, id: idIt ? idIt.s.trim() : '', nome: limpa(nome) === '.' ? '' : limpa(nome), sit: /visit/i.test(sit) ? 'visitante' : 'membro' };
    });
    // 2) âncoras: primeira parte do ID do membro (5 dígitos na margem)
    const rest = itens.filter(i => !ehCab.has(i));
    const eventos = [];     // âncoras e cabeçalhos em ordem vertical
    cabInfo.forEach(c => eventos.push({ tipo:'cab', y:c.y, c }));
    rest.filter(i => i.x < 34 && /^\d{5}$/.test(i.s.trim())).forEach(i => {
      // um ID de família de 5 dígitos aparece repetido como rodapé; o cabeçalho acima o identifica
      if (cabInfo.some(c => c.id === i.s.trim()) || i.s.trim() === fam.id) return;
      eventos.push({ tipo:'ancora', y:i.y, it:i });
    });
    eventos.sort((a,b) => b.y - a.y);
    const ancoras = eventos.filter(e => e.tipo === 'ancora');
    // 3) cada item vai para a âncora mais baixa que ainda está acima dele (até 16pt de folga)
    const blocos = ancoras.map(a => ({ a, itens:[] }));
    rest.forEach(i => {
      let alvo = -1;
      for (let k = 0; k < ancoras.length; k++) if (ancoras[k].y + 16 >= i.y) alvo = k;
      if (alvo >= 0 && i.y <= ancoras[alvo].y + 16) blocos[alvo].itens.push(i);
    });
    // 4) percorre em ordem de leitura trocando a família atual
    let ib = 0;
    eventos.forEach(ev => {
      if (ev.tipo === 'cab'){ fam = { id:ev.c.id, nome:ev.c.nome, sit:ev.c.sit }; famVistas.add(fam.id); return; }
      const b = blocos[ib++];
      const its = b.itens;
      const rodape = its.find(i => i.x < 34 && /^\d{6,}$/.test(i.s.trim()));
      const famId = rodape ? rodape.s.trim() : fam.id;
      const idMembro = limpa(its.filter(i => i.x < 50 && /^\d+$/.test(i.s.trim()) && i !== rodape)
        .sort((x,y)=>y.y-x.y).map(i=>i.s).join(''));
      const nomeIts = its.filter(i => i.x >= 55 && i.x < 222).sort((p,q)=>(q.y-p.y)||(p.x-q.x));
      const direita = its.filter(i => i.x >= 222).sort((p,q)=>(q.y-p.y)||(p.x-q.x));
      const topo = direita.length ? Math.max(...direita.map(i=>i.y)) : 0;
      const linhaTopo = direita.filter(i => i.y >= topo - 5).sort((p,q)=>p.x-q.x).map(i=>i.s).join(' ');
      const cont = direita.filter(i => i.y < topo - 5);
      const tipoTxt = limpa(direita.filter(i => i.x < 265).map(i=>i.s).join(''));
      const crianca = /^crian/i.test(tipoTxt);
      const dm = linhaTopo.match(/(\d{2})\/(\d{2})\/(\d{4})/);

function parseCSV(texto){
  texto = texto.replace(/^﻿/, '');
  const primeira = texto.split(/\r?\n/, 1)[0] || '';
  const sep = [';', '\t', ','].map(s => [s, primeira.split(s).length]).sort((a, b) => b[1] - a[1])[0][0];
  const linhas = []; let lin = [], cel = '', asp = false;
  for (let i = 0; i < texto.length; i++){
    const c = texto[i];
    if (asp){ if (c === '"'){ if (texto[i+1] === '"'){ cel += '"'; i++; } else asp = false; } else cel += c; }
    else if (c === '"') asp = true;
    else if (c === sep){ lin.push(cel); cel = ''; }
    else if (c === '\n' || c === '\r'){ if (c === '\r' && texto[i+1] === '\n') i++; lin.push(cel); cel = ''; if (lin.some(x => x.trim())) linhas.push(lin); lin = []; }
    else cel += c;
  }
  lin.push(cel); if (lin.some(x => x.trim())) linhas.push(lin);
  return linhas;
}

function aplicarGrupo(fam, rs, modo, existia){
  const r = { criancasNovas: 0, respNovos: 0, alterados: 0, mudou: !existia };
  const fonte = modo === 'fonte';
  const set = (obj, campo, valor) => {
    if (valor === '' || valor == null) return;
    if (obj[campo] === '' || obj[campo] == null){ obj[campo] = valor; r.mudou = true; if (existia) r.alterados++; }
    else if (fonte && String(obj[campo]) !== String(valor) && !(typeof valor === 'string' && norm(obj[campo]) === norm(valor))){ obj[campo] = valor; r.mudou = true; r.alterados++; }
  };
  const f0 = rs[0];
  if (f0.famId && !fam.mids.includes(f0.famId)){ fam.mids.push(f0.famId); r.mudou = true; }
  const sit = (rs.find(x => x.famTipo) || {}).famTipo;   // Membro / Visitante no MyKids
  if (sit && fam.status !== 'inativa' && fam.status !== sit && (fonte || !existia)){ if (existia) r.alterados++; fam.status = sit === 'visitante' ? 'visitante' : 'ativa'; r.mudou = true; }
  if (!fam.nome && rs.some(x => x.famNome)){ fam.nome = rs.find(x => x.famNome).famNome; r.mudou = true; }
  ['endereco','bairro'].forEach(k => { const v = (rs.find(x => x[k]) || {})[k]; if (v && !fam[k]){ fam[k] = v; r.mudou = true; } });
  rs.forEach(x => {
    const lista = x.tipo === 'crianca' ? fam.criancas : fam.responsaveis;
    let p = lista.find(q => x.mid && q.mid === x.mid) || lista.find(q => norm(q.nome) === norm(x.nome) && (!q.nascimento || !x.nasc || q.nascimento === x.nasc));
    if (!p){
      p = pessoaVazia(x.tipo === 'crianca' ? 'crianca' : 'resp'); lista.push(p); r.mudou = true;
      if (x.tipo === 'crianca') r.criancasNovas++; else r.respNovos++;
      p.nome = bonito(x.nome);
    } else if (fonte && x.nome && norm(p.nome) !== norm(x.nome)){ p.nome = bonito(x.nome); r.mudou = true; r.alterados++; }
    if (x.mid && !p.mid){ p.mid = x.mid; }
    set(p, 'nascimento', x.nasc); set(p, 'sexo', x.sexo); set(p, 'telefone', x.tel);
    if (x.tipo === 'crianca'){ ['alergias','medicacao','necessidades','obs'].forEach(k => { if (x[k] && !p[k]){ p[k] = x[k]; r.mudou = true; } }); if (x.turma && !p.turma) p.turma = x.turma; }
    else { set(p, 'email', x.email); if (x.parentesco && !p.parentesco) p.parentesco = x.parentesco; }
    if (x.ultimaVisita && !(fam.visitas || []).includes(x.ultimaVisita)){ (fam.visitas = fam.visitas || []).push(x.ultimaVisita); fam.visitas.sort(); r.mudou = true; }
  });
  return r;
}
function planejar(regs, modo){

  const porFam = new Map(), porPessoa = new Map(), porTel = new Map(), porEmail = new Map(), porNome = new Map();
  state.familias.forEach(f => {
    f.mids.forEach(m => porFam.set(m, f));
    [...f.criancas, ...f.responsaveis].forEach(p => { if (p.mid) porPessoa.set(p.mid, f); });
    f.responsaveis.forEach(r => { const d = digitos(r.telefone).slice(-9); if (d.length >= 8) porTel.set('t' + d, f); if (r.email) porEmail.set('e' + norm(r.email), f); });
    f.criancas.forEach(c => { const d = digitos(c.telefone).slice(-9); if (d.length >= 8 && !porTel.has('t' + d)) porTel.set('t' + d, f); });
    f.criancas.forEach(c => porNome.set(norm(c.nome) + '|' + c.nascimento, f));
  });
  const itens = [], porAlvo = new Map();
  grupos.forEach((rs, k) => {
    const famId = rs[0].famId;
    let alvo = famId ? porFam.get(famId) : null;
    if (!alvo) alvo = rs.map(x => x.mid && porPessoa.get(x.mid)).find(Boolean) || null;
    if (!alvo && !famId){
      alvo = porTel.get(rs[0].famKey) || porEmail.get(rs[0].famKey) || rs.filter(x => x.tipo === 'crianca' && x.nasc).map(x => porNome.get(norm(x.nome) + '|' + x.nasc)).find(Boolean) || null;
    }
    if (alvo && porAlvo.has(alvo.id)){ const it = porAlvo.get(alvo.id); const r2 = aplicarGrupo(it.fam, rs, modo, true); it.res.mudou = it.res.mudou || r2.mudou; it.res.criancasNovas += r2.criancasNovas; it.res.respNovos += r2.respNovos; it.res.alterados += r2.alterados; it.rs.push(...rs); return; }
    const base = alvo ? JSON.parse(JSON.stringify(semCache(alvo))) : Object.assign(famVazia(), { origem: modo === 'fonte' ? 'mykids' : 'planilha' });
    const res = aplicarGrupo(base, rs, modo, !!alvo);
    const it = { k, alvo, fam: base, res, rs: rs.slice() };
    if (alvo) porAlvo.set(alvo.id, it);

const FILTROS = [['todas','Todas'],['visitantes','Visitantes'],['saude','⚠ Saúde'],['semresp','Sem responsável'],['semtel','Sem telefone'],['semnasc','Sem nascimento'],['aniv','🎂 Mês'],['ausentes','Ausentes'],['inativas','Inativas']];
function listaFiltrada(){
  const f = state.filtros, cfg = state.config; let l = state.familias.slice();
  if (f.tipo === 'inativas') l = l.filter(x => x.status === 'inativa'); else l = l.filter(x => x.status !== 'inativa');
  if (f.tipo === 'visitantes') l = l.filter(x => x.status === 'visitante');
  else if (f.tipo === 'saude') l = l.filter(x => x.criancas.some(temSaude));
  else if (['semresp','semtel','semnasc'].includes(f.tipo)) l = l.filter(x => problemasDe(x).some(p => p.k === f.tipo));
  else if (f.tipo === 'aniv'){ const m = new Date().getMonth() + 1; l = l.filter(x => x.criancas.some(c => +String(c.nascimento).slice(5, 7) === m)); }
  else if (f.tipo === 'ausentes') l = l.filter(x => { const d = diasDesde(ultimaPresenca(x)); return d != null && d >= cfg.diasAusencia; });
  if (f.turma) l = l.filter(x => x.criancas.some(c => turmaDe(c) === f.turma));
  if (state.busca.trim()) return buscar(state.busca, l);
  if (f.ordem === 'recentes') return l.sort((a, b) => String(b.atualizadoEm).localeCompare(String(a.atualizadoEm)));
  if (f.ordem === 'ausentes') return l.sort((a, b) => (ultimaPresenca(a) || '0').localeCompare(ultimaPresenca(b) || '0'));
  return l.sort((a, b) => nomeFamilia(a).localeCompare(nomeFamilia(b), 'pt'));
}
function blocoListaFamilias(){
  const l = listaFiltrada();
  if (!l.length) return '<div class="vazio"><span class="e">🔍</span>Nenhuma família com esse filtro.</div>';

function novoRascunho(f){
  const r = f ? JSON.parse(JSON.stringify(semCache(f))) : Object.assign(famVazia(), { _novo: true });

  if (!r.criancas.length && !f) r.criancas.push(pessoaVazia('crianca'));
  return r;
}
function lerFormEditor(){
  const form = document.getElementById('form-editar'); const r = state.rascunho; if (!form || !r) return;
  const v = (n) => { const e = form.elements[n]; return e ? e.value : undefined; };
  ['nome','status','bairro','endereco','obs'].forEach(k => { const x = v(k); if (x !== undefined) r[k] = x.trim(); });
  const grupos = { r: r.responsaveis, c: r.criancas, a: r.autorizados };
  Object.entries(grupos).forEach(([g, lista]) => lista.forEach((p, i) => {
    Object.keys(p).forEach(campo => { const e = form.elements[`${g}.${i}.${campo}`]; if (!e) return; p[campo] = campo === 'autImagem' ? (e.value === 'sim' ? true : e.value === 'nao' ? false : null) : (campo === 'sexo' || campo === 'parentesco' || campo === 'turma') ? e.value : e.value.trim(); });
  }));
}

function cartaoFamiliaPrevia(f){ const c = cartaoFamilia(f).replace(/ data-acao="abrir" data-id="[^"]*"/, '').replace('class="fam"', 'class="fam" style="cursor:default;box-shadow:none;background:var(--creme)"'); return c; }
function mostrarPrevia(){
  const imp = state.imp;
  imp.plano = planejar(imp.regs, imp.modo); imp.resumo = resumoPlano(imp.plano, imp.regs, imp.modo); imp.estagio = 'previa';
  render(); window.scrollTo(0, 0);
}
async function processarArquivo(file){
  state.imp = { estagio: 'lendo', arquivo: file.name }; render();
  try {
    if (/\.pdf$/i.test(file.name)){
      const r = await lerPdfMyKids(file, (n, t) => { const b = document.getElementById('imp-prog'), x = document.getElementById('imp-prog-txt'); if (b) b.style.width = Math.round(n / t * 100) + '%'; if (x) x.textContent = `Página ${n} de ${t}`; });
      Object.assign(state.imp, { igreja: r.igreja, regs: r.regs, modo: 'fonte', origem: 'MyKids · PDF', avisos: r.avisos }); mostrarPrevia();
    } else {
      const p = await lerPlanilha(file);
      Object.assign(state.imp, { cab: p.cabecalhos, linhas: p.linhas, mapa: autoMapa(p.cabecalhos), modo: 'preencher', origem: 'Planilha', avisos: [], estagio: 'mapear' }); render();
    }
  } catch(e){ state.imp = null; toast(e.message || 'Não consegui ler esse arquivo.'); }
}

/* ---- TURMAS ---- */
function criancasDaTurma(nome){
  const l = [];
  state.familias.forEach(f => { if (f.status === 'inativa') return; f.criancas.forEach(c => { if (turmaDe(c) === nome) l.push({ f, c }); }); });
  return l.sort((a, b) => a.c.nome.localeCompare(b.c.nome, 'pt'));
}
function nomesTurmas(){ return [...state.config.turmas.map(t => t.nome), 'Acima da faixa', 'Sem turma', 'Sem data']; }
function telaTurmas(t){
  if (!state.familias.length) return vazioBanco();
  const nomes = nomesTurmas().filter(n => criancasDaTurma(n).length);
  const sel = t.turma && nomes.includes(t.turma) ? t.turma : (state.turmaSel && nomes.includes(state.turmaSel) ? state.turmaSel : nomes[0]);
  state.turmaSel = sel;
  const lista = sel ? criancasDaTurma(sel) : [];
  return `<div class="chips">${nomes.map(n => `<button type="button" class="chip ${n === sel ? 'ativo' : ''}" data-acao="turma-sel" data-turma="${esc(n)}">${esc(n)} · ${criancasDaTurma(n).length}</button>`).join('')}</div>
    <div class="row" style="margin-bottom:12px;"><button type="button" class="btn btn-primary btn-small" data-acao="pdf-turma" data-turma="${esc(sel)}">🖨️ Ficha de sala (PDF)</button><button type="button" class="btn btn-secondary btn-small" data-acao="pdf-turma" data-turma="todas">Todas as turmas</button></div>
    <div class="cartao">${lista.map(({ f, c }) => { const r = f.responsaveis.find(r => telValido(r.telefone)); return `<div class="pessoa clicavel" data-acao="abrir" data-id="${f.id}"><div class="linha"><div><div style="font-weight:800;">${esc(bonito(c.nome))}</div><div class="hint">${esc(idadeTexto(c.nascimento))} · ${esc(nomeFamilia(f))}${r ? ' · ' + esc(primeiroNome(r.nome)) + ' ' + esc(fmtTel(r.telefone)) : ''}</div></div>${c.autImagem === false ? '<span class="badge b-alerta">sem foto</span>' : ''}</div>${temSaude(c) ? `<div class="saude">${[c.alergias && '🚫 ' + esc(c.alergias), c.medicacao && '💊 ' + esc(c.medicacao), c.necessidades && '🧩 ' + esc(c.necessidades)].filter(Boolean).join(' · ')}</div>` : ''}</div>`; }).join('') || '<p class="hint">Sem crianças nesta turma.</p>'}</div>`;
}

  const hoje = hojeISO(), q = state.pesqPresenca.trim();
  const lista = q ? buscar(q, state.familias.filter(f => f.status !== 'inativa')).slice(0, 25) : state.familias.filter(f => (f.visitas || []).includes(hoje));
  return lista.map(f => { const p = (f.visitas || []).includes(hoje); return `<div class="fam" data-acao="presenca" data-id="${f.id}" style="${p ? 'border-color:var(--teal);background:var(--teal-suave)' : ''}"><div class="avatar" style="background:${p ? 'var(--teal)' : corDe(nomeFamilia(f))}">${p ? '✓' : esc(iniciais(nomeFamilia(f)))}</div><div style="min-width:0;flex:1;"><div class="nome trunc">${esc(nomeFamilia(f))}</div><div class="sub trunc">${f.criancas.map(c => esc(primeiroNome(c.nome))).join(', ') || '—'}</div></div><span class="badge ${p ? 'b-servir' : ''}">${p ? 'presente' : 'marcar'}</span></div>`; }).join('') || `<div class="vazio"><span class="e">${q ? '🤷' : '🔎'}</span>${q ? 'Ninguém encontrado.' : 'Busque uma família para marcar a presença de hoje.'}</div>`;
}
function telaPresenca(){
  const hoje = hojeISO(), pres = state.familias.filter(f => (f.visitas || []).includes(hoje));
  return `<div class="cartao" style="display:flex;gap:18px;justify-content:space-around;text-align:center;"><div><div class="display" style="font-size:30px;" id="pres-fam">${pres.length}</div><div class="hint">famílias hoje</div></div><div><div class="display" style="font-size:30px;" id="pres-cri">${pres.reduce((s, f) => s + f.criancas.length, 0)}</div><div class="hint">crianças</div></div></div>

function linhasCriancas(){

/* ---- PIN e LOGIN ---- */
async function hashPin(pin){
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('central:' + pin)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  catch(e){ let h = 5381; for (const c of 'central:' + pin) h = ((h << 5) + h + c.charCodeAt(0)) | 0; return 'x' + h; }
}

    case 'bloquear': state.bloqueado = true; render(); break;
    case 'pin-remover': state.config.pinHash = ''; persistir(); render(); break;
    case 'sincronizar': try { await sincronizarNuvem(); await puxarNuvem(); toast('Sincronizado.'); } catch(err){ toast('Falha ao sincronizar.'); } break;
    case 'imp-continuar': state.imp.regs = linhasParaRegs(state.imp.linhas, state.imp.mapa); if (!state.imp.regs.length) return toast('Nenhuma pessoa encontrada — marque pelo menos a coluna de nome.'); mostrarPrevia(); break;
    case 'imp-cancelar': state.imp = { estagio: 'escolher' }; render(); break;
    case 'imp-confirmar': { const ck = document.getElementById('imp-inativar'); confirmarImportacao(!!(ck && ck.checked)); render(); window.scrollTo(0, 0); break; }
    case 'imp-ver': state.imp = null; state.filtros.tipo = 'todas'; state.pilha = []; state.aba = 'familias'; state.limite = 40; render(); break;
    case 'imp-desfazer': confirmar('Desfazer importação?', 'As famílias criadas por ela serão removidas e as alteradas voltam ao que eram antes.', 'Desfazer', () => { desfazerImportacao(); state.imp = { estagio: 'escolher' }; toast('Importação desfeita.'); }); break;
    case 'exp-xlsx': try { await exportarXlsx(); } catch(err){ toast(err.message); } break;
    case 'exp-csv': exportarCsv(); break;
    case 'pdf-turma': try { await gerarFichaSala(d.turma); } catch(err){ toast(err.message); } break;
    case 'backup-baixar': baixar(`backup-central-familias-${stamp()}.json`, new Blob([JSON.stringify({ app: 'central-de-familias', versao: 1, exportadoEm: new Date().toISOString(), config: state.config, familias: state.familias.map(semCache) })], { type: 'application/json' })); break;
  }
}
function handleInput(e){
  const t = e.target, k = t.dataset && t.dataset.input; if (!k) return;
  if (k === 'busca-inicio'){ state.buscaInicio = t.value; document.getElementById('bloco-inicio').innerHTML = blocoInicio(); }
  else if (k === 'busca-fam'){ state.busca = t.value; state.limite = 40; document.getElementById('lista-fam').innerHTML = blocoListaFamilias(); }
  else if (k === 'busca-presenca'){ state.pesqPresenca = t.value; document.getElementById('lista-presenca').innerHTML = blocoPresenca(); }
}
async function handleChange(e){
  const t = e.target, k = t.dataset && t.dataset.change; if (!k) return;
  if (k === 'filtro-turma'){ state.filtros.turma = t.value; state.limite = 40; render(); }
  else if (k === 'ordem'){ state.filtros.ordem = t.value; render(); }
  else if (k === 'imp-mapa'){ state.imp.mapa[+t.dataset.col] = t.value; }
  else if (k === 'arquivo-import' && t.files[0]){ const file = t.files[0]; t.value = ''; processarArquivo(file); }
  else if (k === 'arquivo-backup' && t.files[0]){
    const file = t.files[0]; t.value = '';
    try {
      const dados = JSON.parse(await file.text()); if (!dados || !Array.isArray(dados.familias)) throw new Error('x');
      confirmar('Restaurar backup?', `Isto substitui os dados atuais por ${dados.familias.length} famílias do backup.`, 'Restaurar', () => { state.familias.forEach(x => removidos.add(x.id)); state.familias = dados.familias; state.familias.forEach(x => sujos.add(x.id)); if (dados.config) state.config = Object.assign({}, CONFIG_PADRAO, dados.config); reindexar(); persistir(); toast('Backup restaurado.'); });
    } catch(err){ toast('Esse arquivo não parece um backup válido.'); }
  }
}
async function handleSubmit(e){
  const form = e.target.closest('form[data-form]'); if (!form) return; e.preventDefault();
  const tipo = form.dataset.form, v = (n) => form.elements[n] ? form.elements[n].value : '';
  if (tipo === 'editar'){
    lerFormEditor(); const r = state.rascunho;
    r.responsaveis = r.responsaveis.filter(p => p.nome || p.telefone || p.email); r.criancas = r.criancas.filter(p => p.nome || p.nascimento);
    r.autorizados = (r.autorizados || []).filter(p => p.nome);
    if (!r.responsaveis.length && !r.criancas.length) return toast('Informe pelo menos um responsável ou uma criança.');
    if (r.criancas.some(c => !c.nome)) return toast('Toda criança precisa de um nome.');
    const novo = !!r._novo; delete r._novo;
    if (novo){ r.criadoEm = new Date().toISOString(); marcar(r); state.familias.push(r); } else { const i = state.familias.findIndex(x => x.id === r.id); if (i >= 0) state.familias[i] = r; marcar(r); }
    reindexar(); persistir(); state.rascunho = null; state.pilha.pop();
    if (novo) state.pilha.push({ t: 'familia', id: r.id });
    toast('Família salva ✓'); window.scrollTo(0, 0);
  } else if (tipo === 'nota'){
    const f = state.indice.get(form.dataset.id); if (f && v('texto').trim()){ addNota(f, v('texto').trim()); marcar(f); persistir(); } state.modal = null; render();
  } else if (tipo === 'config'){
    const c = state.config;
    c.igreja = v('igreja').trim() || c.igreja; c.diasAusencia = Math.max(7, +v('diasAusencia') || 28); c.janelaAniversario = Math.min(60, Math.max(1, +v('janelaAniversario') || 7));
    const ts = v('turmas').split('\n').map(l => l.split('|').map(x => x.trim())).filter(p => p[0] && p[1] !== '' && !isNaN(+p[1])).map(p => ({ nome: p[0], min: +p[1], max: p[2] === '' || isNaN(+p[2]) ? +p[1] : +p[2] }));
    if (ts.length) c.turmas = ts;
    ['msgBoasVindas', 'msgAniversario', 'msgSaudade', 'msgGeral'].forEach(k => { if (v(k).trim()) c[k] = v(k).trim(); });
    persistir(); toast('Configurações salvas ✓');
  } else if (tipo === 'pin-definir'){ state.config.pinHash = await hashPin(v('pin')); persistir(); toast('PIN definido.'); render(); }
  else if (tipo === 'pin'){ if (await hashPin(v('pin')) === state.config.pinHash){ state.bloqueado = false; render(); } else { toast('PIN incorreto.'); } }
  else if (tipo === 'login'){ try { await auth.signInWithEmailAndPassword(v('email'), v('senha')); } catch(err){ toast('E-mail ou senha incorretos.'); } }
}

/* ============ 9) DADOS DE EXEMPLO ============ */
function carregarExemplo(){
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647, pick = (a) => a[Math.floor(rnd() * a.length)];
  const fem = ['Ana','Beatriz','Camila','Daniela','Eduarda','Fernanda','Gabriela','Helena','Isabela','Juliana','Larissa','Mariana'], mas = ['Bruno','Carlos','Daniel','Eduardo','Felipe','Gustavo','Henrique','João','Lucas','Marcos','Rafael','Thiago'];
  const sob = ['Silva','Souza','Oliveira','Santos','Lima','Pereira','Costa','Ribeiro','Almeida','Carvalho','Gomes','Martins','Araújo','Rocha'];
  const aler = ['amendoim','leite e derivados','glúten','picada de abelha','ovo','frutos do mar'];
  const hoje = new Date();
  for (let i = 0; i < 36; i++){
    const f = famVazia(), s1 = pick(sob), s2 = pick(sob); f.origem = 'exemplo'; f.nome = s1 + (rnd() > .5 ? ' ' + s2 : '');
    f.bairro = pick(['Centro','Capim Macio','Ponta Negra','Lagoa Nova','Candelária']); if (rnd() < .12) f.status = 'visitante';
    const ddd = '84', cel = () => ddd + '9' + String(Math.floor(rnd() * 90000000 + 10000000));
    if (rnd() > .08){ const m = pessoaVazia('resp'); m.nome = `${pick(fem)} ${s1}`; m.parentesco = 'Mãe'; m.telefone = rnd() > .1 ? cel() : ''; m.email = rnd() > .5 ? norm(m.nome).replace(/\s/g, '.') + '@email.com' : ''; f.responsaveis.push(m); }
    if (rnd() > .55){ const p = pessoaVazia('resp'); p.nome = `${pick(mas)} ${s2}`; p.parentesco = 'Pai'; p.telefone = cel(); f.responsaveis.push(p); }
    const n = 1 + Math.floor(rnd() * 3);
    for (let k = 0; k < n; k++){
      const c = pessoaVazia('crianca'), fem2 = rnd() > .5, idade = Math.floor(rnd() * 12);
      c.nome = `${pick(fem2 ? fem : mas)} ${s1} ${s2}`; c.sexo = fem2 ? 'F' : 'M';
      const nasc = new Date(hoje.getFullYear() - idade, hoje.getMonth(), hoje.getDate() + Math.floor(rnd() * 60) - 20); c.nascimento = isoDe(nasc > hoje ? hoje : nasc);
      if (rnd() < .14) c.alergias = pick(aler); if (rnd() < .04) c.medicacao = 'Bombinha (asma)'; if (rnd() < .04) c.necessidades = 'TEA nível 1 — sensível a barulho'; if (rnd() < .1) c.autImagem = false;
      f.criancas.push(c);
    }
    for (let k = 0; k < 4; k++) if (rnd() > .35 && f.status !== 'visitante'){ const d = new Date(hoje); d.setDate(d.getDate() - 7 * (k + (rnd() > .85 ? 5 : 0)) - ((hoje.getDay() + 7) % 7)); f.visitas.push(isoDe(d)); }
    f.visitas = [...new Set(f.visitas)].sort(); state.familias.push(f);
  }
  reindexar(); persistir(); state.aba = 'inicio'; state.pilha = []; render(); toast('36 famílias de exemplo carregadas.');
}

/* ============ 10) INÍCIO ============ */
async function iniciarFirebase(){
  const base = 'https://www.gstatic.com/firebasejs/10.13.0/';
  await carregarScript(base + 'firebase-app-compat.js'); await carregarScript(base + 'firebase-firestore-compat.js'); await carregarScript(base + 'firebase-auth-compat.js');
  firebase.initializeApp(firebaseConfig); db = firebase.firestore(); auth = firebase.auth();
  auth.onAuthStateChanged(async (u) => { state.usuario = u; if (u){ try { await puxarNuvem(); } catch(e){ toast('Não consegui carregar da nuvem; usando a cópia deste aparelho.'); } } render(); });
}
async function iniciar(){
  state.familias = lerLS('familias', []); state.config = Object.assign({}, CONFIG_PADRAO, lerLS('config', {})); state.undo = lerLS('undo', null);
  reindexar(); state.bloqueado = !!state.config.pinHash; state.carregando = false;
  document.addEventListener('click', handleClick); document.addEventListener('input', handleInput); document.addEventListener('change', handleChange); document.addEventListener('submit', handleSubmit);
  document.addEventListener('dragover', (e) => { const z = e.target.closest && e.target.closest('#zona-soltar'); if (z){ e.preventDefault(); z.classList.add('sobre'); } });
  document.addEventListener('dragleave', (e) => { const z = e.target.closest && e.target.closest('#zona-soltar'); if (z) z.classList.remove('sobre'); });
  document.addEventListener('drop', (e) => { const z = e.target.closest && e.target.closest('#zona-soltar'); if (z){ e.preventDefault(); z.classList.remove('sobre'); if (e.dataTransfer.files[0]) processarArquivo(e.dataTransfer.files[0]); } });
  render();
  if (FIREBASE_CONFIGURADO) try { await iniciarFirebase(); } catch(e){ toast('Firebase indisponível — modo local.'); }
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
}
iniciar();
