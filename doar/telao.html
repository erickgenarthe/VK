<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Telão — Outubro da Criança</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=DM+Sans:wght@400;500;700&family=Lilita+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="doar.css">
<script src="qrcode.js"></script>
<style>
  /* Feito para projetar em 16:9. Tudo escala com a altura da tela. */
  html,body{height:100%;overflow:hidden}
  body{position:relative;font-size:calc(1.15vh + .6vw)}
  .palco{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:4vw;align-items:center;padding:3vh 5vw}
  .mancha{z-index:0}
  .mancha.a{width:48vh;height:46vh;left:-14vh;top:-12vh}
  .mancha.b{width:44vh;height:36vh;right:-10vh;bottom:-12vh}
  .mancha.c{width:20vh;height:21vh;left:38vw;bottom:-3vh}
  .esq{display:grid;justify-items:center;gap:2vh;text-align:center}
  .esq .logo{height:30vh;width:auto}
  .esq .etiqueta{font-size:8vh;padding:.1em .5em .16em}
  .esq .sub{margin:0;font-size:3vh;font-weight:500}
  .qr{padding:1.6vh;width:min(40vh,100%);aspect-ratio:1;background:#fff;border:1.1vh solid var(--rosa);border-radius:3.2vh;box-shadow:0 1.2vh 0 var(--rosa-esc);display:grid}
  .qr svg{width:100%;height:100%;display:block}
  .url{font-weight:700;font-size:2.8vh;color:var(--azul);overflow-wrap:anywhere}
  .dir{display:grid;gap:1.8vh;justify-items:center;min-width:0}
  .contador{display:flex;align-items:baseline;gap:1.6vh}
  .contador .n{font-family:var(--f-titulo);font-size:15vh;line-height:.85;color:var(--azul);font-variant-numeric:tabular-nums}
  .contador .l{font-family:var(--f-mao);font-weight:700;font-size:6.4vh;color:var(--rosa);line-height:1}
  .sala{position:relative;width:100%;height:40vh;aspect-ratio:auto;border-radius:3vh;overflow:hidden;border:.6vh solid #fff;box-shadow:0 1vh 0 var(--papel-2)}
  .sala canvas{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
  .contagem{display:flex;flex-wrap:wrap;justify-content:center;gap:1vh 1.6vh;width:100%}
  .conta{display:inline-flex;align-items:center;gap:.8vh;padding:.5vh 1.6vh .5vh .5vh;border-radius:99vh;background:#fff;box-shadow:0 .4vh 0 var(--papel-2);font-weight:700;font-size:3vh;font-variant-numeric:tabular-nums}
  .conta .ico{width:5.2vh;height:5.2vh;display:grid;place-items:center;border-radius:50%;background:var(--c)}
  .conta .ico svg,.conta .ico img{width:4.2vh;height:4.2vh;object-fit:contain}
  .conta.pulsa{animation:pulsa .6s ease-out}
  @keyframes pulsa{40%{transform:scale(1.22)}}
  .cheio{position:fixed;inset:0;z-index:6;display:grid;place-content:center;justify-items:center;gap:2vh;background:rgba(244,240,234,.95);text-align:center;opacity:0;pointer-events:none;transition:opacity .4s}
  .cheio.aberto{opacity:1}
  .cheio .titulo{font-size:22vh}
  .cheio p{margin:0;font-size:4.2vh;font-weight:700}
  .cheio img{height:34vh;width:auto}
  .aviso{min-height:10vh;display:grid;align-items:center;width:100%}
  .brinde{
    display:flex;align-items:center;justify-content:center;gap:2vh;padding:1.6vh 2.4vh;border-radius:99vh;background:var(--c);color:#fff;font-size:3.4vh;font-weight:700;line-height:1.15;text-align:center;
    box-shadow:0 .6vh 0 rgba(29,26,43,.18);animation:entra .6s cubic-bezier(.2,1.4,.4,1) both;
  }
  .brinde.sai{animation:sai .5s ease-in both}
  @keyframes entra{from{transform:translateY(6vh) scale(.8);opacity:0}to{transform:none;opacity:1}}
  @keyframes sai{to{transform:translateY(-3vh);opacity:0}}
  .espera{font-size:3vh;color:var(--tinta-2);text-align:center}
  #confete{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:7}
  .teste{position:fixed;right:1.4vh;bottom:1vh;z-index:2;font-size:1.8vh;color:var(--tinta-2);opacity:.7}
</style>
</head>
<body>
<span class="mancha m-rosa a" aria-hidden="true"></span>
<span class="mancha m-laranja b" aria-hidden="true"></span>
<span class="mancha m-azul c" aria-hidden="true"></span>

<main class="palco">
  <section class="esq">
    <img class="logo" src="img/logo-clube.png" alt="Clube Videira Kids — ninguém fica de fora">
    <span class="etiqueta">escaneie e doe</span>
    <p class="sub">Aponte a câmera do celular para o QR Code</p>
    <div class="qr" id="qr" role="img" aria-label="QR Code para doar"></div>
    <div class="url" id="url"></div>
  </section>

  <section class="dir">
    <div class="contador"><span class="n" id="n">0</span><span class="l" id="l">doações</span></div>
    <div class="sala" id="sala"></div>
    <div class="contagem" id="contagem" aria-label="Quantos de cada item já foram doados"></div>
    <div class="aviso" id="aviso"><div class="espera">Cada doação que chegar aparece aqui.</div></div>
  </section>
</main>

<div class="cheio" id="cheio" role="status"><img src="img/selo-missao.png" alt=""><h2 class="titulo" id="cheio-tit">100 doações!</h2><p id="cheio-txt"></p></div>
<canvas id="confete" aria-hidden="true"></canvas>
<nav class="nav-telas fixa discreta" aria-label="Outras telas"><a href="index.html">doar</a><a href="admin.html" rel="nofollow">painel de doações</a></nav>
<div class="teste" id="teste" hidden>Modo demonstração · aperte T para simular uma doação</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="doar.js"></script>
<script src="sala.js"></script>
<script>
const $ = id => document.getElementById(id);

/* QR Code: aponta para a página de doação (index.html desta mesma pasta). */
const alvo = DOAR_CONFIG.urlPublica || new URL('./', location.href).href.replace(/index\.html$/, '');
function desenhaQR(){
  const qr = qrcode(0, 'M'); qr.addData(alvo); qr.make();
  $('qr').innerHTML = qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
  const svg = $('qr').querySelector('svg'); svg.setAttribute('shape-rendering', 'crispEdges');
  $('url').textContent = alvo.replace(/^https?:\/\//, '').replace(/\/$/, '');
}
if (window.qrcode) desenhaQR(); else $('qr').textContent = alvo;

/* Brinquedoteca + aviso a cada doação nova */
let pendentes = 0, mostrando = false, totalMostrado = 0, iniciou = false;
function contaAte(alvoN){
  const el = $('n'), ini = totalMostrado, t0 = performance.now();
  (function passo(t){
    const p = Math.min(1, (t - t0) / 700);
    el.textContent = Math.round(ini + (alvoN - ini) * p);
    if (p < 1) requestAnimationFrame(passo); else totalMostrado = alvoN;
  })(t0);
}
function mostraProximo(){
  if (mostrando || pendentes <= 0) return;
  mostrando = true; pendentes--;
  const el = document.createElement('div');   // aviso sem nome de ninguém: só a notícia de que chegou mais uma doação
  el.className = 'brinde c-' + CORES[Math.floor(Math.random() * CORES.length)];
  el.innerHTML = '<span><b>Mais uma doação chegou!</b><br>Obrigado por participar.</span>';
  $('aviso').replaceChildren(el);
  somEncaixe(); confete($('confete'), 2200);
  setTimeout(() => el.classList.add('sai'), 3200);
  setTimeout(() => { mostrando = false; if (pendentes > 0) mostraProximo(); else $('aviso').innerHTML = '<div class="espera">Cada doação vira um brinquedo para o nosso VK. Escaneie e participe!</div>'; }, 3700);
}
/* A cada 50 doações o telão para para comemorar. A brinquedoteca não tem limite. */
const MARCO = 50;
function comemoraMarco(n){
  $('cheio-tit').textContent = `${n} doações!`;
  $('cheio-txt').textContent = 'Obrigado, igreja! Cada doação vira um brinquedo para o nosso VK.';
  $('cheio').classList.add('aberto'); somEncaixe(); confete($('confete'), 4500);
  const c = setInterval(() => confete($('confete'), 3000), 3200);
  setTimeout(() => { clearInterval(c); $('cheio').classList.remove('aberto'); }, 9000);
}
const sala = new Sala($('sala'));
$('contagem').innerHTML = ITENS.map(i =>
  `<span class="conta" id="ct-${i.id}" title="${escapaHtml(i.nome)}"><span class="ico c-${i.cor}">${iconeSvg(i.id, 40)}</span><span class="v">0</span></span>`).join('');
let totalAntes = null;
Dados.aoVivoMural(({ total, porItem }) => {
  sala.atualiza(porItem);
  ITENS.forEach(i => {
    const el = $('ct-' + i.id).querySelector('.v'), n = porItem[i.id] || 0;
    if (+el.textContent !== n){
      el.textContent = n;
      if (iniciou){ const c = $('ct-' + i.id); c.classList.remove('pulsa'); void c.offsetWidth; c.classList.add('pulsa'); }
    }
  });
  contaAte(total);
  $('l').textContent = total === 1 ? 'doação' : 'doações';
  if (totalAntes !== null && Math.floor(total / MARCO) > Math.floor(totalAntes / MARCO)) comemoraMarco(Math.floor(total / MARCO) * MARCO);
  if (iniciou && total > totalAntes){ pendentes += total - totalAntes; mostraProximo(); }   // não repete o que já existia ao abrir
  totalAntes = total; iniciou = true;
});

if (Dados.demo){
  $('teste').hidden = false;
  document.addEventListener('keydown', e => {
    if (e.key.toLowerCase() !== 't') return;
    const i = ITENS[Math.floor(Math.random() * ITENS.length)];
    const nomes = ['Ana', 'Lucas', 'Marta', 'João', 'Beatriz', 'Pedro'];
    Dados.enviar({ nome: nomes[Math.floor(Math.random() * nomes.length)] + ' Teste', whatsapp: '11912345678', itens: [i.id], obs: '' });
  });
}
</script>
</body>
</html>
