<style>
  :root{
    /* As três cores nascem do lema da casa: viver (ouro, luz, vida), amar
       (coral, calor humano) e servir (verde-petróleo, firmeza, serviço). Cada
       uma aparece em pontos diferentes do app em vez de só decoração. */
    --coral: #E8543A;        /* amar */
    --coral-suave: #FDE7E1;
    --teal: #1F6F5C;         /* servir */
    --teal-escuro: #143F35;
    --teal-suave: #E1F1EC;
    --ouro: #F4B740;         /* viver */
    --ouro-suave: #FDF1D6;
    --creme: #FBF7F1;
    --grafite: #1B2430;
    --grafite-suave: #6B6459;
    --branco: #FFFFFF;
    --vermelho: #D64545;
    --radius: 20px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Nunito', sans-serif;
    background: var(--creme);
    color: var(--grafite);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Baloo 2', sans-serif;
    margin:0;
    color: var(--teal-escuro);
  }
  a{ color: var(--teal); }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background: var(--creme);
    position:relative;
    padding-bottom:86px;
  }
  #app.sem-nav{ padding-bottom:24px; }

  @media (min-width: 860px){
    body{
      background: linear-gradient(160deg, #FFF3E4 0%, var(--creme) 45%, #EAF6F0 100%);
      padding: 32px 16px;
    }
    #app{
      min-height: auto;
      border-radius: 28px;
      box-shadow: 0 24px 60px rgba(27,36,48,0.14);
      overflow: hidden;
    }
    #app.modo-equipe{ max-width: 760px; }
  }

  /* ---------- Topbar ---------- */
  .topbar{
    background: linear-gradient(135deg, var(--teal-escuro) 0%, var(--teal) 55%, var(--ouro) 130%);
    padding:22px 20px 26px 20px;
    position:relative;
    color:var(--branco);
  }
  .topbar.modo-simples{ padding-bottom:20px; }
  .topbar-linha1{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .marca{ display:flex; align-items:center; gap:10px; }
  .marca-selo{
    width:38px; height:38px; border-radius:12px; background:var(--branco);
    display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px rgba(0,0,0,0.18);
    flex-shrink:0;
  }
  .marca-nome{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:20px; letter-spacing:0.2px; }
  .marca-sub{ font-size:11px; opacity:0.85; margin-top:-2px; }
  .topbar-acoes{ display:flex; gap:8px; align-items:center; }
  .icon-btn{
    width:36px; height:36px; border-radius:50%; border:none; background:rgba(255,255,255,0.18);
    color:var(--branco); font-size:16px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .icon-btn:active{ background:rgba(255,255,255,0.32); }
  .topbar-titulo{ margin-top:16px; font-size:22px; font-weight:800; }
  .topbar-legenda{ margin-top:4px; font-size:13px; opacity:0.9; }

  /* ---------- Componentes básicos ---------- */
  .conteudo{ padding:18px 18px 8px 18px; }
  .cartao{
    background:var(--branco); border-radius:var(--radius); padding:16px;
    box-shadow:0 2px 10px rgba(27,36,48,0.06); margin-bottom:14px;
  }
  .cartao-titulo{ font-family:'Baloo 2', sans-serif; font-weight:700; font-size:16px; color:var(--teal-escuro); margin-bottom:8px; }
  .hint{ font-size:12.5px; color:var(--grafite-suave); line-height:1.5; }
  .linha{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .col{ display:flex; flex-direction:column; gap:10px; }
  .gap-8{ gap:8px; } .gap-6{ gap:6px; }
  .row{ display:flex; gap:8px; flex-wrap:wrap; }
  .espaco-8{ height:8px; } .espaco-14{ height:14px; } .espaco-20{ height:20px; }

  label{ font-size:12.5px; font-weight:700; color:var(--teal-escuro); display:block; margin-bottom:4px; }
  input, select, textarea{
    width:100%; padding:11px 13px; border-radius:14px; border:1.5px solid #E7E0D4;
    font-family:inherit; font-size:14.5px; background:var(--branco); color:var(--grafite);
  }
  input:focus, select:focus, textarea:focus{ outline:none; border-color: var(--teal); }
  .campo{ margin-bottom:12px; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:12px 18px; border-radius:16px; border:none; font-family:'Nunito', sans-serif;
    font-weight:800; font-size:14.5px; cursor:pointer; text-align:center;
  }
  .btn-block{ width:100%; }
  .btn-primary{ background: var(--teal); color:var(--branco); }
  .btn-primary:active{ background: var(--teal-escuro); }
  .btn-coral{ background: var(--coral); color:var(--branco); }
  .btn-ouro{ background: var(--ouro); color:var(--grafite); }
  .btn-secondary{ background: var(--teal-suave); color: var(--teal-escuro); }
  .btn-ghost{ background: #F1ECE0; color: var(--grafite); }
  .btn-danger{ background: #FBE4E4; color: var(--vermelho); }
  .btn-small{ padding:8px 12px; font-size:12.5px; border-radius:12px; }
  .btn[disabled]{ opacity:0.5; pointer-events:none; }

  .badge{ display:inline-flex; align-items:center; gap:4px; padding:4px 10px; border-radius:100px; font-size:11.5px; font-weight:800; background:#F1ECE0; color:var(--grafite-suave); }
  .badge-servir{ background: var(--teal-suave); color: var(--teal-escuro); }
  .badge-amar{ background: var(--coral-suave); color: var(--coral); }
  .badge-viver{ background: var(--ouro-suave); color:#8C6300; }
  .badge-alerta{ background:#FBE4E4; color:var(--vermelho); }

  .chip{
    padding:8px 14px; border-radius:100px; border:1.5px solid #E7E0D4; background:var(--branco);
    font-size:13px; font-weight:700; cursor:pointer; color:var(--grafite);
  }
  .chip.ativo{ background: var(--teal); border-color: var(--teal); color:var(--branco); }

  .lista-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 0; border-bottom:1px solid #F1ECE0;
  }
  .lista-item:last-child{ border-bottom:none; }

  .toast{
    position:fixed; left:50%; bottom:96px; transform:translateX(-50%); z-index:200;
    background: var(--grafite); color:var(--branco); padding:12px 18px; border-radius:14px;
    font-size:13.5px; font-weight:700; box-shadow:0 10px 24px rgba(0,0,0,0.25); max-width:88%; text-align:center;
  }

  .overlay{
    position:fixed; inset:0; background:rgba(27,36,48,0.5); z-index:150;
    display:flex; align-items:flex-end; justify-content:center;
  }
  @media (min-width:860px){ .overlay{ align-items:center; } }
  .modal{
    background:var(--branco); width:100%; max-width:480px; border-radius:24px 24px 0 0;
    padding:22px 20px 26px 20px; max-height:88vh; overflow-y:auto;
  }
  @media (min-width:860px){ .modal{ border-radius:24px; } }

  /* ---------- Navegação inferior ----------
     O check-in ganha um botão flutuante (FAB) no meio da barra — é a ação
     que a pessoa faz TODA semana, então merece se destacar em vez de virar
     só mais um ícone igual aos outros. */
  .nav-inferior{
    position:fixed; left:0; right:0; bottom:0; max-width:480px; margin:0 auto;
    background:var(--branco); border-top:1px solid #F1ECE0; display:flex; align-items:flex-end;
    box-shadow:0 -4px 14px rgba(27,36,48,0.08); z-index:80;
  }
  @media (min-width:860px){ .nav-inferior{ max-width:760px; border-radius:0 0 24px 24px; } }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:9px 4px 8px 4px; border:none; background:none; cursor:pointer; color:var(--grafite-suave);
    font-family:inherit; font-size:10.5px; font-weight:800;
    transition: transform .15s cubic-bezier(.3,1.4,.4,1);
  }
  .nav-item:active{ transform: scale(0.85); }
  .nav-item .nav-icone-bolha{
    width:38px; height:25px; border-radius:13px; display:flex; align-items:center; justify-content:center;
    transition: background-color .2s ease, transform .2s cubic-bezier(.3,1.4,.4,1);
  }
  .nav-item.ativo .nav-icone-bolha{ background: var(--teal-suave); transform: translateY(-1px); }
  .nav-item .nav-icone{ font-size:17px; }
  .nav-item.ativo{ color: var(--teal); }

  .nav-fab-slot{ flex:1; display:flex; justify-content:center; }
  .nav-fab{
    width:54px; height:54px; margin-top:-24px; border-radius:50%; border:3px solid var(--creme);
    cursor:pointer; background: linear-gradient(135deg, var(--coral) 0%, #C43A24 100%);
    color:#fff; font-size:22px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 16px rgba(232,84,58,0.4); transition: transform .15s cubic-bezier(.3,1.4,.4,1), background .2s ease;
  }
  .nav-fab:active{ transform: scale(0.87); }
  .nav-fab.ativo{ background: linear-gradient(135deg, var(--teal) 0%, var(--teal-escuro) 100%); box-shadow:0 8px 16px rgba(31,111,92,0.4); }
  .nav-fab-legenda{ font-size:10px; font-weight:800; color:var(--grafite-suave); margin-top:1px; }
  .nav-fab-slot.ativo .nav-fab-legenda{ color:var(--teal); }

  /* ---------- Telas de autenticação ---------- */
  .tela-auth{ padding:36px 26px 26px 26px; }
  .tela-auth .marca-central{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px; margin-bottom:28px; }
  .tela-auth .marca-selo-grande{ width:64px; height:64px; border-radius:20px; box-shadow:0 8px 20px rgba(27,36,48,0.14); }
  .lema{ font-family:'Baloo 2', sans-serif; font-weight:800; color:var(--teal-escuro); font-size:14px; letter-spacing:0.5px; }
  .lema span{ padding:2px 6px; }
  .lema .l-viver{ color:#8C6300; }
  .lema .l-amar{ color:var(--coral); }
  .lema .l-servir{ color:var(--teal); }

  /* ---------- Utilidades de estado vazio ---------- */
  .vazio{ text-align:center; padding:30px 10px; color:var(--grafite-suave); }
  .vazio .vazio-emoji{ font-size:34px; display:block; margin-bottom:8px; }

  /* ---------- Progresso / medidor de pontos ---------- */
  .barra-fundo{ background:#F1ECE0; border-radius:100px; height:10px; overflow:hidden; }
  .barra-preenchida{ height:100%; border-radius:100px; background: linear-gradient(90deg, var(--teal), var(--ouro)); }

  /* Lista de conquistas: emoji + nome + como ganhar (a descrição fica sempre
     visível, não só num tooltip) + progresso ou check de concluída. */
  .conquista-linha{
    display:flex; align-items:center; gap:12px; padding:10px 2px;
    border-bottom:1px solid #F1ECE0;
  }
  .conquista-linha:last-child{ border-bottom:none; }
  .conquista-emoji{
    width:42px; height:42px; border-radius:50%; background:#F1ECE0; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:19px;
  }
  .conquista-linha.desbloqueada .conquista-emoji{ background: var(--ouro-suave); }
  .conquista-texto{ flex:1; min-width:0; }
  .conquista-texto strong{ display:block; font-size:13.5px; color:var(--teal-escuro); }
  .conquista-linha.bloqueada .conquista-texto strong{ color:var(--grafite-suave); }
  .conquista-texto .hint{ margin:0; }
  .conquista-progresso{
    font-size:11px; font-weight:800; color:var(--grafite-suave); background:#F1ECE0;
    padding:3px 9px; border-radius:100px; flex-shrink:0; white-space:nowrap;
  }
  .conquista-check{ font-size:18px; flex-shrink:0; }

  .grade-2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .grade-3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }

  #qr-leitor-video{ width:100%; border-radius:16px; background:#000; }
  #qr-exibicao{ display:flex; justify-content:center; padding:14px; background:var(--branco); border-radius:16px; }

  ::-webkit-scrollbar{ width:0; height:0; }
</style>
</head>
<body>
<div id="app"><div class="vazio" style="padding-top:60px;">Carregando o Videira Serve…</div></div>
<script>
/* =====================================================================
   VOLUNTIA — escalas e check-in de voluntários
   Viver. Amar. Servir.
   Arquivo único, sem build (mesmo espírito do Videira Kids): abre e roda.
   ===================================================================== */

/* ============ 1) FIREBASE (opcional — sem config, roda em modo local) ============
   Enquanto os campos abaixo continuarem com "COLE_AQUI...", o Videira Serve
   funciona em MODO DEMONSTRAÇÃO, salvando tudo no localStorage do próprio
   navegador — dá pra testar o app inteiro sem configurar nada. Assim que
   você colar as credenciais reais de um projeto Firebase (gratuito em
   firebase.google.com), o app troca sozinho pra usar o Firestore de
   verdade, e passa a funcionar publicado, com todo mundo vendo os mesmos
   dados. Veja o passo a passo completo no README.md. */
const firebaseConfig = {
  apiKey: "COLE_AQUI_SUA_API_KEY",
  authDomain: "COLE_AQUI.firebaseapp.com",
  projectId: "COLE_AQUI",
  storageBucket: "COLE_AQUI.firebasestorage.app",
  messagingSenderId: "COLE_AQUI",
  appId: "COLE_AQUI",
};
const FIREBASE_CONFIGURADO = firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith('COLE_AQUI');
let db = null;
let auth = null;
if (FIREBASE_CONFIGURADO){
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    auth = firebase.auth();
    db.enablePersistence({synchronizeTabs:true}).catch(err => {
      console.warn('Persistência offline do Firestore não pôde ser ativada:', err.code);
    });
    console.log('Videira Serve: usando Firestore (Firebase) como banco de dados.');
  }catch(e){
    console.error('Erro ao iniciar o Firebase — verifique se o firebaseConfig está correto.', e);
  }
} else {
  console.log('Videira Serve: firebaseConfig ainda não preenchido — rodando em modo demonstração (localStorage).');
}

/* ============ 2) MARCA / DADOS-PADRÃO DA IGREJA ============
   Isso tudo pode ser mudado na tela "Configurações" pelo admin, sem mexer
   em código — o app é pensado pra ser reaproveitado por qualquer igreja. */
const DEPARTAMENTOS_PADRAO = [
  'Artes Criativo','Balcão de Informações','Cafezinho','Comunicação','Conexão',
  'Coordenação de Voluntários','Ensino','Eventos','House','Intercessão',
  'Liderança de Culto','Louvor','Oferta','Protec','Recepção Externa',
  'Recepção Interna','Sala de Materiais','Segurança','Social IVV','Store',
];
const CONFIG_PADRAO = {
  nomeIgreja: 'Minha Igreja',
  lema: 'Viver, amar e servir pessoas.',
  departamentos: DEPARTAMENTOS_PADRAO.slice(),
  eventos: [
    { id: 'culto-dom-manha', nome: 'Culto de Domingo · Manhã', dia: 'domingo', horario: '09:00', horarioFim: '11:00' },
    { id: 'culto-dom-noite', nome: 'Culto de Domingo · Noite', dia: 'domingo', horario: '18:00', horarioFim: '20:00' },
    { id: 'culto-qua', nome: 'Culto de Quarta', dia: 'quarta', horario: '20:00', horarioFim: '21:30' },
  ],
};
const PONTOS_POR_SERVICO = 5;
const TIPOS_ELOGIO = [
  { tipo: 'Pontualidade', pontos: 2, emoji: '⏰' },
  { tipo: 'Chegou cedo', pontos: 3, emoji: '🌅' },
  { tipo: 'Bom trabalho em equipe', pontos: 2, emoji: '🤝' },
  { tipo: 'Atenção aos detalhes', pontos: 2, emoji: '🔎' },
  { tipo: 'Atitude de servo', pontos: 3, emoji: '💛' },
  { tipo: 'Foi além do esperado', pontos: 4, emoji: '🚀' },
];
/* Cada conquista tem um "campo" (uma estatística do voluntário) e uma

/* ============ 3) CAMADA DE DADOS (mesma "interface" pro resto do app,
   dois motores por baixo: Firestore de verdade, ou localStorage no modo
   demonstração — o resto do código nunca precisa saber qual dos dois). ============ */
const LS_PREFIX = 'videira-serve:';
function genId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 9); }

function lsLista(nome){
  try{ return JSON.parse(localStorage.getItem(LS_PREFIX + nome) || '[]'); }catch(e){ return []; }
}
function lsSalvarLista(nome, lista){ localStorage.setItem(LS_PREFIX + nome, JSON.stringify(lista)); }
function lsUpsert(nome, item){
  const lista = lsLista(nome);
  const idx = lista.findIndex(x => x.id === item.id);
  if (idx >= 0) lista[idx] = item; else lista.push(item);
  lsSalvarLista(nome, lista);
}
function lsAtualizar(nome, id, patch){
  const lista = lsLista(nome);
  const idx = lista.findIndex(x => x.id === id);
  if (idx >= 0){ lista[idx] = { ...lista[idx], ...patch }; lsSalvarLista(nome, lista); }
}

async function colLista(nome){
  if (FIREBASE_CONFIGURADO && db){
    const snap = await db.collection(nome).get();
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }
  return lsLista(nome);
}
async function colAdicionar(nome, obj){
  const id = genId();
  if (FIREBASE_CONFIGURADO && db){
    await db.collection(nome).doc(id).set(obj);
  } else {
    lsUpsert(nome, { id, ...obj });
  }
  return id;
}
async function colDefinir(nome, id, obj){
  if (FIREBASE_CONFIGURADO && db){
    await db.collection(nome).doc(id).set(obj, { merge: true });
  } else {
    const lista = lsLista(nome);
    const atual = lista.find(x => x.id === id) || {};
    lsUpsert(nome, { ...atual, ...obj, id });
  }
}
async function colAtualizar(nome, id, patch){
  if (FIREBASE_CONFIGURADO && db){
    await db.collection(nome).doc(id).update(patch);
  } else {
    lsAtualizar(nome, id, patch);
  }
}

async function lerConfig(){
  if (FIREBASE_CONFIGURADO && db){
    const doc = await db.collection('dados').doc('config').get();
    return doc.exists ? { ...CONFIG_PADRAO, ...doc.data() } : null;
  }
  try{
    const salvo = JSON.parse(localStorage.getItem(LS_PREFIX + 'config') || 'null');
    return salvo ? { ...CONFIG_PADRAO, ...salvo } : null;
  }catch(e){ return null; }
}
async function salvarConfig(cfg){
  state.config = cfg;
  if (FIREBASE_CONFIGURADO && db){
    await db.collection('dados').doc('config').set(cfg, { merge: true });
  } else {
    localStorage.setItem(LS_PREFIX + 'config', JSON.stringify(cfg));
  }
}
async function garantirConfigInicial(){
  let cfg = await lerConfig();
  if (!cfg){
    cfg = { ...CONFIG_PADRAO };
    await salvarConfig(cfg);
  }
  state.config = cfg;
}

function demoContas(){ return lsLista('contas'); }
function demoCriarConta(email, senha){
  const contas = demoContas();
  if (contas.some(c => c.email.toLowerCase() === email.toLowerCase())) throw new Error('Já existe uma conta com esse e-mail.');
  const uid = 'demo-' + genId();
  contas.push({ id: uid, email, senha });

  return uid;
}
function demoLogin(email, senha){
  const conta = demoContas().find(c => c.email.toLowerCase() === email.toLowerCase());
  if (!conta || conta.senha !== senha) throw new Error('E-mail ou senha incorretos.');
  return conta.id;
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function hojeISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function horaAgora(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function diaSemanaISO(iso){
  const [a,m,d] = iso.split('-').map(Number);
  return DIAS_SEMANA_ID[new Date(a, m-1, d).getDay()];
}
function formatarDataBonita(iso){
  const [a,m,d] = iso.split('-').map(Number);
  const dt = new Date(a, m-1, d);
  return String(d).padStart(2,'0') + '/' + String(m).padStart(2,'0') + ' · ' + DIAS_SEMANA_NOME[dt.getDay()];
}
function formatarMesNome(idMes){
  const [ano, mes] = idMes.split('-').map(Number);
  const nomes = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  return nomes[mes-1] + ' de ' + ano;
}
function somarMinutosHorario(hhmm, minutosSomar){
  const [h,m] = (hhmm||'00:00').split(':').map(Number);
  const total = h*60+m+minutosSomar;
  const hh = Math.floor(((total%1440)+1440)%1440/60), mm = ((total%60)+60)%60;
  return String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0');
}
function minutosEntre(hhmmA, hhmmB){
  const [ha,ma] = hhmmA.split(':').map(Number), [hb,mb] = hhmmB.split(':').map(Number);
  return (hb*60+mb) - (ha*60+ma);
}

/* ============ 6) GERAR DATAS DO MÊS (cruza recorrentes + avulsos) ============ */
function gerarDatasDoMes(idMes){
  const [ano, mesNum] = idMes.split('-').map(Number);
  const diasNoMes = new Date(ano, mesNum, 0).getDate();
  const linhas = [];
  for (let dia = 1; dia <= diasNoMes; dia++){
    const iso = ano + '-' + String(mesNum).padStart(2,'0') + '-' + String(dia).padStart(2,'0');
    const diaSemana = diaSemanaISO(iso);
    (state.config.eventos || []).forEach(ev => {
      const bate = ev.dataEspecifica ? ev.dataEspecifica === iso : ev.dia === diaSemana;
      if (bate) linhas.push({ data: iso, tipo:'recorrente', eventoId: ev.id, eventoNome: ev.nome, horario: ev.horario, horarioFim: ev.horarioFim });
    });
  }
  (state.eventosEsporadicos || []).forEach(ev => {
    if (ev.data && ev.data.slice(0,7) === idMes && !ev.excluido){
      linhas.push({ data: ev.data, tipo:'esporadico', eventoId: ev.id, eventoNome: ev.nome, horario: ev.horario, horarioFim: ev.horarioFim });
    }
  });
  return linhas.sort((a,b) => (a.data+(a.horario||'')).localeCompare(b.data+(b.horario||'')));
}
function proximosEventos(diasAFrente){
  const hoje = hojeISO();
  const limite = new Date(); limite.setDate(limite.getDate() + (diasAFrente||30));
  const limiteISO = limite.getFullYear() + '-' + String(limite.getMonth()+1).padStart(2,'0') + '-' + String(limite.getDate()).padStart(2,'0');
  const meses = new Set([hoje.slice(0,7), limiteISO.slice(0,7)]);
  let linhas = [];
  meses.forEach(m => linhas = linhas.concat(gerarDatasDoMes(m)));
  return linhas.filter(l => l.data >= hoje && l.data <= limiteISO);
}

function souAdmin(){ return state.usuario && state.usuario.role === 'admin'; }
function souLider(){ return state.usuario && (state.usuario.role === 'lider' || state.usuario.role === 'admin'); }
function souLiderDe(departamento){

  if (state.usuario.role === 'admin') return true;

}

  if (state.usuario.role === 'lider') return state.usuario.departamentos || [];

}

/* ============ 8) GAMIFICAÇÃO: pontos, sequência e conquistas ============ */
function minhasEscalasPassadasOrdenadas(uid){
  return (state.escalas||[])
    .filter(i => !i.excluida && i.voluntarioUid === uid && i.status === 'confirmado' && i.data <= hojeISO())
    .sort((a,b) => (b.data+(b.horario||'')).localeCompare(a.data+(a.horario||'')));
}
function calcularSequencia(uid){
  const passadas = minhasEscalasPassadasOrdenadas(uid);
  let seq = 0;
  for (const i of passadas){
    if (i.checkin) seq++; else break;
  }
  return seq;
}
async function recalcularStatsVoluntario(uid){
  const vol = state.voluntarios.find(v => v.id === uid);
  if (!vol) return;
  const passadas = minhasEscalasPassadasOrdenadas(uid);
  const comCheckin = passadas.filter(i => i.checkin);
  const totalCheckins = comCheckin.length;
  const sequenciaAtual = calcularSequencia(uid);
  const horasServidas = comCheckin.reduce((soma, i) => {
    if (i.checkin && i.checkout) soma += Math.max(0, minutosEntre(i.checkin.horario, i.checkout.horario)) / 60;
    else soma += 1.5; // estimativa quando não fez check-out manual
    return soma;
  }, 0);
  const pontosServico = totalCheckins * PONTOS_POR_SERVICO;
  const meusElogios = (state.elogios||[]).filter(e => e.voluntarioUid === uid);
  const pontosElogios = meusElogios.reduce((s,e)=>s+(e.pontos||0),0);
  const totalElogios = meusElogios.length;
  const trocasAceitas = (state.trocas||[]).filter(t => t.paraVoluntarioUid === uid && t.status === 'aceita').length;
  const pontos = pontosServico + pontosElogios;
  const conquistasAntes = new Set(vol.conquistas || []);
  const statsParaConquista = { totalCheckins, sequenciaAtual, totalElogios, trocasAceitas, pontos, horasServidas: Math.round(horasServidas*10)/10 };
  const conquistasNovas = CONQUISTAS.filter(c => (statsParaConquista[c.campo]||0) >= c.meta).map(c => c.id);
  const patch = {
    totalCheckins, sequenciaAtual, totalElogios, trocasAceitas,
    horasServidas: Math.round(horasServidas*10)/10,
    pontos,
    conquistas: conquistasNovas,
  };
  Object.assign(vol, patch);
  await colAtualizar('voluntarios', uid, patch);
  const novasDeVerdade = conquistasNovas.filter(id => !conquistasAntes.has(id));
  if (novasDeVerdade.length && uid === state.usuario?.id){
    const c = CONQUISTAS.find(x => x.id === novasDeVerdade[0]);
    showToast('🎉 Nova conquista: ' + c.emoji + ' ' + c.nome + '!');
  }
}

  </div>`;
}

/* ============ 11) CASCA (topbar + navegação) ============ */
function tituloDaAba(){
  return {
    painel: 'Olá, ' + primeiroNome(state.usuario.nome),
    escala: 'Escala',
    checkin: 'Check-in',
    impacto: 'Meu impacto',
    mais: 'Mais',
    perfil: 'Meu perfil',
    elogiar: 'Elogiar voluntário',
    'admin-departamentos': 'Departamentos',
    'admin-eventos': 'Eventos e cultos',
    'admin-voluntarios': 'Voluntários',
    'admin-config': 'Configurações',
    'admin-auditoria': 'Auditoria',
  }[state.aba] || 'Videira Serve';
}
function primeiroNome(nome){ return (nome||'').split(' ')[0]; }

/* As abas principais aparecem na barra debaixo; qualquer outra tela (perfil,
   elogiar, telas de admin…) é uma "sub-tela" alcançada a partir de "Mais" —
   e por isso ganha uma seta de voltar no topo em vez do cabeçalho de marca. */
const ABAS_PRINCIPAIS = ['painel', 'escala', 'checkin', 'impacto', 'mais'];
function ehSubTela(){ return !ABAS_PRINCIPAIS.includes(state.aba); }

function telaShell(){
  const subTela = ehSubTela();
  return `<div class="topbar">
      <div class="topbar-linha1">
        ${subTela ? `
          <button class="icon-btn" data-action="voltar" title="Voltar">←</button>
          <div class="marca-nome" style="font-size:17px;">${esc(tituloDaAba())}</div>
          <div class="topbar-acoes"><button class="icon-btn" data-action="sair" title="Sair">⎋</button></div>
        ` : `
          <div class="marca">
            <div class="marca-selo">${marcaSeloSvg(22)}</div>
            <div><div class="marca-nome">Videira Serve</div><div class="marca-sub">${esc((state.config&&state.config.nomeIgreja)||'')}</div></div>
          </div>
          <div class="topbar-acoes">
            <button class="icon-btn" data-action="sair" title="Sair">⎋</button>
          </div>
        `}
      </div>
      ${!subTela ? `<div class="topbar-titulo">${esc(tituloDaAba())}</div>` : ''}
    </div>
    <div class="conteudo">${telaConteudo()}</div>
    ${navInferior()}`;
}

function navInferior(){
  const itens = [
    { id:'painel', icone:'🏠', nome:'Início' },
    { id:'escala', icone:'📅', nome:'Escala' },
    { id:'impacto', icone:'💛', nome:'Impacto' },
    { id:'mais', icone:'☰', nome:'Mais' },
  ];
  const meio = Math.ceil(itens.length/2);
  const antes = itens.slice(0, meio), depois = itens.slice(meio);
  const ativoCheckin = state.aba === 'checkin';
  const item = (it) => `<button class="nav-item ${state.aba===it.id?'ativo':''}" data-action="ir-aba" data-aba="${it.id}"><span class="nav-icone-bolha"><span class="nav-icone">${it.icone}</span></span>${it.nome}</button>`;
  return `<div class="nav-inferior">
    ${antes.map(item).join('')}
    <div class="nav-fab-slot ${ativoCheckin?'ativo':''}">
      <button class="nav-fab ${ativoCheckin?'ativo':''}" data-action="ir-aba" data-aba="checkin" title="Check-in">📍</button>
    </div>
    ${depois.map(item).join('')}
  </div>`;
}

function telaConteudo(){
  switch(state.aba){
    case 'escala': return telaEscala();
    case 'checkin': return telaCheckin();
    case 'impacto': return telaImpacto();
    case 'mais': return telaMais();
    case 'admin-departamentos': return telaAdminDepartamentos();
    case 'admin-eventos': return telaAdminEventos();
    case 'admin-escala': return telaAdminEscala();
    case 'admin-voluntarios': return telaAdminVoluntarios();
    case 'admin-config': return telaAdminConfig();
    case 'admin-auditoria': return telaAdminAuditoria();
    case 'elogiar': return telaElogiar();
    case 'perfil': return telaPerfil();
    default: return telaPainel();
  }
}

/* ============ 12) TELA: PAINEL (início) ============ */
function meuProximoCompromisso(){
  return (state.escalas||[])
    .filter(i => !i.excluida && i.voluntarioUid === state.usuario.id && i.status === 'confirmado' && i.data >= hojeISO())
    .sort((a,b) => (a.data+(a.horario||'')).localeCompare(b.data+(b.horario||'')))[0] || null;
}
function vagasAbertasParaMim(){
  const deps = state.usuario.departamentos || [];
  if (!deps.length) return [];
  const eventos = proximosEventos(30);
  const vagas = [];
  eventos.forEach(ev => {
    deps.forEach(dep => {
      const preenchida = (state.escalas||[]).some(i => !i.excluida && i.status!=='cancelado_pendente' && i.eventoTipo===ev.tipo && i.eventoId===ev.eventoId && i.data===ev.data && i.departamento===dep);
      if (!preenchida) vagas.push({ ...ev, departamento: dep });
    });
  });
  return vagas.sort((a,b)=> (a.data+(a.horario||'')).localeCompare(b.data+(b.horario||'')));
}
function trocasAbertasParaMim(){
  const deps = state.usuario.departamentos || [];
  return (state.trocas||[]).filter(t => t.status==='aberta' && t.deVoluntarioUid !== state.usuario.id && deps.includes(t.departamento));
}

function telaPainel(){
  const proximo = meuProximoCompromisso();
  const vagas = vagasAbertasParaMim();
  const trocas = trocasAbertasParaMim();
  const v = versiculoDoDia(hojeISO());
  const hojeTemCompromisso = proximo && proximo.data === hojeISO();
  return `
    <div class="cartao" style="background:linear-gradient(135deg, var(--teal) 0%, var(--teal-escuro) 100%); color:#fff;">
      <p style="margin:0; font-size:12.5px; opacity:0.85;">Versículo do dia</p>
      <p style="margin:6px 0 0 0; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15px; line-height:1.4;">"${esc(v.texto)}"</p>
      <p style="margin:6px 0 0 0; font-size:12px; opacity:0.85;">${esc(v.referencia)}</p>
    </div>

    ${hojeTemCompromisso ? `
    <div class="cartao" style="background:var(--coral); color:#fff;">
      <div class="linha"><strong>🎈 Você serve hoje!</strong><span class="badge" style="background:rgba(255,255,255,0.25); color:#fff;">${esc(proximo.horario||'')}</span></div>
      <p style="margin:8px 0 0 0;">${esc(proximo.eventoNome)} · ${esc(proximo.departamento)}</p>
      <button class="btn btn-block" style="background:#fff; color:var(--coral); margin-top:12px;" data-action="ir-aba" data-aba="checkin">Ir para o check-in →</button>
    </div>` : ''}

    <div class="cartao">
      <div class="cartao-titulo">Meu próximo compromisso</div>
      ${proximo ? `
        <div class="lista-item" style="border:none; padding:4px 0;">
          <div>
            <strong>${esc(proximo.eventoNome)}</strong><br>
            <span class="hint">${formatarDataBonita(proximo.data)} · ${esc(proximo.horario||'')} · ${esc(proximo.departamento)}</span>
          </div>
          <span class="badge badge-servir">Confirmado</span>
        </div>` : `<p class="hint" style="margin:0;">Nenhum compromisso à vista. Dá uma olhada nas <a href="#" data-action="ir-vagas">vagas abertas</a>?</p>`}
    </div>

    <div class="grade-2">
      <div class="cartao" style="text-align:center;">
        <div style="font-size:26px;">🔥</div>
        <div style="font-size:22px; font-weight:800; font-family:'Baloo 2',sans-serif;">${state.usuario.sequenciaAtual||0}</div>
        <div class="hint">sequência atual</div>
      </div>
      <div class="cartao" style="text-align:center;">
        <div style="font-size:26px;">💛</div>
        <div style="font-size:22px; font-weight:800; font-family:'Baloo 2',sans-serif;">${state.usuario.pontos||0}</div>
        <div class="hint">pontos</div>
      </div>
    </div>

    <div class="cartao">
      <div class="linha"><div class="cartao-titulo" style="margin:0;">Vagas abertas na minha área</div><span class="badge badge-amar">${vagas.length}</span></div>
      ${vagas.length===0 ? `<p class="hint" style="margin:6px 0 0 0;">Tudo preenchido por enquanto. 🎉</p>` : `
        <div class="col" style="margin-top:8px;">
          ${vagas.slice(0,3).map(v => `<div class="lista-item"><div><strong>${esc(v.eventoNome)}</strong><br><span class="hint">${formatarDataBonita(v.data)} · ${esc(v.departamento)}</span></div><button class="btn btn-secondary btn-small" data-action="quero-servir" data-tipo="${v.tipo}" data-evento="${esc(v.eventoId)}" data-data="${v.data}" data-depto="${esc(v.departamento)}" data-nome="${esc(v.eventoNome)}" data-horario="${esc(v.horario||'')}">Quero servir</button></div>`).join('')}
        </div>
        ${vagas.length>3 ? `<button class="btn btn-ghost btn-small btn-block" style="margin-top:8px;" data-action="ir-vagas">Ver todas (${vagas.length})</button>`:''}
      `}
    </div>

    ${trocas.length ? `<div class="cartao">
      <div class="linha"><div class="cartao-titulo" style="margin:0;">Pedidos de troca</div><span class="badge badge-alerta">${trocas.length}</span></div>
      <p class="hint" style="margin:6px 0 0 0;">Alguém da sua área não pode servir e está procurando substituto.</p>
      <button class="btn btn-secondary btn-small btn-block" style="margin-top:10px;" data-action="ir-trocas">Ver pedidos →</button>
    </div>` : ''}
  `;
}

/* ============ 13) TELA: ESCALA (meus compromissos / vagas / trocas / montar) ============ */
function telaEscala(){
  const sub = state.escalaSubaba || 'meus';
  const podeMontar = souLider();
  const pills = [
    {id:'meus', nome:'Meus compromissos'},
    {id:'vagas', nome:'Vagas abertas'},
    {id:'trocas', nome:'Trocas'},
  ];
  if (podeMontar) pills.push({id:'montar', nome:'Montar escala'});
  let corpo = '';
  if (sub==='meus') corpo = telaEscalaMeus();
  else if (sub==='vagas') corpo = telaEscalaVagas();
  else if (sub==='trocas') corpo = telaEscalaTrocas();
  else if (sub==='montar') corpo = telaEscalaMontar();
  return `<div class="row" style="margin-bottom:14px;">
    ${pills.map(p => `<button class="chip ${sub===p.id?'ativo':''}" data-action="escala-subaba" data-sub="${p.id}">${p.nome}</button>`).join('')}
  </div>${corpo}`;
}

function telaEscalaMeus(){
  const minhas = (state.escalas||[]).filter(i => !i.excluida && i.voluntarioUid===state.usuario.id && i.data>=hojeISO())
    .sort((a,b)=>(a.data+(a.horario||'')).localeCompare(b.data+(b.horario||'')));
  if (!minhas.length) return `<div class="vazio"><span class="vazio-emoji">📅</span>Você ainda não está em nenhuma escala.<br><button class="btn btn-primary btn-small" style="margin-top:14px;" data-action="escala-subaba" data-sub="vagas">Ver vagas abertas</button></div>`;
  return `<div class="cartao">${minhas.map(i => `
    <div class="lista-item">
      <div>
        <strong>${esc(i.eventoNome)}</strong><br>
        <span class="hint">${formatarDataBonita(i.data)} · ${esc(i.horario||'')} · ${esc(i.departamento)}</span><br>
        <span class="badge ${i.status==='proposto'?'badge-alerta':'badge-servir'}">${i.status==='proposto'?'Aguardando aprovação':(i.checkin?'Check-in feito':'Confirmado')}</span>
      </div>
      <div class="col" style="align-items:flex-end;">
        ${i.status!=='proposto' ? `<button class="btn btn-ghost btn-small" data-action="abrir-pedir-troca" data-escala="${i.id}">Pedir troca</button>`:''}
        <button class="btn btn-danger btn-small" data-action="abrir-desmarcar" data-escala="${i.id}">Desmarcar</button>
      </div>
    </div>`).join('')}</div>`;
}

function telaEscalaVagas(){
  const vagas = vagasAbertasParaMim();
  if (!vagas.length) return `<div class="vazio"><span class="vazio-emoji">🎉</span>Tudo preenchido nas suas áreas por enquanto.</div>`;
  return `<div class="cartao">${vagas.map(v => `
    <div class="lista-item">
      <div><strong>${esc(v.eventoNome)}</strong><br><span class="hint">${formatarDataBonita(v.data)} · ${esc(v.horario||'')} · ${esc(v.departamento)}</span></div>
      <button class="btn btn-secondary btn-small" data-action="quero-servir" data-tipo="${v.tipo}" data-evento="${esc(v.eventoId)}" data-data="${v.data}" data-depto="${esc(v.departamento)}" data-nome="${esc(v.eventoNome)}" data-horario="${esc(v.horario||'')}">Quero servir</button>
    </div>`).join('')}</div>`;
}

function telaEscalaTrocas(){
  const abertasParaMim = trocasAbertasParaMim();
  const minhas = (state.trocas||[]).filter(t => t.deVoluntarioUid===state.usuario.id).sort((a,b)=>(b.criadoEm||'').localeCompare(a.criadoEm||''));
  return `
    <div class="cartao-titulo" style="margin:4px 0 8px 4px;">Pedidos que você pode aceitar</div>
    ${abertasParaMim.length ? `<div class="cartao">${abertasParaMim.map(t => `
      <div class="lista-item">
        <div><strong>${esc(t.departamento)}</strong> · ${formatarDataBonita(t.data)}<br><span class="hint">${esc(t.eventoNome)} — pedido de ${esc(t.deVoluntarioNome)}${t.motivo?': "'+esc(t.motivo)+'"':''}</span></div>
        <button class="btn btn-secondary btn-small" data-action="aceitar-troca" data-troca="${t.id}">Aceitar</button>
      </div>`).join('')}</div>` : `<p class="hint" style="margin:0 0 18px 4px;">Nenhum pedido em aberto nas suas áreas agora.</p>`}

    <div class="cartao-titulo" style="margin:14px 0 8px 4px;">Meus pedidos de troca</div>
    ${minhas.length ? `<div class="cartao">${minhas.map(t => `
      <div class="lista-item">
        <div><strong>${esc(t.departamento)}</strong> · ${formatarDataBonita(t.data)}<br><span class="badge ${t.status==='aberta'?'badge-alerta':(t.status==='aceita'?'badge-servir':'')}">${t.status==='aberta'?'Aguardando alguém aceitar':(t.status==='aceita'?'Aceito por '+esc(t.paraVoluntarioNome||''):'Cancelado')}</span></div>
        ${t.status==='aberta' ? `<button class="btn btn-ghost btn-small" data-action="cancelar-troca" data-troca="${t.id}">Cancelar</button>`:''}
      </div>`).join('')}</div>` : `<p class="hint" style="margin:0 4px;">Você ainda não pediu nenhuma troca.</p>`}
  `;
}

function eventualLideradosOrdenados(departamento){
  return (state.voluntarios||[]).filter(v => v.ativo!==false && (v.departamentos||[]).includes(departamento))
    .sort((a,b) => (a.ultimaVezServiu||'0000-00-00').localeCompare(b.ultimaVezServiu||'0000-00-00'));
}

function telaEscalaMontar(){
  const deps = meusDepartamentosLiderados();
  const eventos = proximosEventos(21);
  const propostos = (state.escalas||[]).filter(i => !i.excluida && i.status==='proposto' && deps.includes(i.departamento));
  return `
    ${propostos.length ? `<div class="cartao" style="background:var(--ouro-suave);">
      <div class="cartao-titulo">Pedidos aguardando sua aprovação</div>
      ${propostos.map(i => `<div class="lista-item">
        <div><strong>${esc(i.voluntarioNome)}</strong> · ${esc(i.departamento)}<br><span class="hint">${formatarDataBonita(i.data)} · ${esc(i.eventoNome)}</span></div>
        <div class="row"><button class="btn btn-secondary btn-small" data-action="aprovar-proposto" data-escala="${i.id}">Aprovar</button><button class="btn btn-ghost btn-small" data-action="abrir-desmarcar" data-escala="${i.id}">Recusar</button></div>
      </div>`).join('')}
    </div>` : ''}

    ${eventos.map(ev => `
      <div class="cartao">
        <div class="cartao-titulo">${esc(ev.eventoNome)} · ${formatarDataBonita(ev.data)}</div>
        ${deps.map(dep => {
          const escaladosDep = (state.escalas||[]).filter(i => !i.excluida && i.status==='confirmado' && i.eventoTipo===ev.tipo && i.eventoId===ev.eventoId && i.data===ev.data && i.departamento===dep);
          return `<div class="lista-item">
            <div><strong>${esc(dep)}</strong><br><span class="hint">${escaladosDep.length ? escaladosDep.map(e=>esc(e.voluntarioNome)).join(', ') : 'Ninguém escalado ainda'}</span></div>
            <button class="btn btn-secondary btn-small" data-action="abrir-escalar-alguem" data-tipo="${ev.tipo}" data-evento="${esc(ev.eventoId)}" data-data="${ev.data}" data-depto="${esc(dep)}" data-nome="${esc(ev.eventoNome)}" data-horario="${esc(ev.horario||'')}">+ Escalar</button>
          </div>`;
        }).join('')}
      </div>`).join('')}
    ${eventos.length===0 ? `<div class="vazio">Nenhum evento configurado ainda. Peça pro admin cadastrar os cultos/eventos em Mais → Eventos.</div>` : ''}
  `;
}

/* ============ 14) TELA: CHECK-IN ============ */
function compromissoDeHoje(){
  return (state.escalas||[]).find(i => !i.excluida && i.voluntarioUid===state.usuario.id && i.status==='confirmado' && i.data===hojeISO());
}
function telaCheckin(){
  const compromisso = compromissoDeHoje();
  let corpo;
  if (!compromisso){
    const proximo = meuProximoCompromisso();
    corpo = `<div class="vazio">
      <span class="vazio-emoji">📍</span>
      Você não tem compromisso hoje.
      ${proximo ? `<p class="hint" style="margin-top:8px;">Seu próximo é em ${formatarDataBonita(proximo.data)} (${esc(proximo.departamento)}).</p>` : ''}
    </div>`;
  } else if (!compromisso.checkin){
    corpo = `<div class="cartao" style="text-align:center;">
      <div style="font-size:34px;">📍</div>
      <div class="cartao-titulo" style="justify-content:center;">${esc(compromisso.eventoNome)}</div>
      <p class="hint">${esc(compromisso.departamento)} · ${esc(compromisso.horario||'')}</p>
      <div class="col" style="margin-top:16px;">
        <button class="btn btn-primary btn-block" data-action="abrir-scanner-qr" data-escala="${compromisso.id}">📷 Escanear QR da portaria</button>
        <button class="btn btn-secondary btn-block" data-action="fazer-checkin-manual" data-escala="${compromisso.id}">✋ Confirmar chegada manualmente</button>
      </div>
    </div>`;
  } else if (!compromisso.checkout){
    corpo = `<div class="cartao" style="text-align:center; background:var(--teal-suave);">
      <div style="font-size:34px;">✅</div>
      <p style="font-weight:800; color:var(--teal-escuro);">Check-in feito às ${esc(compromisso.checkin.horario)}</p>
      <p class="hint">${esc(compromisso.eventoNome)} · ${esc(compromisso.departamento)}</p>
      <button class="btn btn-coral btn-block" style="margin-top:14px;" data-action="fazer-checkout" data-escala="${compromisso.id}">Finalizar meu turno</button>
    </div>`;
  } else {
    corpo = `<div class="cartao" style="text-align:center;">
      <div style="font-size:34px;">🙏</div>
      <p style="font-weight:800; color:var(--teal-escuro);">Turno concluído — obrigado por servir hoje!</p>
      <p class="hint">Entrada ${esc(compromisso.checkin.horario)} · Saída ${esc(compromisso.checkout.horario)}</p>
    </div>`;
  }
  const portaria = souLider() ? `<div class="cartao">

/* ============ 15) TELA: MEU IMPACTO (gamificação) ============ */
function telaImpacto(){
  const u = state.usuario;
  const meusElogios = (state.elogios||[]).filter(e => e.voluntarioUid===u.id).sort((a,b)=>(b.criadoEm||'').localeCompare(a.criadoEm||''));
  const desbloqueadas = (u.conquistas||[]).length;
  // desbloqueadas primeiro; entre as travadas, a mais pertinho de sair do
  // cadeado aparece no topo — dá um empurrãozinho pra próxima conquista.
  const conquistasOrdenadas = [...CONQUISTAS].sort((a, b) => {
    const aOk = (u.conquistas||[]).includes(a.id), bOk = (u.conquistas||[]).includes(b.id);
    if (aOk !== bOk) return aOk ? -1 : 1;
    if (aOk) return 0;
    return ((u[b.campo]||0)/b.meta) - ((u[a.campo]||0)/a.meta);
  });
  return `
    <div class="grade-3">
      <div class="cartao" style="text-align:center;"><div style="font-size:22px;">💛</div><div style="font-weight:800; font-size:19px;">${u.pontos||0}</div><div class="hint">pontos</div></div>
      <div class="cartao" style="text-align:center;"><div style="font-size:22px;">🙌</div><div style="font-weight:800; font-size:19px;">${u.totalCheckins||0}</div><div class="hint">serviços</div></div>
      <div class="cartao" style="text-align:center;"><div style="font-size:22px;">⏱️</div><div style="font-weight:800; font-size:19px;">${u.horasServidas||0}h</div><div class="hint">servidas</div></div>
    </div>
    <div class="cartao">
      <div class="linha"><div class="cartao-titulo" style="margin:0;">Sequência atual</div><span class="badge badge-amar">🔥 ${u.sequenciaAtual||0}</span></div>
      <p class="hint" style="margin:6px 0 0 0;">Serviços seguidos em que você fez check-in, sem faltar.</p>
    </div>
    <div class="cartao">
      <div class="linha"><div class="cartao-titulo" style="margin:0;">Conquistas</div><span class="badge badge-viver">${desbloqueadas}/${CONQUISTAS.length}</span></div>
      <div style="margin-top:2px;">
        ${conquistasOrdenadas.map(c => {
          const atual = u[c.campo] || 0;
          const desbloqueada = atual >= c.meta;
          return `<div class="conquista-linha ${desbloqueada?'desbloqueada':'bloqueada'}">
            <div class="conquista-emoji">${desbloqueada ? c.emoji : '🔒'}</div>
            <div class="conquista-texto"><strong>${esc(c.nome)}</strong><p class="hint">${esc(c.descricao)}</p></div>
            ${desbloqueada ? `<span class="conquista-check">✅</span>` : `<span class="conquista-progresso">${Math.min(atual,c.meta)}/${c.meta}</span>`}
          </div>`;
        }).join('')}
      </div>
    </div>
    ${meusElogios.length ? `<div class="cartao">
      <div class="cartao-titulo">Elogios recebidos</div>
      ${meusElogios.map(e => `<div class="lista-item"><div><strong>${e.emoji||'💛'} ${esc(e.tipo)}</strong>${e.mensagem?`<br><span class="hint">"${esc(e.mensagem)}"</span>`:''}<br><span class="hint">de ${esc(e.deQuemNome)}</span></div><span class="badge badge-viver">+${e.pontos}</span></div>`).join('')}
    </div>` : ''}
  `;
}

async function criarEscala(campos, status){
  const id = await colAdicionar('escalas', {
    voluntarioUid: state.usuario.id, voluntarioNome: state.usuario.nome,
    departamento: campos.depto, data: campos.data,
    eventoId: campos.evento, eventoNome: campos.nome, eventoTipo: campos.tipo,
    horario: campos.horario || '', status,
    excluida: false, criadoEm: new Date().toISOString(),
  });
  state.escalas.push({ id, voluntarioUid: state.usuario.id, voluntarioNome: state.usuario.nome,
    departamento: campos.depto, data: campos.data, eventoId: campos.evento, eventoNome: campos.nome,
    eventoTipo: campos.tipo, horario: campos.horario||'', status, excluida:false });
}

async function concluirCheckin(escalaId, metodo){
  const i = state.escalas.find(x => x.id === escalaId);
  if (!i || i.checkin) return;
  const patch = { checkin: { horario: horaAgora(), metodo } };
  Object.assign(i, patch);
  await colAtualizar('escalas', escalaId, patch);
  await colAtualizar('voluntarios', i.voluntarioUid, { ultimaVezServiu: i.data });
  await recalcularStatsVoluntario(i.voluntarioUid);
  await registrarAuditoria('check-in', i.eventoNome + ' · ' + i.departamento);
  showToast('✅ Check-in feito! Bom serviço 🙌');
  render();
}

async function handleClick(e){
  const el = e.target.closest('[data-action]');
  if (e.target.classList && e.target.classList.contains('overlay')){ fecharModal(); return; }
  if (!el) return;
  const a = el.dataset.action;
  const d = el.dataset;
  try{

  if (a === 'ir-cadastro'){ e.preventDefault(); state.telaAuth='cadastro'; render(); }
  else if (a === 'ir-login'){ e.preventDefault(); state.telaAuth='login'; render(); }
  else if (a === 'toggle-depto-cadastro'){ togglearray(state.cadastroForm.departamentos, d.depto); render(); }
  else if (a === 'toggle-dia-cadastro'){ togglearray(state.cadastroForm.disponibilidade, d.dia); render(); }
  else if (a === 'toggle-depto-perfil'){ togglearray(state.usuario.departamentos = state.usuario.departamentos||[], d.depto); render(); }
  else if (a === 'toggle-dia-perfil'){ togglearray(state.usuario.disponibilidade = state.usuario.disponibilidade||[], d.dia); render(); }
  else if (a === 'sair'){ await fazerLogout(); }
  else if (a === 'voltar'){ state.aba = 'mais'; render(); }
  else if (a === 'ir-aba'){ state.aba = d.aba; if (d.aba==='escala') state.escalaSubaba='meus'; render(); }
  else if (a === 'ir-vagas'){ e.preventDefault(); state.aba='escala'; state.escalaSubaba='vagas'; render(); }
  else if (a === 'ir-trocas'){ e.preventDefault(); state.aba='escala'; state.escalaSubaba='trocas'; render(); }
  else if (a === 'escala-subaba'){ state.escalaSubaba = d.sub; render(); }
  else if (a === 'ir-perfil'){ state.aba='perfil'; render(); }
  else if (a === 'ir-elogiar'){ state.aba='elogiar'; render(); }
  else if (a === 'ir-admin-departamentos'){ state.aba='admin-departamentos'; render(); }
  else if (a === 'ir-admin-eventos'){ state.aba='admin-eventos'; render(); }
  else if (a === 'ir-admin-voluntarios'){ state.aba='admin-voluntarios'; render(); }
  else if (a === 'ir-admin-config'){ state.aba='admin-config'; render(); }
  else if (a === 'ir-admin-auditoria'){ state.aba='admin-auditoria'; await carregarAuditoria(); render(); }
  else if (a === 'fechar-modal-overlay' || a === 'fechar-modal'){ fecharModal(); }

  else if (a === 'quero-servir'){
    const status = existeLiderPara(d.depto) ? 'proposto' : 'confirmado';
    await criarEscala({ tipo:d.tipo, evento:d.evento, data:d.data, depto:d.depto, nome:d.nome, horario:d.horario }, status);
    await registrarAuditoria('escala', d.nome + ' · ' + d.depto);
    showToast(status==='confirmado' ? '✅ Você está escalado(a)!' : '📨 Pedido enviado — aguardando o líder aprovar.');
    render();
  }
  else if (a === 'abrir-pedir-troca'){ abrirModal({ tipo:'pedir-troca', escalaId:d.escala }); }
  else if (a === 'abrir-desmarcar'){ abrirModal({ tipo:'desmarcar', escalaId:d.escala }); }
  else if (a === 'aceitar-troca'){
    const t = state.trocas.find(x => x.id === d.troca);
    if (!t) return;
    const i = state.escalas.find(x => x.id === t.escalaId);
    if (i){
      const patchEscala = { voluntarioUid: state.usuario.id, voluntarioNome: state.usuario.nome };
      Object.assign(i, patchEscala);
      await colAtualizar('escalas', i.id, patchEscala);
    }
    const patchTroca = { status:'aceita', paraVoluntarioUid: state.usuario.id, paraVoluntarioNome: state.usuario.nome };
    Object.assign(t, patchTroca);
    await colAtualizar('trocas', t.id, patchTroca);
    await recalcularStatsVoluntario(state.usuario.id);
    await registrarAuditoria('troca aceita', t.departamento + ' · ' + t.data);
    showToast('🤝 Troca aceita — você assumiu a vaga!');
    render();
  }
  else if (a === 'cancelar-troca'){
    const t = state.trocas.find(x => x.id === d.troca);
    Object.assign(t, { status:'cancelada' });
    await colAtualizar('trocas', t.id, { status:'cancelada' });
    render();
  }
  else if (a === 'abrir-escalar-alguem'){ abrirModal({ tipo:'escalar-alguem', eventoTipo:d.tipo, eventoId:d.evento, data:d.data, depto:d.depto, nome:d.nome, horario:d.horario }); }
  else if (a === 'escalar-confirmar'){
    const vol = state.voluntarios.find(v => v.id === d.uid);
    const id = await colAdicionar('escalas', {
      voluntarioUid: vol.id, voluntarioNome: vol.nome, departamento: d.depto, data: d.data,
      eventoId: d.evento, eventoNome: d.nome, eventoTipo: d.tipo, horario: d.horario || '',
      status: 'confirmado', excluida:false, criadoEm: new Date().toISOString(),
    });
    state.escalas.push({ id, voluntarioUid: vol.id, voluntarioNome: vol.nome, departamento: d.depto, data: d.data, eventoId: d.evento, eventoNome: d.nome, eventoTipo: d.tipo, horario: d.horario||'', status:'confirmado', excluida:false });
    await registrarAuditoria('escalou voluntário', vol.nome + ' em ' + d.depto);
    showToast('✅ ' + vol.nome + ' escalado(a)!');
    fecharModal();
  }
  else if (a === 'aprovar-proposto'){
    const i = state.escalas.find(x => x.id === d.escala);
    Object.assign(i, { status:'confirmado' });
    await colAtualizar('escalas', i.id, { status:'confirmado' });
    await registrarAuditoria('aprovou escala', i.voluntarioNome + ' · ' + i.departamento);
    showToast('✅ Aprovado!');
    render();
  }
  else if (a === 'abrir-scanner-qr'){ abrirModal({ tipo:'scanner-qr', escalaId:d.escala }); }
  else if (a === 'fazer-checkin-manual'){ fecharModal(); await concluirCheckin(d.escala, 'manual'); }
  else if (a === 'marcar-chegada-manual'){ await concluirCheckin(d.escala, 'lider'); }
  else if (a === 'fazer-checkout'){
    const i = state.escalas.find(x => x.id === d.escala);
    const patch = { checkout: { horario: horaAgora() } };
    Object.assign(i, patch);
    await colAtualizar('escalas', i.id, patch);
    await recalcularStatsVoluntario(i.voluntarioUid);
    showToast('🙏 Turno finalizado. Obrigado por servir!');
    render();
  }
  else if (a === 'abrir-qr-portaria'){ abrirModal({ tipo:'qr-portaria' }); }
  else if (a === 'exportar-escala'){ exportarEscalaXlsx(); }
  else if (a === 'exportar-escala-pdf'){ exportarEscalaPdf(); }
  else if (a === 'remover-depto'){
    if (!confirm('Remover "'+d.depto+'"? Isso não apaga escalas já feitas.')) return;
    state.config.departamentos = state.config.departamentos.filter(x => x !== d.depto);
    await salvarConfig(state.config);
    render();
  }
  else if (a === 'remover-evento-recorrente'){
    state.config.eventos = state.config.eventos.filter(x => x.id !== d.id);
    await salvarConfig(state.config);
    render();
  }
  else if (a === 'remover-evento-avulso'){
    await colAtualizar('eventosEsporadicos', d.id, { excluido: true });
    state.eventosEsporadicos = state.eventosEsporadicos.filter(x => x.id !== d.id);
    render();
  }
  else if (a === 'editar-departamentos-voluntario'){ abrirModal({ tipo:'editar-departamentos', uid: d.uid }); }
  else if (a === 'toggle-depto-editar'){ togglearray(state.modal.selecionados = state.modal.selecionados || [...(state.voluntarios.find(v=>v.id===state.modal.uid).departamentos||[])], d.depto); render(); }
  else if (a === 'salvar-departamentos-voluntario'){
    const vol = state.voluntarios.find(v => v.id === d.uid);
    const novos = state.modal.selecionados || vol.departamentos;
    Object.assign(vol, { departamentos: novos });
    await colAtualizar('voluntarios', d.uid, { departamentos: novos });
    fecharModal();
    showToast('Áreas atualizadas.');
  }
  else if (a === 'toggle-ativo-voluntario'){
    const vol = state.voluntarios.find(v => v.id === d.uid);
    const novoAtivo = vol.ativo === false;
    Object.assign(vol, { ativo: novoAtivo });
    await colAtualizar('voluntarios', d.uid, { ativo: novoAtivo });
    render();
  }

  }catch(err){
    console.error(err);
    showToast('Ops: ' + (err.message || 'algo deu errado.'));
  }
}
function togglearray(arr, valor){
  const idx = arr.indexOf(valor);
  if (idx >= 0) arr.splice(idx,1); else arr.push(valor);
}

/* Mantém os campos de texto sincronizados com o state mesmo quando um clique
   em outro elemento (ex.: um chip de departamento) força um novo render() no
   meio do preenchimento — sem isso, o re-render apagaria o que a pessoa já
   tinha digitado no formulário. */
function handleInput(e){
  const el = e.target;
  const form = el.closest('form');
  if (!form || !el.name) return;
  const tipo = form.dataset.form;
  if (tipo === 'cadastro' && (el.name in state.cadastroForm)) state.cadastroForm[el.name] = el.value;
  else if (tipo === 'login' && (el.name in state.loginForm)) state.loginForm[el.name] = el.value;
  else if (tipo === 'perfil' && (el.name === 'nome' || el.name === 'telefone')) state.usuario[el.name] = el.value;
}

async function handleChange(e){
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  if (a === 'mudar-role'){
    const vol = state.voluntarios.find(v => v.id === el.dataset.uid);
    Object.assign(vol, { role: el.value });
    await colAtualizar('voluntarios', el.dataset.uid, { role: el.value });
    await registrarAuditoria('mudou papel', vol.nome + ' → ' + el.value);
    showToast(vol.nome + ' agora é ' + el.value + '.');
    render();
  }
}

async function handleSubmit(e){
  e.preventDefault();
  const form = e.target.closest('form');
  if (!form) return;
  const tipo = form.dataset.form;
  const fd = new FormData(form);

  try{
    if (tipo === 'login'){
      const email = fd.get('email').trim(), senha = fd.get('senha');
      state.carregando = true; render();
      const uid = await fazerLogin(email, senha);
      await entrarComUid(uid);
    }
    else if (tipo === 'cadastro'){
      const dados = {
        nome: fd.get('nome').trim(), email: fd.get('email').trim(), telefone: fd.get('telefone').trim(),
        senha: fd.get('senha'), departamentos: state.cadastroForm.departamentos, disponibilidade: state.cadastroForm.disponibilidade,
      };
      if (!dados.departamentos.length){ showToast('Escolha ao menos uma área pra servir.'); return; }
      state.carregando = true; render();
      const uid = await fazerCadastro(dados);
      await entrarComUid(uid);
    }
    else if (tipo === 'perfil'){
      const patch = {
        nome: fd.get('nome').trim(), telefone: fd.get('telefone').trim(),
        departamentos: state.usuario.departamentos, disponibilidade: state.usuario.disponibilidade,
        avisarVagaAberta: fd.get('avisarVagaAberta') === 'on',
        notificacoesDesativadas: fd.get('notificacoesDesativadas') === 'on',
      };
      Object.assign(state.usuario, patch);
      await colAtualizar('voluntarios', state.usuario.id, patch);
      showToast('Perfil atualizado!');
      state.aba='mais'; render();
    }
    else if (tipo === 'pedir-troca'){
      const i = state.escalas.find(x => x.id === form.dataset.escala);
      const id = await colAdicionar('trocas', {
        escalaId: i.id, departamento: i.departamento, data: i.data, eventoNome: i.eventoNome,
        eventoId: i.eventoId, eventoTipo: i.eventoTipo, deVoluntarioUid: i.voluntarioUid, deVoluntarioNome: i.voluntarioNome,
        motivo: fd.get('motivo').trim(), status:'aberta', criadoEm: new Date().toISOString(),
      });
      state.trocas.push({ id, escalaId:i.id, departamento:i.departamento, data:i.data, eventoNome:i.eventoNome, eventoId:i.eventoId, eventoTipo:i.eventoTipo, deVoluntarioUid:i.voluntarioUid, deVoluntarioNome:i.voluntarioNome, motivo:fd.get('motivo'), status:'aberta' });
      await registrarAuditoria('pediu troca', i.departamento + ' · ' + i.data);
      fecharModal();
      showToast('Pedido de troca publicado.');
    }
    else if (tipo === 'desmarcar'){
      const id = form.dataset.escala;
      const i = state.escalas.find(x => x.id === id);
      const patch = { excluida:true, canceladoMotivo: fd.get('motivo').trim() };
      Object.assign(i, patch);
      await colAtualizar('escalas', id, patch);
      await registrarAuditoria('desmarcou', i.eventoNome + ' · ' + i.departamento);
      fecharModal();
      showToast('Desmarcado.');
    }
    else if (tipo === 'elogiar'){
      const vol = state.voluntarios.find(v => v.id === fd.get('voluntarioUid'));
      const t = TIPOS_ELOGIO.find(x => x.tipo === fd.get('tipo'));
      const id = await colAdicionar('elogios', {
        voluntarioUid: vol.id, voluntarioNome: vol.nome, tipo: t.tipo, pontos: t.pontos, emoji: t.emoji,
        mensagem: (fd.get('mensagem')||'').trim(), deQuemUid: state.usuario.id, deQuemNome: state.usuario.nome,
        criadoEm: new Date().toISOString(),
      });
      state.elogios.push({ id, voluntarioUid: vol.id, voluntarioNome: vol.nome, tipo:t.tipo, pontos:t.pontos, emoji:t.emoji, mensagem: fd.get('mensagem'), deQuemUid: state.usuario.id, deQuemNome: state.usuario.nome });
      await recalcularStatsVoluntario(vol.id);
      showToast('💛 Elogio enviado pra ' + vol.nome + '!');
      form.reset();
    }
    else if (tipo === 'novo-depto'){
      const nome = fd.get('nome').trim();
      if (nome && !state.config.departamentos.includes(nome)){
        state.config.departamentos.push(nome);
        await salvarConfig(state.config);
      }
      form.reset(); render();
    }
    else if (tipo === 'novo-evento-recorrente'){
      const ev = { id: genId(), nome: fd.get('nome').trim(), dia: fd.get('dia'), horario: fd.get('horario'), horarioFim: fd.get('horarioFim')||'' };
      state.config.eventos.push(ev);
      await salvarConfig(state.config);
      form.reset(); render();
    }
    else if (tipo === 'novo-evento-avulso'){
      const obj = { nome: fd.get('nome').trim(), data: fd.get('data'), horario: fd.get('horario'), horarioFim: fd.get('horarioFim')||'', excluido:false };
      const id = await colAdicionar('eventosEsporadicos', obj);
      state.eventosEsporadicos.push({ id, ...obj });
      form.reset(); render();
    }
    else if (tipo === 'config-igreja'){
      const patch = { nomeIgreja: fd.get('nomeIgreja').trim(), lema: fd.get('lema').trim() };
      Object.assign(state.config, patch);
      await salvarConfig(state.config);
      showToast('Configurações salvas.');
      render();
    }
  }catch(err){
    console.error(err);
    showToast('Ops: ' + (err.message || 'algo deu errado.'));
  }finally{
    state.carregando = false;
    render();
  }
}

/* ============ 21) LEITOR DE QR (câmera + jsQR) ============ */
async function iniciarLeitorQr(escalaId){
  const video = document.getElementById('qr-leitor-video');
  const canvas = document.getElementById('qr-leitor-canvas');
  if (!video || !canvas) return;
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    state.qrStream = stream;
    video.srcObject = stream;
    await video.play();
    const ctx = canvas.getContext('2d');
    const tick = () => {
      if (!state.qrStream) return;
      if (video.readyState === video.HAVE_ENOUGH_DATA){
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const codigo = jsQR(img.data, img.width, img.height);
        if (codigo){
          try{
            const payload = JSON.parse(codigo.data);
            if (payload.app === 'videira-serve-checkin' && payload.data === hojeISO()){
              pararLeitorQr();
              concluirCheckin(escalaId, 'qr');
              return;
            } else {
              const status = document.getElementById('qr-leitor-status');
              if (status) status.textContent = 'QR não corresponde a hoje — tente de novo.';
            }
          }catch(e){ /* não era um QR do Videira Serve, ignora e segue lendo */ }
        }
      }
      state.qrLoopId = requestAnimationFrame(tick);
    };
    state.qrLoopId = requestAnimationFrame(tick);
  }catch(e){
    console.error('Erro ao abrir câmera', e);
    const status = document.getElementById('qr-leitor-status');
    if (status) status.textContent = 'Não deu pra abrir a câmera. Use a confirmação manual abaixo.';
  }
}
function pararLeitorQr(){
  if (state.qrLoopId) cancelAnimationFrame(state.qrLoopId);
  state.qrLoopId = null;
  if (state.qrStream){ state.qrStream.getTracks().forEach(t => t.stop()); state.qrStream = null; }
}

function gerarQrPortaria(){
  const alvo = document.getElementById('qr-exibicao');
  if (!alvo || typeof QRCode === 'undefined') return;
  alvo.innerHTML = '';
  const payload = JSON.stringify({ app:'videira-serve-checkin', data: hojeISO() });
  new QRCode(alvo, { text: payload, width: 220, height: 220, colorDark:'#143F35', colorLight:'#ffffff' });
}

function aposRenderEfeitos(){
  if (state.modal && state.modal.tipo === 'scanner-qr'){ iniciarLeitorQr(state.modal.escalaId); }
  else { pararLeitorQr(); }
  if (state.modal && state.modal.tipo === 'qr-portaria'){ gerarQrPortaria(); }
}

/* ============ 22) EXPORTAR (Excel / PDF) ============ */
function linhasExportacao(){
  const campoMes = document.getElementById('mes-exportar');
  const idMes = (campoMes && campoMes.value) || state.mesEscala || hojeISO().slice(0,7);
  return gerarDatasDoMes(idMes).map(ev => {
    const gente = state.escalas.filter(i => !i.excluida && i.status==='confirmado' && i.eventoTipo===ev.tipo && i.eventoId===ev.eventoId && i.data===ev.data);
    return gente.length ? gente.map(g => ({ Data: ev.data, Evento: ev.eventoNome, Horário: ev.horario||'', Departamento: g.departamento, Voluntário: g.voluntarioNome, 'Check-in': g.checkin ? g.checkin.horario : '' }))
      : [{ Data: ev.data, Evento: ev.eventoNome, Horário: ev.horario||'', Departamento: '—', Voluntário: '(vazio)', 'Check-in':'' }];
  }).flat();
}
function exportarEscalaXlsx(){
  const linhas = linhasExportacao();
  const ws = XLSX.utils.json_to_sheet(linhas);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Escala');
  XLSX.writeFile(wb, 'videira-serve-escala-' + (state.mesEscala||hojeISO().slice(0,7)) + '.xlsx');
}
function exportarEscalaPdf(){
  const linhas = linhasExportacao();
  const doc = new jspdf.jsPDF();
  doc.setFontSize(14);
  doc.text('Videira Serve · Escala de voluntários', 14, 16);
  doc.autoTable({
    startY: 22,
    head: [['Data','Evento','Horário','Departamento','Voluntário']],
    body: linhas.map(l => [l.Data, l.Evento, l['Horário'], l.Departamento, l['Voluntário']]),
    styles: { fontSize: 8 },
  });
  doc.save('videira-serve-escala-' + (state.mesEscala||hojeISO().slice(0,7)) + '.pdf');
}

/* ============ 23) BOOTSTRAP ============ */
async function entrarComUid(uid){
  const perfil = await carregarPerfilVoluntario(uid);
  if (!perfil){
    showToast('Não encontramos seu cadastro. Fale com a liderança.');
    state.carregando = false; render();
    return;
  }
  state.usuario = perfil;
  await garantirConfigInicial();
  await carregarTudo();
  state.carregando = false;
  state.aba = 'painel';
  render();
  registrarAuditoria('login', 'Entrou no Videira Serve');
}

function iniciarApp(){
  const app = document.getElementById('app');
  app.addEventListener('click', handleClick);
  app.addEventListener('submit', handleSubmit);
  app.addEventListener('change', handleChange);
  app.addEventListener('input', handleInput);

  if (FIREBASE_CONFIGURADO && auth){
    auth.onAuthStateChanged(async (user) => {
      if (user){ await entrarComUid(user.uid); }
      else { state.carregando = false; state.usuario = null; render(); }
    });
  } else {
    const uidSalvo = demoSessaoLer();
    if (uidSalvo){ entrarComUid(uidSalvo); }
    else { state.carregando = false; render(); }
  }
}

document.addEventListener('DOMContentLoaded', iniciarApp);
