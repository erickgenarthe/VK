<style>
  :root{
    /* Paleta do símbolo de verdade do GC (a plaquinha rosa "GC das
       Despertas" · 1 Pedro 1:13-16): rosa profundo, quase vinho no escuro,
       e um rosa clarinho quase branco nos detalhes. */
    --roxo: #B8677E;
    --roxo-escuro: #6E3245;
    --roxo-suave: #F5E2E7;
    --rosa: #E7AAB9;
    --rosa-suave: #FCEFF2;
    --dourado: #F4B740;
    --dourado-suave: #FDF1D6;
    --creme: #FBF7F1;
    --grafite: #1B2430;
    --grafite-suave: #6B6459;
    --branco: #FFFFFF;
    --vermelho: #D64545;
    --radius: 20px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Nunito', sans-serif;
    background: var(--creme);
    color: var(--grafite);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Baloo 2', sans-serif;
    margin:0;
    color: var(--roxo-escuro);
  }
  a{ color: var(--roxo); }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background: var(--creme);
    position:relative;
    padding-bottom:86px;
  }
  #app.sem-nav{ padding-bottom:24px; }

  @media (min-width: 860px){
    body{
      background: linear-gradient(160deg, #FFF3E4 0%, var(--creme) 45%, #F1ECFB 100%);
      padding: 32px 16px;
    }
    #app{
      min-height: auto;
      border-radius: 28px;
      box-shadow: 0 24px 60px rgba(27,36,48,0.14);
      overflow: hidden;
    }
  }

  /* ---------- Topbar ---------- */
  .topbar{
    background:
      radial-gradient(140% 100% at 100% 0%, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0) 55%),
      linear-gradient(135deg, var(--roxo-escuro) 0%, var(--roxo) 50%, var(--rosa) 140%);
    padding:26px 22px 32px 22px;
    position:relative;
    overflow:hidden;
    color:var(--branco);
    box-shadow: 0 6px 20px rgba(110,50,69,0.28);
  }
  .topbar-brilhos{ position:absolute; inset:0; pointer-events:none; opacity:0.55; }
  .topbar-linha1{ display:flex; align-items:center; justify-content:space-between; gap:10px; position:relative; z-index:1; }
  .marca{ display:flex; align-items:center; gap:12px; }
  .marca-selo{
    width:52px; height:52px; border-radius:16px; background:var(--branco);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 6px 16px rgba(0,0,0,0.22), 0 0 0 3px rgba(255,255,255,0.25);
    flex-shrink:0;
  }
  .marca-nome{
    font-family:'Yellowtail', cursive; font-weight:400; font-size:34px; line-height:1;
    letter-spacing:0.3px; text-shadow: 0 2px 10px rgba(0,0,0,0.22);
  }
  .marca-sub{ font-size:12px; font-weight:700; letter-spacing:0.4px; opacity:0.92; margin-top:2px; }
  .topbar-acoes{ display:flex; gap:8px; align-items:center; position:relative; z-index:1; }
  .icon-btn{
    width:36px; height:36px; border-radius:50%; border:none; background:rgba(255,255,255,0.18);
    color:var(--branco); font-size:16px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .icon-btn:active{ background:rgba(255,255,255,0.32); }
  .topbar-titulo{
    margin-top:20px; font-size:29px; font-weight:800; position:relative; z-index:1;
    text-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }

  /* ---------- Componentes básicos ---------- */
  .conteudo{ padding:18px 18px 8px 18px; }
  .cartao{
    background:var(--branco); border-radius:var(--radius); padding:16px;
    box-shadow:0 2px 10px rgba(27,36,48,0.06); margin-bottom:14px;
  }
  .cartao-titulo{ font-family:'Baloo 2', sans-serif; font-weight:700; font-size:16px; color:var(--roxo-escuro); margin-bottom:8px; }
  .hint{ font-size:12.5px; color:var(--grafite-suave); line-height:1.5; }
  .linha{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .col{ display:flex; flex-direction:column; gap:10px; }
  .row{ display:flex; gap:8px; flex-wrap:wrap; }

  label{ font-size:12.5px; font-weight:700; color:var(--roxo-escuro); display:block; margin-bottom:4px; }
  input, select, textarea{
    width:100%; padding:11px 13px; border-radius:14px; border:1.5px solid #E7E0D4;
    font-family:inherit; font-size:14.5px; background:var(--branco); color:var(--grafite);
  }
  input:focus, select:focus, textarea:focus{ outline:none; border-color: var(--roxo); }
  .campo{ margin-bottom:12px; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:12px 18px; border-radius:16px; border:none; font-family:'Nunito', sans-serif;
    font-weight:800; font-size:14.5px; cursor:pointer; text-align:center;
  }
  .btn-block{ width:100%; }
  .btn-primary{ background: var(--roxo); color:var(--branco); }
  .btn-primary:active{ background: var(--roxo-escuro); }
  .btn-secondary{ background: var(--roxo-suave); color: var(--roxo-escuro); }
  .btn-ghost{ background: #F1ECE0; color: var(--grafite); }
  .btn-danger{ background: #FBE4E4; color: var(--vermelho); }
  .btn-small{ padding:8px 12px; font-size:12.5px; border-radius:12px; }
  .btn[disabled]{ opacity:0.5; pointer-events:none; }

  .badge{ display:inline-flex; align-items:center; gap:4px; padding:4px 10px; border-radius:100px; font-size:11.5px; font-weight:800; background:#F1ECE0; color:var(--grafite-suave); }
  .badge-tema{ background: var(--roxo-suave); color: var(--roxo-escuro); }
  .badge-lider{ background: var(--dourado-suave); color:#8C6300; }
  .badge-membro{ background:#F1ECE0; color:var(--grafite-suave); }

  .lista-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 0; border-bottom:1px solid #F1ECE0;
  }
  .lista-item:last-child{ border-bottom:none; }

  .comentario-item{ display:flex; gap:10px; padding:12px 0; border-bottom:1px solid #F1ECE0; }
  .comentario-item:last-child{ border-bottom:none; }
  .comentario-avatar{
    width:34px; height:34px; border-radius:50%; flex-shrink:0;
    background: var(--roxo-suave); color: var(--roxo-escuro);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12.5px;
  }
  .comentario-corpo{ flex:1; min-width:0; }
  .comentario-cabecalho{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .comentario-nome{ font-weight:800; font-size:13.5px; color:var(--roxo-escuro); }
  .comentario-tempo{ font-size:11px; color:var(--grafite-suave); white-space:nowrap; flex-shrink:0; }
  .comentario-texto{ margin:3px 0 0 0; font-size:14px; line-height:1.5; }

  .conquista-linha{ display:flex; align-items:center; gap:12px; padding:10px 2px; border-bottom:1px solid #F1ECE0; }
  .conquista-linha:last-child{ border-bottom:none; }
  .conquista-emoji{
    width:42px; height:42px; border-radius:50%; background:#F1ECE0; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:19px;
  }
  .conquista-linha.desbloqueada .conquista-emoji{ background: var(--dourado-suave); }
  .conquista-texto{ flex:1; min-width:0; }
  .conquista-texto strong{ display:block; font-size:13.5px; color:var(--roxo-escuro); }
  .conquista-linha.bloqueada .conquista-texto strong{ color:var(--grafite-suave); }
  .conquista-texto .hint{ margin:0; }
  .conquista-progresso{
    font-size:11px; font-weight:800; color:var(--grafite-suave); background:#F1ECE0;
    padding:3px 9px; border-radius:100px; flex-shrink:0; white-space:nowrap;
  }
  .conquista-check{ font-size:18px; flex-shrink:0; }

  .toast{
    position:fixed; left:50%; bottom:96px; transform:translateX(-50%); z-index:200;
    background: var(--grafite); color:var(--branco); padding:12px 18px; border-radius:14px;
    font-size:13.5px; font-weight:700; box-shadow:0 10px 24px rgba(0,0,0,0.25); max-width:88%; text-align:center;
  }

  /* ---------- Navegação inferior ---------- */
  .nav-inferior{
    position:fixed; left:0; right:0; bottom:0; max-width:480px; margin:0 auto;
    background:var(--branco); border-top:1px solid #F1ECE0; display:flex;
    box-shadow:0 -4px 14px rgba(27,36,48,0.08); z-index:80;
  }
  @media (min-width:860px){ .nav-inferior{ max-width:760px; border-radius:0 0 24px 24px; } }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:9px 4px 8px 4px; border:none; background:none; cursor:pointer; color:var(--grafite-suave);
    font-family:inherit; font-size:10.5px; font-weight:800;
  }
  .nav-item:active{ transform: scale(0.9); }
  .nav-item .nav-icone-bolha{
    width:38px; height:25px; border-radius:13px; display:flex; align-items:center; justify-content:center;
    transition: background-color .2s ease;
  }
  .nav-item.ativo .nav-icone-bolha{ background: var(--roxo-suave); }
  .nav-item .nav-icone{ font-size:17px; }
  .nav-item.ativo{ color: var(--roxo); }

  /* ---------- Telas de autenticação ---------- */
  .tela-auth{ padding:36px 26px 26px 26px; }
  .tela-auth .marca-central{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px; margin-bottom:28px; }
  .tela-auth .marca-selo-grande{ width:72px; height:72px; border-radius:22px; box-shadow:0 8px 20px rgba(27,36,48,0.14); }
  .gc-pretitulo{ font-family:'Dancing Script', cursive; font-weight:600; font-size:19px; color:var(--roxo); margin:2px 0 0 0; }
  .gc-titulo{ font-family:'Yellowtail', cursive; font-weight:400; font-size:54px; line-height:1; color:var(--roxo-escuro); margin:0; }
  .gc-versiculo{ font-size:11px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; color:var(--grafite-suave); margin:6px 0 0 0; }
  .lema{ font-family:'Baloo 2', sans-serif; font-weight:800; color:var(--roxo-escuro); font-size:14px; }

  /* ---------- Utilidades de estado vazio ---------- */
  .vazio{ text-align:center; padding:30px 10px; color:var(--grafite-suave); }
  .vazio .vazio-emoji{ font-size:34px; display:block; margin-bottom:8px; }

  /* ---------- Seletor de dias (Seg a Sex) ---------- */
  .seletor-dias{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-bottom:14px; }
  .dia-pill{
    position:relative; border:1.5px solid #E7E0D4; background:var(--branco); border-radius:14px;
    padding:8px 4px; display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer;
    font-family:inherit;
  }
  .dia-pill-nome{ font-size:10.5px; font-weight:800; color:var(--grafite-suave); }
  .dia-pill-data{ font-size:12px; font-weight:800; color:var(--grafite); }
  .dia-pill.ativo{ background: var(--roxo); border-color: var(--roxo); }
  .dia-pill.ativo .dia-pill-nome, .dia-pill.ativo .dia-pill-data{ color: var(--branco); }
  .dia-pill-check{
    position:absolute; top:-6px; right:-4px; background:var(--dourado); color:var(--roxo-escuro);
    border-radius:50%; width:16px; height:16px; font-size:10px; display:flex; align-items:center;
    justify-content:center; font-weight:800;
  }

  .versiculo-cartao{ background: linear-gradient(135deg, var(--roxo) 0%, var(--roxo-escuro) 100%); color:var(--branco); }
  .versiculo-texto{ font-family:'Baloo 2', sans-serif; font-size:17px; line-height:1.5; margin:0; }
  .versiculo-ref{ margin:10px 0 0 0; font-size:12.5px; font-weight:800; opacity:0.85; }
  .pergunta-cartao{ background: var(--rosa-suave); }
  .oracao-cartao{ background: var(--dourado-suave); }
  .estudo-titulo-cartao{ background: var(--roxo-suave); }

  .grupo-dots{ display:flex; gap:5px; margin-top:6px; }
  .dot{ width:10px; height:10px; border-radius:50%; background:#E7E0D4; display:inline-block; }
  .dot.ok{ background: var(--roxo); }

  ::-webkit-scrollbar{ width:0; height:0; }
</style>
</head>
<body>
<div id="app"><div class="vazio" style="padding-top:60px;">Carregando…</div></div>
<script>
/* =====================================================================
   DESPERTAS — devocional semanal do grupo de crescimento
   Arquivo único, sem build (mesmo espírito do SERVE/FORJA): abre e roda.
   O líder adiciona o estudo de domingo, uma função do Netlify chama a IA
   (Claude, API da Anthropic) pra escrever os 5 devocionais (segunda a
   sexta), o líder revisa e publica, e o grupo faz check-in e comenta em
   cada dia — no estilo do plano de leitura do app Bíblia (YouVersion).
   ===================================================================== */

/* ============ 1) FIREBASE (opcional — sem config, roda em modo local) ============
   Enquanto os campos abaixo continuarem com "COLE_AQUI...", o Despertas
   funciona em MODO DEMONSTRAÇÃO, salvando tudo no localStorage do próprio
   navegador — dá pra testar o app inteiro sem configurar nada. Assim que
   você colar as credenciais reais de um projeto Firebase (gratuito em
   firebase.google.com), o app troca sozinho pra usar o Firestore de
   verdade, e o grupo inteiro passa a ver os mesmos dados. Veja o README.md. */
const firebaseConfig = {
  apiKey: "AIzaSyCbRSUAFyXPHRqqfkwM_TrVoNrZOMWqOIs",
  authDomain: "devocional-das-dispersas.firebaseapp.com",
  projectId: "devocional-das-dispersas",
  storageBucket: "devocional-das-dispersas.firebasestorage.app",
  messagingSenderId: "636098780650",
  appId: "1:636098780650:web:4a0b35e866b96edd2d2693",
};
const FIREBASE_CONFIGURADO = firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith('COLE_AQUI');
let db = null;
let auth = null;
if (FIREBASE_CONFIGURADO){
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    auth = firebase.auth();
    console.log('Despertas: usando Firestore (Firebase) como banco de dados.');
  }catch(e){
    console.error('Erro ao iniciar o Firebase — verifique se o firebaseConfig está correto.', e);
  }
} else {
  console.log('Despertas: firebaseConfig ainda não preenchido — rodando em modo demonstração (localStorage).');
}

/* ============ 2) CONFIGURAÇÃO PADRÃO DO GRUPO ============ */
const CONFIG_PADRAO = {
  nomeGrupo: 'Meu Grupo de Crescimento',
  lema: 'Um devocional por dia, juntos.',
};

/* ============ 2b) PONTOS E TROFÉUS ============
   Tema "despertar/luz", ligado ao nome do grupo e a 1 Pedro 1:13-16. Cada
   troféu olha pra um campo do perfil (pontos, sequência ou total) e uma
   meta — quando bate, desbloqueia e fica registrado pra sempre. */
const PONTOS_CHECKIN = 5;
const PONTOS_COMENTARIO = 3;

function verificarNovasConquistas(membro){
  const antigas = new Set(membro.conquistas || []);
  const novas = CONQUISTAS.filter(c => !antigas.has(c.id) && (membro[c.campo]||0) >= c.meta);
  if (novas.length) membro.conquistas = [...antigas, ...novas.map(c => c.id)];
  return novas;
}
function toastConquistas(novas){
  showToast('🏆 Troféu' + (novas.length>1?'s':'') + ' desbloqueado' + (novas.length>1?'s':'') + ': ' + novas.map(c => c.emoji+' '+c.nome).join(', '));
}

/* ============ 3) DATAS ============ */
function hojeISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function isoDeDate(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function somarDiasIso(iso, n){
  const [a,m,d] = iso.split('-').map(Number);
  const dt = new Date(a, m-1, d);
  dt.setDate(dt.getDate() + n);
  return isoDeDate(dt);
}
/* Próximo dia útil (pula fim de semana) — usado pra saber se um check-in
   novo continua a sequência de alguém ou se ela quebrou. */
function proximoDiaUtil(iso){
  let d = somarDiasIso(iso, 1);
  const diaSemana = new Date(d + 'T00:00:00').getDay(); // 0=domingo ... 6=sábado
  if (diaSemana === 6) d = somarDiasIso(d, 2);
  else if (diaSemana === 0) d = somarDiasIso(d, 1);
  return d;
}
/* Segunda-feira da semana daquela data — no fim de semana, mostra a semana
   que acabou de passar (a última que teve devocional de seg a sex). */
function segundaDaSemana(iso){
  const [a,m,d] = iso.split('-').map(Number);
  const dt = new Date(a, m-1, d);
  const offset = (dt.getDay() + 6) % 7; // segunda=0 ... domingo=6
  dt.setDate(dt.getDate() - offset);
  return isoDeDate(dt);
}
function datasDaSemana(segundaIso){
  return [0,1,2,3,4].map(i => somarDiasIso(segundaIso, i));
}
function formatarDataCurta(iso){
  const [,m,d] = iso.split('-');
  return d + '/' + m;
}

/* ============ 4) CAMADA DE DADOS (Firestore de verdade, ou localStorage
   no modo demonstração — o resto do código nunca precisa saber qual dos
   dois está usando por baixo). ============ */
const LS_PREFIX = 'despertas:';
function genId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 9); }

function lsLista(nome){
  try{ return JSON.parse(localStorage.getItem(LS_PREFIX + nome) || '[]'); }catch(e){ return []; }
}
function lsSalvarLista(nome, lista){ localStorage.setItem(LS_PREFIX + nome, JSON.stringify(lista)); }
function lsUpsert(nome, item){
  const lista = lsLista(nome);
  const idx = lista.findIndex(x => x.id === item.id);
  if (idx >= 0) lista[idx] = item; else lista.push(item);
  lsSalvarLista(nome, lista);
}
function lsAtualizar(nome, id, patch){
  const lista = lsLista(nome);
  const idx = lista.findIndex(x => x.id === id);
  if (idx >= 0){ lista[idx] = { ...lista[idx], ...patch }; lsSalvarLista(nome, lista); }
}

async function colLista(nome){
  if (FIREBASE_CONFIGURADO && db){
    const snap = await db.collection(nome).get();
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }
  return lsLista(nome);
}
async function colListaFiltrada(nome, campo, valor){
  if (FIREBASE_CONFIGURADO && db){
    const snap = await db.collection(nome).where(campo, '==', valor).get();
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }
  return lsLista(nome).filter(x => x[campo] === valor);
}
async function colListaEmValores(nome, campo, valores){
  if (!valores.length) return [];
  if (FIREBASE_CONFIGURADO && db){
    const snap = await db.collection(nome).where(campo, 'in', valores).get();
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }
  return lsLista(nome).filter(x => valores.includes(x[campo]));
}
async function colGetDoc(nome, id){
  if (FIREBASE_CONFIGURADO && db){
    const doc = await db.collection(nome).doc(id).get();
    return doc.exists ? { id, ...doc.data() } : null;
  }
  return lsLista(nome).find(x => x.id === id) || null;
}
async function colAdicionar(nome, obj){
  const id = genId();
  if (FIREBASE_CONFIGURADO && db){
    await db.collection(nome).doc(id).set(obj);
  } else {
    lsUpsert(nome, { id, ...obj });
  }
  return id;
}
async function colDefinir(nome, id, obj){
  if (FIREBASE_CONFIGURADO && db){
    await db.collection(nome).doc(id).set(obj, { merge: true });
  } else {
    const atual = lsLista(nome).find(x => x.id === id) || {};
    lsUpsert(nome, { ...atual, ...obj, id });
  }
}
async function colAtualizar(nome, id, patch){
  if (FIREBASE_CONFIGURADO && db){
    await db.collection(nome).doc(id).update(patch);
  } else {
    lsAtualizar(nome, id, patch);
  }
}
async function colRemover(nome, id){
  if (FIREBASE_CONFIGURADO && db){
    await db.collection(nome).doc(id).delete();
  } else {
    lsSalvarLista(nome, lsLista(nome).filter(x => x.id !== id));
  }
}

async function lerConfig(){
  if (FIREBASE_CONFIGURADO && db){
    const doc = await db.collection('dados').doc('config').get();
    return doc.exists ? { ...CONFIG_PADRAO, ...doc.data() } : null;
  }
  try{
    const salvo = JSON.parse(localStorage.getItem(LS_PREFIX + 'config') || 'null');
    return salvo ? { ...CONFIG_PADRAO, ...salvo } : null;
  }catch(e){ return null; }
}
async function salvarConfig(cfg){
  state.config = cfg;
  if (FIREBASE_CONFIGURADO && db){
    await db.collection('dados').doc('config').set(cfg, { merge: true });
  } else {
    localStorage.setItem(LS_PREFIX + 'config', JSON.stringify(cfg));
  }
}
async function garantirConfigInicial(){
  let cfg = await lerConfig();
  if (!cfg){ cfg = { ...CONFIG_PADRAO }; await salvarConfig(cfg); }
  state.config = cfg;
}

/* ============ 5) AUTENTICAÇÃO ============
   Cadastro simples com e-mail/senha (firebase.auth() de verdade, quando
   configurado). Além da senha, toda conta nova precisa ser aprovada por um
   líder antes de acessar o grupo — ver "status" no perfil. Sem Firebase, o
   "modo demonstração" guarda as contas no localStorage. */
function demoContas(){ return lsLista('contas'); }
function demoCriarConta(email, senha){
  const contas = demoContas();
  if (contas.some(c => c.email.toLowerCase() === email.toLowerCase())) throw new Error('Já existe uma conta com esse e-mail.');
  const uid = 'demo-' + genId();
  contas.push({ id: uid, email, senha });
  lsSalvarLista('contas', contas);
  return uid;
}
function demoLogin(email, senha){
  const conta = demoContas().find(c => c.email.toLowerCase() === email.toLowerCase());
  if (!conta || conta.senha !== senha) throw new Error('E-mail ou senha incorretos.');
  return conta.id;
}
function demoSessaoSalvar(uid){ localStorage.setItem(LS_PREFIX + 'sessao', uid); }
function demoSessaoLer(){ return localStorage.getItem(LS_PREFIX + 'sessao'); }
function demoSessaoLimpar(){ localStorage.removeItem(LS_PREFIX + 'sessao'); }

async function carregarPerfilMembro(uid){ return colGetDoc('membros', uid); }

async function criarPerfilMembro(uid, dados){
  const { nome, email } = dados;
  const todos = await colLista('membros');
  const ehPrimeiro = todos.length === 0; // primeira pessoa a se cadastrar vira líder automaticamente, já aprovada
  const perfil = {
    nome, email,
    role: ehPrimeiro ? 'lider' : 'membro',
    status: ehPrimeiro ? 'aprovado' : 'pendente', // toda conta nova precisa de aprovação da liderança
    pontos: 0, totalCheckins: 0, totalComentarios: 0, sequenciaAtual: 0, ultimoCheckinData: null, conquistas: [],
    criadoEm: new Date().toISOString(),
  };
  await colDefinir('membros', uid, perfil);
  return { id: uid, ...perfil };
}
async function fazerLogin(email, senha){
  if (FIREBASE_CONFIGURADO && auth){
    const cred = await auth.signInWithEmailAndPassword(email, senha);
    return cred.user.uid;
  }
  return demoLogin(email, senha);
}
async function fazerCadastro(dados){
  const { email, senha } = dados;
  let uid;
  if (FIREBASE_CONFIGURADO && auth){
    const cred = await auth.createUserWithEmailAndPassword(email, senha);
    uid = cred.user.uid;
  } else {
    uid = demoCriarConta(email, senha);
  }
  await criarPerfilMembro(uid, dados);
  if (!FIREBASE_CONFIGURADO) demoSessaoSalvar(uid);
  return uid;
}
async function fazerLogout(){
  if (FIREBASE_CONFIGURADO && auth){ await auth.signOut(); }
  else { demoSessaoLimpar(); }
  state.usuario = null;
  state.aba = 'hoje';
  render();
}
async function verificarAprovacao(){
  try{
    const perfil = await carregarPerfilMembro(state.usuario.id);
    if (perfil && perfil.status !== 'pendente'){
      state.usuario = perfil;
      state.membros = await colLista('membros');
      await irParaHoje();
    } else {
      showToast('Ainda não — a liderança precisa aprovar sua entrada primeiro.');
    }
  }catch(err){
    showToast('Ops: ' + mensagemErro(err));
  }
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showToast(msg){
  state.toast = msg;
  render();
  clearTimeout(state._toastTimer);
  state._toastTimer = setTimeout(() => { state.toast = null; render(); }, 2800);
}
function mensagemErro(err, padrao){
  const codigo = err && err.code ? '[' + err.code + '] ' : '';
  return codigo + (err && err.message ? err.message : (padrao || 'algo deu errado.'));
}
function paragrafos(texto){
  const partes = (texto || '').split(/\n+/).map(p => p.trim()).filter(Boolean);
  if (!partes.length) return '<p class="hint">—</p>';
  return partes.map(p => `<p style="margin:0 0 10px 0; line-height:1.6;">${esc(p)}</p>`).join('');
}
function iniciaisNome(nome){
  const palavras = (nome || '').trim().split(/\s+/).filter(Boolean);
  if (!palavras.length) return '?';
  const primeira = palavras[0][0] || '';
  const ultima = palavras.length > 1 ? (palavras[palavras.length-1][0] || '') : '';
  return (primeira + ultima).toUpperCase();
}
function tempoRelativo(isoDataHora){
  if (!isoDataHora) return '';
  const diffMs = Date.now() - new Date(isoDataHora).getTime();
  const min = Math.floor(diffMs / 60000);
  if (min < 1) return 'agora';
  if (min < 60) return 'há ' + min + 'min';
  const h = Math.floor(min / 60);
  if (h < 24) return 'há ' + h + 'h';
  const d = Math.floor(h / 24);
  if (d < 7) return 'há ' + d + (d===1 ? ' dia' : ' dias');
  return new Date(isoDataHora).toLocaleDateString('pt-BR');
}

/* ============ 7) FLUXO "HOJE" (semana + dia selecionado) ============ */
async function irParaHoje(){
  state.aba = 'hoje';
  const hoje = hojeISO();
  const base = segundaDaSemana(hoje);
  state.semanaBase = base;
  state.semanaAtual = await colGetDoc('semanas', base);
  state.datasSemana = datasDaSemana(base);

  if (state.semanaAtual){
    const checkinsSemana = await colListaEmValores('checkins', 'data', state.datasSemana);
    state.meusCheckinsSemana = new Set(checkinsSemana.filter(c => c.uid === state.usuario.id).map(c => c.data));
    const alvo = state.datasSemana.includes(hoje) ? hoje : state.datasSemana[4];
    await selecionarDia(alvo);
  } else {
    state.diaSelecionado = null;
    state.checkinsDoDia = [];
    state.comentariosDoDia = [];
    render();
  }
}
async function selecionarDia(iso){
  state.diaSelecionado = iso;
  const [checkins, comentarios] = await Promise.all([
    colListaFiltrada('checkins', 'data', iso),
    colListaFiltrada('comentarios', 'data', iso),
  ]);
  state.checkinsDoDia = checkins;
  state.comentariosDoDia = comentarios.slice().sort((a,b) => (a.criadoEm||'').localeCompare(b.criadoEm||''));
  render();
}
async function toggleCheckin(){
  const iso = state.diaSelecionado;
  if (!iso || !state.usuario) return;
  const uid = state.usuario.id;
  const id = iso + '_' + uid;
  const m = state.usuario;
  const jaFez = state.checkinsDoDia.some(c => c.uid === uid);
  if (jaFez){
    await colRemover('checkins', id);
    state.checkinsDoDia = state.checkinsDoDia.filter(c => c.uid !== uid);
    state.meusCheckinsSemana.delete(iso);
    const patch = { pontos: Math.max(0, (m.pontos||0) - PONTOS_CHECKIN), totalCheckins: Math.max(0, (m.totalCheckins||0) - 1) };
    Object.assign(m, patch);
    await colAtualizar('membros', uid, patch);
    showToast('Check-in desfeito.');
  } else {
    const criadoEm = new Date().toISOString();
    await colDefinir('checkins', id, { data: iso, uid, nome: state.usuario.nome, criadoEm });
    state.checkinsDoDia.push({ id, data: iso, uid, nome: state.usuario.nome, criadoEm });
    state.meusCheckinsSemana.add(iso);
    const novaSequencia = (m.ultimoCheckinData && proximoDiaUtil(m.ultimoCheckinData) === iso) ? (m.sequenciaAtual||0) + 1 : 1;
    const patch = { pontos: (m.pontos||0) + PONTOS_CHECKIN, totalCheckins: (m.totalCheckins||0) + 1, sequenciaAtual: novaSequencia, ultimoCheckinData: iso };
    Object.assign(m, patch);
    await colAtualizar('membros', uid, patch);
    const novas = verificarNovasConquistas(m);
    if (novas.length){
      await colAtualizar('membros', uid, { conquistas: m.conquistas });
      toastConquistas(novas);
    } else {
      showToast('✅ +' + PONTOS_CHECKIN + ' pontos! Sequência: 🔥 ' + novaSequencia + (novaSequencia===1?' dia':' dias') + '.');
    }
  }
  render();
}

function proximaSegundaLivre(lista){
  const ids = new Set(lista.map(s => s.id));
  let base = segundaDaSemana(hojeISO());
  while (ids.has(base)) base = somarDiasIso(base, 7);
  return base;
}

/* ---------- Alternativa sem custo: gera um prompt pra copiar numa IA de
   graça (claude.ai, chatgpt.com...) e colar a resposta de volta aqui. */
const ESQUELETO_DIA_PROMPT = { titulo:'', referencia:'', versiculo:'', texto:'', pergunta:'', oracao:'' };
function montarPromptCopiavel(ef){
  const linhas = [
    'Você vai escrever 5 devocionais diários (segunda a sexta) para um pequeno grupo de crescimento de igreja, no estilo do plano de leitura do app Bíblia (YouVersion): linguagem acolhedora, direta e prática, sem jargão teológico complicado.',
    '',
    'Tema da semana: "' + (ef.titulo || '') + '"',
    '',
  ];
  if (ef.texto && ef.texto.trim()){
    linhas.push('Conteúdo/anotações do estudo:', ef.texto.trim(), '');
  } else {
    linhas.push('O conteúdo do estudo está no PDF que vou anexar nesta mesma conversa, logo em seguida a este prompt — leia com atenção antes de responder.', '');
  }
  linhas.push(
    'Cada um dos 5 devocionais deve aprofundar o mesmo tema com um ângulo diferente, progredindo em profundidade ao longo da semana, e terminar com uma pergunta pra compartilhar no grupo e uma oração curta. Escreva em português do Brasil, em segunda pessoa, de forma acolhedora e nunca condescendente. Cite os versículos com o melhor da sua memória (eu reviso antes de publicar).',
    '',
    'Responda SOMENTE com um bloco de código JSON (nada de texto antes ou depois), exatamente neste formato, com os 5 dias na ordem de segunda a sexta:',
    '',
    '```json',
    JSON.stringify({ dias: [ESQUELETO_DIA_PROMPT] }, null, 2),
    '```',
    '(repita o objeto dentro de "dias" até ter exatamente 5 itens, um por dia)',
  );
  return linhas.join('\n');
}
function extrairDiasDeRespostaIA(texto){
  let bruto = (texto || '').trim();
  if (!bruto) throw new Error('cole a resposta da IA primeiro');
  const bloco = bruto.match(/```json\s*([\s\S]*?)```/i) || bruto.match(/```\s*([\s\S]*?)```/);
  if (bloco) bruto = bloco[1].trim();
  else {
    const ini = bruto.indexOf('{'), fim = bruto.lastIndexOf('}');
    if (ini >= 0 && fim > ini) bruto = bruto.slice(ini, fim + 1);
  }
  let obj;
  try{ obj = JSON.parse(bruto); }
  catch(e){ throw new Error('não consegui ler esse JSON — confira se copiou a resposta inteira, sem cortar nada'); }
  const dias = obj && obj.dias;
  if (!Array.isArray(dias) || dias.length !== 5) throw new Error('preciso de exatamente 5 dias dentro de "dias" no JSON');
  return dias.map(d => ({
    titulo: String(d.titulo||''), referencia: String(d.referencia||''), versiculo: String(d.versiculo||''),
    texto: String(d.texto||''), pergunta: String(d.pergunta||''), oracao: String(d.oracao||''),
  }));
}

  if (ef.dias.some(dd => !dd.titulo.trim() || !dd.texto.trim())){ showToast('Preencha pelo menos o título e o texto de cada dia.'); return; }
  const datas = datasDaSemana(ef.segunda);
  const obj = {
    titulo: ef.titulo.trim(),
    temaTexto: ef.texto.trim(),
    criadoPorUid: state.usuario.id,
    criadoPorNome: state.usuario.nome,
    atualizadoEm: new Date().toISOString(),
    dias: ef.dias.map((dd, i) => ({ ...dd, data: datas[i] })),
  };
  await colDefinir('semanas', ef.segunda, obj);
  showToast('📅 Semana publicada!');
  const voltar = state.subTelaVoltarPara || 'estudos';
  state.estudoForm = null;
  if (voltar === 'hoje') await irParaHoje(); else await abrirEstudos();
}

/* ============ 10) RENDER ============ */
const SUBTELAS = new Set(['estudos', 'estudo-form', 'config-grupo']);
function ehSubTela(){ return SUBTELAS.has(state.aba); }
function tituloDaAba(){
  const titulos = {
    hoje: 'Hoje', grupo: 'Grupo', mais: 'Mais',
    estudos: 'Estudos da semana',
    'estudo-form': (state.estudoForm && state.estudoForm.titulo) ? 'Editar semana' : 'Novo estudo',
    'config-grupo': 'Configurações do grupo',
  };
  return titulos[state.aba] || '';
}

function render(){
  const app = document.getElementById('app');
  if (state.carregando){
    app.className = 'sem-nav';
    app.innerHTML = telaCarregando();
  } else if (state.completar){
    app.className = 'sem-nav';
    app.innerHTML = telaCompletarCadastro();
  } else if (!state.usuario){
    app.className = 'sem-nav';
    app.innerHTML = state.telaAuth === 'cadastro' ? telaCadastro() : telaLogin();
  } else if (state.usuario.status === 'pendente'){
    app.className = 'sem-nav';
    app.innerHTML = telaPendente();
  } else {
    app.className = '';
    app.innerHTML = telaShell();
  }
  if (state.toast) app.insertAdjacentHTML('beforeend', `<div class="toast">${esc(state.toast)}</div>`);
}

    <g stroke="#F6E3E8" stroke-width="4.5" fill="none" stroke-linecap="round">

    </g>
    <g fill="#F6E3E8">
      <circle cx="94" cy="80" r="7.5"/><circle cx="107" cy="78" r="7.5"/><circle cx="100.5" cy="69" r="7.5"/>
      <circle cx="89" cy="70" r="6"/><circle cx="112" cy="71" r="6"/>
    </g>
    <g fill="#FBF7F1">
      <path d="M58 58 l3.2 8.8 8.8 3.2 -8.8 3.2 -3.2 8.8 -3.2 -8.8 -8.8 -3.2 8.8 -3.2 z"/>
      <path d="M138 128 l2.6 6.4 6.4 2.6 -6.4 2.6 -2.6 6.4 -2.6 -6.4 -6.4 -2.6 6.4 -2.6 z"/>
      <path d="M132 62 l1.8 4.6 4.6 1.8 -4.6 1.8 -1.8 4.6 -1.8 -4.6 -4.6 -1.8 4.6 -1.8 z"/>
    </g>
  </svg>`;
}

/* Brilhinhos espalhados no fundo do topbar — mesmo motivo da capa do
   WhatsApp, só que posicionados em % pra funcionar em qualquer tamanho de
   topbar (varia com o conteúdo da aba e com a tela desktop/mobile). */
function brilhoSvg(tamanho){
  return `<svg width="${tamanho}" height="${tamanho}" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 1 L11.6 8.4 19 10 11.6 11.6 10 19 8.4 11.6 1 10 8.4 8.4 Z" fill="#FBF7F1"/></svg>`;
}
function topbarBrilhos(){
  const pontos = [
    { pos:'top:10%; left:6%;', tam:15, op:0.55 },
    { pos:'top:16%; right:9%;', tam:10, op:0.45 },
    { pos:'bottom:16%; right:22%;', tam:17, op:0.4 },
    { pos:'bottom:20%; left:16%;', tam:9, op:0.4 },
    { pos:'top:52%; right:3%;', tam:12, op:0.35 },
  ];
  return `<div class="topbar-brilhos">${pontos.map(p => `<span style="position:absolute; ${p.pos} opacity:${p.op};">${brilhoSvg(p.tam)}</span>`).join('')}</div>`;
}

function telaShell(){
  const subTela = ehSubTela();
  return `<div class="topbar">
      ${topbarBrilhos()}
      <div class="topbar-linha1">
        ${subTela ? `
          <button class="icon-btn" data-action="voltar" data-destino="${esc(state.subTelaVoltarPara||'mais')}" title="Voltar">←</button>
          <div class="marca-nome" style="font-size:20px;">${esc(tituloDaAba())}</div>
          <div class="topbar-acoes"><button class="icon-btn" data-action="sair" title="Sair">⎋</button></div>
        ` : `
          <div class="marca">
            <div class="marca-selo">${marcaFlor(34)}</div>
            <div><div class="marca-nome">Despertas</div><div class="marca-sub">${esc((state.config&&state.config.nomeGrupo)||'')}</div></div>
          </div>
          <div class="topbar-acoes"><button class="icon-btn" data-action="sair" title="Sair">⎋</button></div>
        `}
      </div>
      ${!subTela ? `<div class="topbar-titulo">${esc(tituloDaAba())}</div>` : ''}
    </div>
    <div class="conteudo">${telaConteudo()}</div>
    ${navInferior()}`;
}

function navInferior(){
  const itens = [
    { id:'hoje', icone:'☀️', nome:'Hoje' },
    { id:'grupo', icone:'👥', nome:'Grupo' },
    { id:'conquistas', icone:'🏆', nome:'Troféus' },
    { id:'mais', icone:'☰', nome:'Mais' },
  ];
  return `<div class="nav-inferior">${itens.map(it => `<button class="nav-item ${state.aba===it.id?'ativo':''}" data-action="ir-aba" data-aba="${it.id}"><span class="nav-icone-bolha"><span class="nav-icone">${it.icone}</span></span>${it.nome}</button>`).join('')}</div>`;
}

function telaConteudo(){
  switch(state.aba){
    case 'grupo': return telaGrupo();
    case 'conquistas': return telaConquistas();
    case 'mais': return telaMais();
    case 'estudos': return telaEstudos();
    case 'estudo-form': return telaEstudoForm();

    default: return telaHoje();

/* ---------- Tela: Hoje ---------- */
function telaHoje(){
  if (!state.semanaAtual){
    const podeAdicionar = state.usuario.role === 'lider';
    return `<div class="cartao" style="text-align:center; padding:30px 16px;">
      <span style="font-size:34px; display:block; margin-bottom:10px;">🌅</span>
      <h3 style="margin-bottom:6px;">Ainda não tem devocional essa semana</h3>
      <p class="hint">${podeAdicionar ? 'Adicione o estudo de domingo e o Despertas escreve os 5 devocionais pra você revisar e publicar.' : 'Peça pra liderança adicionar o estudo dessa semana — assim que publicar, os devocionais aparecem aqui.'}</p>
      ${podeAdicionar ? `<button type="button" class="btn btn-primary" style="margin-top:14px;" data-action="criar-estudo-semana" data-segunda="${state.semanaBase}">+ Adicionar estudo desta semana</button>` : ''}
    </div>`;
  }

  const NOMES = ['Seg','Ter','Qua','Qui','Sex'];
  const seletor = `<div class="seletor-dias">${state.datasSemana.map((iso, i) => `
    <button type="button" class="dia-pill ${state.diaSelecionado===iso?'ativo':''}" data-action="selecionar-dia" data-data="${iso}">
      <span class="dia-pill-nome">${NOMES[i]}</span>
      <span class="dia-pill-data">${formatarDataCurta(iso)}</span>
      ${state.meusCheckinsSemana.has(iso) ? '<span class="dia-pill-check">✓</span>' : ''}
    </button>`).join('')}</div>`;

  const diaAtual = state.semanaAtual.dias.find(d => d.data === state.diaSelecionado) || state.semanaAtual.dias[0];
  const jaFezHoje = state.checkinsDoDia.some(c => c.uid === state.usuario.id);
  const outros = state.checkinsDoDia.filter(c => c.uid !== state.usuario.id);

  return seletor + `
    <div class="cartao estudo-titulo-cartao">
      <span class="badge badge-tema">${esc(state.semanaAtual.titulo)}</span>
      <h2 style="margin-top:10px; font-size:20px;">${esc(diaAtual.titulo||'')}</h2>
    </div>
    <div class="cartao versiculo-cartao">
      <p class="versiculo-texto">“${esc(diaAtual.versiculo||'')}”</p>
      <p class="versiculo-ref">${esc(diaAtual.referencia||'')}</p>
    </div>
    <div class="cartao">${paragrafos(diaAtual.texto)}</div>
    ${diaAtual.pergunta ? `<div class="cartao pergunta-cartao"><strong>💬 Pra compartilhar no grupo</strong><p style="margin:6px 0 0 0;">${esc(diaAtual.pergunta)}</p></div>` : ''}
    ${diaAtual.oracao ? `<div class="cartao oracao-cartao"><strong>🙏 Oração</strong><p style="margin:6px 0 0 0; font-style:italic;">${esc(diaAtual.oracao)}</p></div>` : ''}
    <div class="cartao">
      <button type="button" class="btn ${jaFezHoje?'btn-secondary':'btn-primary'} btn-block" data-action="toggle-checkin">${jaFezHoje ? '✓ Você já fez check-in' : 'Marcar como concluído'}</button>
      ${outros.length ? `<p class="hint" style="margin-top:10px;">Também já fizeram: ${outros.map(c=>esc(c.nome)).join(', ')}</p>` : ''}
    </div>
    <div class="cartao">
      <div class="linha" style="margin-bottom:${state.comentariosDoDia.length ? '4' : '10'}px;">
        <div class="cartao-titulo" style="margin-bottom:0;">💬 Comentários</div>
        ${state.comentariosDoDia.length ? `<span class="badge badge-tema">${state.comentariosDoDia.length}</span>` : ''}
      </div>
      ${state.comentariosDoDia.length ? state.comentariosDoDia.map(c => `
        <div class="comentario-item">
          <div class="comentario-avatar">${esc(iniciaisNome(c.nome))}</div>
          <div class="comentario-corpo">
            <div class="comentario-cabecalho">
              <span class="comentario-nome">${esc(c.nome)}</span>
              <span class="comentario-tempo">${esc(tempoRelativo(c.criadoEm))}</span>

        <span class="vazio-emoji">🗣️</span>
        Comece o papo! Compartilhe o que esse dia falou com você e convide o grupo a comentar também — é aqui que a conversa da semana acontece.
      </div>`}
      <form data-form="comentario" style="margin-top:10px;">
        <textarea name="texto" rows="2" placeholder="Escreva o que esse devocional falou com você…" required></textarea>
        <button type="submit" class="btn btn-secondary btn-small" style="margin-top:8px;">Comentar</button>

/* ---------- Tela: Grupo ---------- */

  const linhas = state.grupoProgresso.map(g => `
    <div class="lista-item">
      <div>
        <strong>${esc(g.membro.nome)}</strong>

      </div>
      ${(state.usuario.role==='lider' && g.membro.id!==state.usuario.id) ? `
        <div class="col" style="align-items:flex-end; gap:4px;">
          <select data-action="mudar-role-membro" data-uid="${g.membro.id}" style="width:auto; padding:6px 10px; font-size:12px;">
            <option value="membro" ${g.membro.role==='membro'?'selected':''}>membro</option>
            <option value="lider" ${g.membro.role==='lider'?'selected':''}>líder</option>

/* ---------- Tela: Troféus ---------- */
function telaConquistas(){
  const u = state.usuario;
  const ranking = [...state.membros].sort((a,b) => (b.pontos||0) - (a.pontos||0));
  const minhaPos = ranking.findIndex(m => m.id === u.id) + 1;
  const medalhas = ['🥇','🥈','🥉'];

  const resumo = `<div class="cartao" style="background:linear-gradient(135deg, var(--roxo-escuro) 0%, var(--roxo) 100%); color:var(--branco); text-align:center;">
    <div style="font-size:36px;">🏆</div>
    <div style="font-size:34px; font-weight:800; line-height:1;">${u.pontos||0}</div>
    <div style="font-size:11.5px; font-weight:800; letter-spacing:1px; opacity:0.85;">PONTOS</div>
    <div class="row" style="justify-content:center; gap:26px; margin-top:16px;">
      <div><div style="font-size:19px; font-weight:800;">🔥 ${u.sequenciaAtual||0}</div><div class="hint" style="color:rgba(255,255,255,0.85);">sequência</div></div>
      <div><div style="font-size:19px; font-weight:800;">#${minhaPos||'-'}</div><div class="hint" style="color:rgba(255,255,255,0.85);">no grupo</div></div>
      <div><div style="font-size:19px; font-weight:800;">${(u.conquistas||[]).length}/${CONQUISTAS.length}</div><div class="hint" style="color:rgba(255,255,255,0.85);">troféus</div></div>
    </div>
  </div>`;

  const listaConquistas = CONQUISTAS.map(c => {
    const desbloqueada = (u.conquistas||[]).includes(c.id);
    const valorAtual = Math.min(u[c.campo]||0, c.meta);
    return `<div class="conquista-linha ${desbloqueada?'desbloqueada':'bloqueada'}">
      <div class="conquista-emoji">${c.emoji}</div>
      <div class="conquista-texto">
        <strong>${esc(c.nome)}</strong>
        <p class="hint">${esc(c.descricao)}</p>
      </div>
      ${desbloqueada ? '<span class="conquista-check">✅</span>' : `<span class="conquista-progresso">${valorAtual}/${c.meta}</span>`}
    </div>`;
  }).join('');

  const listaRanking = ranking.map((m,i) => `<div class="lista-item">
    <div><strong>${medalhas[i]||('#'+(i+1)+' ')} ${esc(m.nome)}</strong>${m.id===u.id ? ' <span class="hint">(você)</span>' : ''}</div>
    <span class="badge badge-tema">${m.pontos||0} pts</span>
  </div>`).join('');

  return resumo + `
    <div class="cartao">
      <div class="cartao-titulo">Troféus</div>
      ${listaConquistas}
    </div>
    <div class="cartao">
      <div class="cartao-titulo">🏅 Ranking do grupo</div>
      ${listaRanking || '<p class="hint">Ninguém no ranking ainda.</p>'}
    </div>`;
}

/* ---------- Tela: Mais ---------- */
function telaMais(){
  const u = state.usuario;
  return `<div class="cartao">
    <div class="cartao-titulo">Minha conta</div>
    <p style="margin:0;"><strong>${esc(u.nome)}</strong><br><span class="hint">${esc(u.email||'')} · ${u.role==='lider'?'líder do grupo':'membro do grupo'}</span></p>
  </div>
  ${u.role==='lider' ? `
  <div class="cartao">
    <div class="cartao-titulo">Liderança</div>
    <div class="col">
      <button type="button" class="btn btn-ghost btn-block" data-action="ir-estudos">📖 Estudos da semana</button>
      <button type="button" class="btn btn-ghost btn-block" data-action="ir-config-grupo">⚙️ Configurações do grupo</button>
    </div>
  </div>` : ''}
  <button type="button" class="btn btn-danger btn-block" data-action="sair">Sair da minha conta</button>
  ${!FIREBASE_CONFIGURADO ? `<div class="cartao" style="margin-top:14px; background:var(--dourado-suave);"><p class="hint" style="margin:0;">🧪 Modo demonstração — os dados ficam salvos só neste navegador.</p></div>` : ''}`;
}

/* ---------- Tela: Estudos (líder) ---------- */
function telaEstudos(){
  const lista = state.estudosLista || [];
  return `<button type="button" class="btn btn-primary btn-block" style="margin-bottom:14px;" data-action="novo-estudo">+ Nova semana</button>
  ${lista.length ? lista.map(s => `
    <div class="cartao">
      <div class="linha">
        <div>
          <strong>${esc(s.titulo||'(sem título)')}</strong><br>
          <span class="hint">${formatarDataCurta(s.id)} – ${formatarDataCurta(datasDaSemana(s.id)[4])}</span>
        </div>
        <button type="button" class="btn btn-secondary btn-small" data-action="editar-estudo" data-id="${esc(s.id)}">Editar</button>
      </div>
    </div>`).join('') : '<div class="vazio"><span class="vazio-emoji">📖</span>Nenhum estudo publicado ainda.</div>'}`;
}

/* ---------- Tela: Novo estudo / Editar estudo (líder) ---------- */
function telaEstudoForm(){
  const ef = state.estudoForm;
  if (!ef) return '<div class="vazio">Nada por aqui.</div>';
  const dias = ef.dias;
  return `<form data-form="estudo" onsubmit="return false">
    <div class="cartao">
      <div class="campo"><label>Semana (segunda-feira)</label><input type="date" value="${ef.segunda}" data-action="mudar-segunda-estudo"></div>
      <div class="campo"><label>Título do estudo</label><input type="text" name="titulo" value="${esc(ef.titulo)}" placeholder="Ex.: Confiança em tempos de espera"></div>
      <div class="campo"><label>Do que você ensinou / anotações do estudo</label><textarea name="texto" rows="6" placeholder="Cole aqui os principais pontos do que você ensinou — o Despertas usa isso pra escrever os 5 devocionais da semana.">${esc(ef.texto)}</textarea></div>
      ${!dias ? `<div class="row">
        <button type="button" class="btn btn-primary" style="flex:1;" data-action="mostrar-prompt-manual">💬 Gerar com IA (sem custo)</button>
        <button type="button" class="btn btn-ghost" style="flex:1;" data-action="escrever-manual">✍️ Escrever manualmente</button>
      </div>` : ''}
    </div>
    ${(!dias && ef.mostrarPromptManual) ? `
    <div class="cartao" style="background:var(--rosa-suave);">
      <div class="cartao-titulo">💬 Gerar numa IA gratuita</div>
      <p class="hint" style="margin-bottom:8px;">Copie o texto abaixo e cole numa IA de graça (ex.: <strong>claude.ai</strong> ou <strong>chatgpt.com</strong>).${!ef.texto.trim() ? ' Anexe também o PDF do estudo na mesma conversa, junto com o prompt.' : ''} Depois cole a resposta dela no campo logo abaixo.</p>
      <textarea id="prompt-ia-texto" rows="8" readonly style="font-size:12px; font-family:monospace;">${esc(montarPromptCopiavel(ef))}</textarea>
      <button type="button" class="btn btn-secondary btn-small" style="margin-top:8px;" data-action="copiar-prompt-ia">📋 Copiar prompt</button>
      <div class="campo" style="margin-top:14px;">
        <label>Cole aqui a resposta da IA</label>
        <textarea name="respostaIA" rows="6" placeholder="Cole a resposta (o bloco de JSON) que a IA te der aqui...">${esc(ef.respostaIA||'')}</textarea>
      </div>
      <button type="button" class="btn btn-primary btn-block" data-action="usar-resposta-ia">📥 Usar esse resultado</button>
    </div>` : ''}
    ${dias ? dias.map((dd,i) => diaFormCartao(dd,i)).join('') : ''}
    ${dias ? `<button type="button" class="btn btn-primary btn-block" data-action="publicar-estudo">📅 Publicar semana</button>
      <p class="hint" style="text-align:center; margin-top:8px;">Revise os versículos e o texto antes de publicar — a IA pode errar referências.</p>` : ''}
  </form>`;
}
function diaFormCartao(dd, i){
  const NOMES = ['Segunda','Terça','Quarta','Quinta','Sexta'];
  return `<div class="cartao">
    <div class="cartao-titulo">${NOMES[i]} · ${formatarDataCurta(dd.data)}</div>
    <div class="campo"><label>Título do dia</label><input type="text" name="dia${i}_titulo" value="${esc(dd.titulo)}"></div>
    <div class="campo"><label>Referência bíblica</label><input type="text" name="dia${i}_referencia" value="${esc(dd.referencia)}" placeholder="Ex.: Salmos 27:14"></div>
    <div class="campo"><label>Versículo</label><textarea name="dia${i}_versiculo" rows="2">${esc(dd.versiculo)}</textarea></div>
    <div class="campo"><label>Reflexão</label><textarea name="dia${i}_texto" rows="5">${esc(dd.texto)}</textarea></div>
    <div class="campo"><label>Pergunta pra compartilhar</label><textarea name="dia${i}_pergunta" rows="2">${esc(dd.pergunta)}</textarea></div>
    <div class="campo"><label>Oração</label><textarea name="dia${i}_oracao" rows="2">${esc(dd.oracao)}</textarea></div>
  </div>`;
}

/* ---------- Tela: Configurações do grupo (líder) ---------- */
function telaConfigGrupo(){
  const c = state.config || {};
  return `<form data-form="config-grupo">
    <div class="cartao">
      <div class="campo"><label>Nome do grupo</label><input type="text" name="nomeGrupo" value="${esc(c.nomeGrupo||'')}" required></div>
      <div class="campo"><label>Lema (opcional)</label><input type="text" name="lema" value="${esc(c.lema||'')}"></div>
      <button type="submit" class="btn btn-primary btn-block">Salvar</button>
    </div>
  </form>`;
}

/* ============ 11) EVENTOS (delegação num único listener por tipo) ============ */
async function entrarComUid(uid){
  try{
    const perfil = await carregarPerfilMembro(uid);
    if (!perfil){
      // a conta existe no login mas ficou sem o cadastro completo no banco
      // (ex.: uma tentativa anterior que caiu no meio do caminho) — em vez
      // de travar dizendo "não encontramos seu cadastro", pede só o nome
      // numa tela de verdade (nada de prompt() nativo, que muitos
      // navegadores — principalmente PWA instalado no celular — bloqueiam).
      const email = (FIREBASE_CONFIGURADO && auth && auth.currentUser) ? (auth.currentUser.email || '') : '';
      state.completar = { uid, email };
      state.carregando = false;
      render();
      return;
    }
    state.usuario = perfil;
    await garantirConfigInicial();
    state.membros = await colLista('membros');
    state.carregando = false;
    if (perfil.status === 'pendente'){ state.aba = 'pendente'; render(); }
    else await irParaHoje();
  }catch(err){
    console.error(err);
    state.carregando = false;
    state.usuario = null;
    render();
    showToast('Ops: ' + mensagemErro(err, 'não deu pra carregar seus dados — confira se o Firestore está criado e as regras liberam leitura/escrita.'));
  }
}

async function handleClick(e){
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  const d = el.dataset;
  try{
    if (a === 'ir-cadastro'){ e.preventDefault(); state.telaAuth='cadastro'; render(); }
    else if (a === 'ir-login'){ e.preventDefault(); state.telaAuth='login'; render(); }
    else if (a === 'sair'){ await fazerLogout(); }
    else if (a === 'voltar'){ state.aba = d.destino || 'mais'; render(); }
    else if (a === 'ir-aba'){
      if (d.aba === 'hoje') await irParaHoje();
      else if (d.aba === 'grupo') await abrirGrupo();
      else if (d.aba === 'conquistas') await abrirConquistas();
      else { state.aba = d.aba; render(); }
    }
    else if (a === 'selecionar-dia'){ await selecionarDia(d.data); }
    else if (a === 'toggle-checkin'){ await toggleCheckin(); }
    else if (a === 'ir-estudos'){ await abrirEstudos(); }
    else if (a === 'ir-config-grupo'){ state.aba = 'config-grupo'; state.subTelaVoltarPara = 'mais'; render(); }
    else if (a === 'remover-membro'){
      if (!confirm('Remover "' + d.nome + '" do grupo? Isso não desfaz check-ins ou comentários que já foram feitos, só tira a pessoa da lista.')) return;
      await colRemover('membros', d.uid);
      state.membros = state.membros.filter(m => m.id !== d.uid);
      await abrirGrupo();
      showToast(d.nome + ' removido(a) do grupo.');
    }
    else if (a === 'aprovar-membro'){
      await colAtualizar('membros', d.uid, { status: 'aprovado' });
      const m = state.membros.find(x => x.id === d.uid);
      if (m) m.status = 'aprovado';
      await abrirGrupo();
      showToast('✅ ' + d.nome + ' aprovado(a) — já pode entrar no grupo.');
    }
    else if (a === 'recusar-membro'){
      if (!confirm('Recusar a entrada de "' + d.nome + '"? A pessoa vai precisar digitar o nome de novo pra pedir entrada.')) return;
      await colRemover('membros', d.uid);
      state.membros = state.membros.filter(m => m.id !== d.uid);
      await abrirGrupo();
      showToast(d.nome + ' recusado(a).');
    }
    else if (a === 'checar-aprovacao'){ await verificarAprovacao(); }
    else if (a === 'criar-estudo-semana'){
      state.estudoForm = novoEstudoForm(d.segunda);
      state.subTelaVoltarPara = 'hoje';
      state.aba = 'estudo-form';
      render();
    }
    else if (a === 'novo-estudo'){
      const livre = proximaSegundaLivre(state.estudosLista||[]);
      state.estudoForm = novoEstudoForm(livre);
      state.subTelaVoltarPara = 'estudos';
      state.aba = 'estudo-form';
      render();
    }
    else if (a === 'editar-estudo'){
      const s = (state.estudosLista||[]).find(x => x.id === d.id);
      if (!s) return;
      state.estudoForm = novoEstudoForm(s.id, { titulo: s.titulo||'', texto: s.temaTexto||'', dias: (s.dias||[]).map(x => ({...x})) });
      state.subTelaVoltarPara = 'estudos';
      state.aba = 'estudo-form';
      render();
    }
    else if (a === 'escrever-manual'){
      state.estudoForm.dias = datasDaSemana(state.estudoForm.segunda).map(novoDiaVazio);
      render();
    }
    else if (a === 'mostrar-prompt-manual'){
      const ef = state.estudoForm;
      if (!ef.titulo.trim()){ showToast('Preencha o título primeiro.'); return; }
      ef.mostrarPromptManual = true;
      render();
    }
    else if (a === 'copiar-prompt-ia'){
      const txt = document.getElementById('prompt-ia-texto');
      if (txt){
        try{ await navigator.clipboard.writeText(txt.value); showToast('📋 Prompt copiado! Cole numa IA gratuita e depois volte com a resposta.'); }
        catch(err2){ showToast('Não deu pra copiar automaticamente — selecione o texto e copie manualmente.'); }
      }
    }
    else if (a === 'usar-resposta-ia'){
      try{
        const ef = state.estudoForm;
        const datas = datasDaSemana(ef.segunda);
        const dias = extrairDiasDeRespostaIA(ef.respostaIA).map((dd, i) => ({ ...dd, data: datas[i] }));
        ef.dias = dias;
        ef.mostrarPromptManual = false;
        showToast('✨ Devocional interpretado! Revise antes de publicar.');
        render();
      }catch(err2){
        showToast('Ops: ' + err2.message);
      }
    }
    else if (a === 'publicar-estudo'){ await publicarEstudo(); }
  }catch(err){
    console.error(err);
    showToast('Ops: ' + mensagemErro(err));
    render();
  }
}

function handleInput(e){
  const el = e.target;
  const form = el.closest('form');
  if (!form || !el.name) return;
  const tipo = form.dataset.form;
  if (tipo === 'cadastro' && (el.name in state.cadastroForm)) state.cadastroForm[el.name] = el.value;
  else if (tipo === 'login' && (el.name in state.loginForm)) state.loginForm[el.name] = el.value;
  else if (tipo === 'estudo' && state.estudoForm){
    const ef = state.estudoForm;
    if (el.name === 'titulo' || el.name === 'texto' || el.name === 'respostaIA') ef[el.name] = el.value;
    else {
      const m = el.name.match(/^dia(\d)_(\w+)$/);
      if (m && ef.dias) ef.dias[Number(m[1])][m[2]] = el.value;
    }
  }
}

async function handleChange(e){
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  if (a === 'mudar-segunda-estudo'){
    const ef = state.estudoForm;
    ef.segunda = segundaDaSemana(el.value);
    if (ef.dias){
      const novasDatas = datasDaSemana(ef.segunda);
      ef.dias = ef.dias.map((dd,i) => ({ ...dd, data: novasDatas[i] }));
    }
    render();
  }
  else if (a === 'mudar-role-membro'){
    const uid = el.dataset.uid;
    const novoRole = el.value;
    const m = state.membros.find(x => x.id === uid);
    if (m){
      m.role = novoRole;
      await colAtualizar('membros', uid, { role: novoRole });
      showToast(m.nome + ' agora é ' + (novoRole==='lider' ? 'líder' : 'membro') + '.');
    }
  }
}

async function handleSubmit(e){
  e.preventDefault();
  const form = e.target.closest('form');
  if (!form) return;
  const tipo = form.dataset.form;
  const fd = new FormData(form);
  try{
    if (tipo === 'login'){
      const email = (fd.get('email')||'').trim(), senha = fd.get('senha')||'';
      state.carregando = true; render();
      const uid = await fazerLogin(email, senha);
      await entrarComUid(uid);
    }
    else if (tipo === 'cadastro'){
      const dados = { nome: (fd.get('nome')||'').trim(), email: (fd.get('email')||'').trim(), senha: fd.get('senha')||'' };
      if (!dados.nome || !dados.email || !dados.senha){ showToast('Preencha todos os campos.'); return; }
      state.carregando = true; render();
      const uid = await fazerCadastro(dados);
      await entrarComUid(uid);
    }
    else if (tipo === 'completar-cadastro'){
      const nome = (fd.get('nome')||'').trim();
      if (!nome){ showToast('Digite seu nome.'); return; }
      state.carregando = true; render();
      const { uid, email } = state.completar;
      const perfil = await criarPerfilMembro(uid, { nome, email });
      state.completar = null;
      state.usuario = perfil;
      await garantirConfigInicial();
      state.membros = await colLista('membros');
      state.carregando = false;
      if (perfil.status === 'pendente'){ state.aba = 'pendente'; render(); }
      else await irParaHoje();
    }
    else if (tipo === 'comentario'){
      const texto = (fd.get('texto')||'').trim();
      if (!texto) return;
      const obj = { data: state.diaSelecionado, uid: state.usuario.id, nome: state.usuario.nome, texto, criadoEm: new Date().toISOString() };
      const id = await colAdicionar('comentarios', obj);
      state.comentariosDoDia.push({ id, ...obj });
      form.reset();
      const m = state.usuario;
      const patch = { pontos: (m.pontos||0) + PONTOS_COMENTARIO, totalComentarios: (m.totalComentarios||0) + 1 };
      Object.assign(m, patch);
      await colAtualizar('membros', m.id, patch);
      const novas = verificarNovasConquistas(m);
      if (novas.length){
        await colAtualizar('membros', m.id, { conquistas: m.conquistas });
        toastConquistas(novas);
      }
      render();
    }
    else if (tipo === 'config-grupo'){
      const nomeGrupo = (fd.get('nomeGrupo')||'').trim() || state.config.nomeGrupo;
      const lema = (fd.get('lema')||'').trim();
      state.config = { ...state.config, nomeGrupo, lema };
      await salvarConfig(state.config);
      showToast('Configurações salvas.');
      state.aba = 'mais';
      render();
    }
  }catch(err){
    console.error(err);
    state.carregando = false;
    showToast('Ops: ' + mensagemErro(err));
    render();
  }
}

function iniciarApp(){
  const app = document.getElementById('app');
  app.addEventListener('click', handleClick);
  app.addEventListener('submit', handleSubmit);
  app.addEventListener('change', handleChange);
  app.addEventListener('input', handleInput);

  if (FIREBASE_CONFIGURADO && auth){
    auth.onAuthStateChanged(async (user) => {
      if (user){ await entrarComUid(user.uid); }
      else { state.carregando = false; state.usuario = null; render(); }
    });
  } else {
    const uidSalvo = demoSessaoLer();
    if (uidSalvo){ entrarComUid(uidSalvo); }
    else { state.carregando = false; render(); }
  }
}

document.addEventListener('DOMContentLoaded', iniciarApp);
</script>
</body>
</html>
